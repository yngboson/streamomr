<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamOMR - 정답키</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header class="nav"></header>
<main class="wide">
<h1>정답키</h1>
<div id="msg"></div>
<div class="card">
  <h2>스캔한 정답 시트로 만들기</h2>
  <p class="mut small">교사가 정답을 칠한 시트를 먼저 스캔한 뒤, 아래에서 고르세요 (여러 페이지면 페이지마다 한 장씩). 현재 정답키를 대체합니다. 비워 둔 문항은 채점하지 않으며, 애매하게 읽힌 문항은 확인용으로 표시됩니다.</p>
  <ul id="recent" style="list-style:none;padding:0;max-height:220px;overflow:auto"></ul>
  <button id="fromscan" type="button" class="secondary">선택한 스캔으로 정답키 만들기</button>
</div>
<div class="card">
  <h2>정답 직접 입력</h2>
  <p class="mut small">선지를 눌러 정답을 고르세요. 여러 개를 고르면 "어느 것이든 정답"입니다. "모두 표시" 를 켜면 고른 선지를 모두 정확히 표시해야 정답입니다. 무응답은 항상 오답입니다. 정답을 고르지 않은 문항은 채점하지 않습니다.</p>
  <div class="row" style="margin-bottom:8px">
    <label style="margin:0">전체 배점 <input type="number" id="allpts" min="0" step="0.5" value="1" style="width:80px"></label>
    <button type="button" class="secondary" id="applypts">전체에 적용</button>
    <button type="button" class="secondary" id="clearall">모두 비우기</button>
  </div>
  <div class="tablewrap"><table class="t"><thead><tr><th>문항</th><th>정답</th><th>모두 표시</th><th>배점</th></tr></thead><tbody id="grid"></tbody></table></div>
  <div class="row" style="margin-top:10px"><button id="save" type="button">저장</button> <span id="savemsg"></span></div>
</div>
</main>
<script src="/static/common.js"></script>
<script>
if (needExam()) {
let EX = null, rows = {};   // rows[q] = {sel:Set, exact:bool, pts:number, raw:null|alts}
function fromServer(key, points) {
  rows = {};
  for (let q = 1; q <= EX.n_questions; q++) {
    const alts = key[q] || key[String(q)];
    const r = {sel: new Set(), exact: false, pts: points[q] ?? points[String(q)] ?? 1, raw: null};
    if (alts) {
      if (alts.length === 1 && alts[0].length > 1) { r.exact = true; alts[0].forEach(i => r.sel.add(i)); }
      else if (alts.every(a => a.length === 1)) alts.forEach(a => r.sel.add(a[0]));
      else r.raw = alts;     // mixed form: kept as is until the row is cleared
    }
    rows[q] = r;
  }
}
function toServer() {
  const key = {}, points = {};
  for (const q in rows) {
    const r = rows[q];
    if (r.raw) { key[q] = r.raw; points[q] = r.pts; continue; }
    if (!r.sel.size) continue;
    const s = Array.from(r.sel).sort((a, b) => a - b);
    key[q] = r.exact ? [s] : s.map(i => [i]);
    points[q] = r.pts;
  }
  return {key, points};
}
function renderGrid() {
  const L = EX.choice_labels;
  $('grid').innerHTML = Object.keys(rows).map(q => {
    const r = rows[q];
    const btns = r.raw ? `<span class="mut small">복합 정답: ${esc(r.raw.map(a => a.map(i => L[i]).join('+')).join(' / '))}</span> <button type="button" class="secondary small" data-q="${q}" data-reset="1">초기화</button>`
      : L.map((l, i) => `<button type="button" class="cbtn ${r.sel.has(i) ? 'on' : ''}" data-q="${q}" data-c="${i}">${esc(l)}</button>`).join(' ');
    return `<tr><td>${q}</td><td>${btns}</td><td>${r.raw ? '' : `<input type="checkbox" data-q="${q}" data-exact="1" ${r.exact ? 'checked' : ''}>`}</td>
      <td><input type="number" min="0" step="0.5" value="${r.pts}" data-q="${q}" data-pts="1" style="width:70px"></td></tr>`;
  }).join('');
}
$('grid').onclick = ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const r = rows[b.dataset.q];
  if (b.dataset.reset) { r.raw = null; r.sel = new Set(); r.exact = false; }
  else if (b.dataset.c !== undefined) { const i = Number(b.dataset.c); r.sel.has(i) ? r.sel.delete(i) : r.sel.add(i); }
  else return;
  renderGrid();
};
$('grid').onchange = ev => {
  const t = ev.target, r = rows[t.dataset.q]; if (!r) return;
  if (t.dataset.exact) r.exact = t.checked;
  if (t.dataset.pts) r.pts = Math.max(0, Number(t.value) || 0);
};
$('applypts').onclick = () => { const v = Math.max(0, Number($('allpts').value) || 0); for (const q in rows) rows[q].pts = v; renderGrid(); };
$('clearall').onclick = () => { for (const q in rows) { rows[q].sel = new Set(); rows[q].exact = false; rows[q].raw = null; } renderGrid(); };
$('save').onclick = async () => {
  try {
    const r = await put(`/api/exams/${EXAM_ID}/answer-key`, toServer());
    EX = r; showMsg('savemsg', `저장했습니다 (${r.n_keyed}문항).`, true); renderNav('key', r);
  } catch (e) { showMsg('savemsg', e.message, false); }
};
$('fromscan').onclick = async () => {
  const ids = Array.from(document.querySelectorAll('#recent input:checked')).map(x => Number(x.value));
  if (!ids.length) { showMsg('msg', '스캔을 선택하세요.', false); return; }
  if (EX.has_key && !confirm('현재 정답키를 대체합니다. 계속할까요?')) return;
  try {
    const r = await post(`/api/exams/${EXAM_ID}/answer-key/from-scan`, {scan_ids: ids, apply: true});
    EX = r.exam; fromServer(EX.key, EX.points); renderGrid(); renderNav('key', EX);
    let t = `정답키를 만들었습니다 (${EX.n_keyed}문항).`;
    if (r.result.skipped.length) t += ` 무응답이라 제외: ${r.result.skipped.join(', ')}번.`;
    if (r.result.ambiguous.length) t += ` 애매하게 읽혀 확인 필요: ${r.result.ambiguous.join(', ')}번.`;
    showMsg('msg', t, true);
  } catch (e) { showMsg('msg', e.message, false); }
};
async function load() {
  try {
    EX = await api(`/api/exams/${EXAM_ID}/answer-key`);
    fromServer(EX.key, EX.points); renderGrid(); renderNav('key', EX);
    const sc = await api(`/api/exams/${EXAM_ID}/scans?limit=40`);
    $('recent').innerHTML = sc.map(s => `<li style="padding:4px 0;border-bottom:1px solid #2a313b"><label style="margin:0;display:flex;gap:8px;align-items:center;color:var(--fg)">
      <input type="checkbox" value="${s.scan_id}"> <img src="${img(s.scan_id, 'warped', 60)}" alt="" style="height:36px;border-radius:3px" onerror="this.style.display='none'">
      #${s.scan_id} &middot; ${s.page + 1}페이지 &middot; 수험번호 ${esc(s.student_id ?? '(미확인)')} &middot; <span class="mut small">${fmtTime(s.created_at)}</span></label></li>`).join('') ||
      '<li class="mut">아직 스캔이 없습니다.</li>';
  } catch (e) { showMsg('msg', e.message, false); }
}
renderNav('key');
load();
}
</script></body></html>
