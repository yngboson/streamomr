 = 8                    # paper samples per bubble\nSECT_PCT = 97                 # robust high percentile of a sector (rings / glyphs only ever darken it; blur bleeds the ring into\n                              # the annulus, and a lower percentile of its few pixels then reads the paper 4-5 % dark)\nOUTLIER_TOL = 0.08            # an isolated sector this far from the mean of its neighbours is repaired\nPLANE_TOL = 0.07              # samples on one plane within this (relative) = smooth illumination\nEDGE_TOL = 0.05               # step regime: paper level may differ this much across the disc, else the edge crosses it\nCLUSTER_TOL = 0.06            # sector values within this (relative) belong to the same illumination\nSIGMA_MM = 1.3                # spatial support of one sector sample over the disc\nPAPER_GAIN = 1.06             # multiplies the paper level: matches the shipped envelope's slight upward bias (1.10 recovers a little ID read-rate but turns ghosts into marks: rejected)\nMIN_PAPER = 20.0              # gray levels: darker paper carries no signal\nNEIGHBOUR_MM = 9.0            # inked neighbours this close can darken the annulus\nHOT_DARKNESS = 0.2            # mean disc darkness (vs the median paper level) above which a bubble counts as inked\nHALO_MAX = 1.12               # a mark's own blur halo lifts the paper level by at most this (measured 4-8 % at sigma ~0.4 mm)\nHALO_NEIGHBOURS = 4           # nearest un-inked bubbles whose paper level stands in for an inked bubble's own\nHALO_REACH_MM = 12.0          # ... within this distance (a gradient or edge further away says nothing about this bubble)\nC_REF_PCT = 60                # page reference of the ring darkness: this percentile over all bubbles\nC_NEIGHBOURS = 14             # ring-darkness median over this many nearest bubbles\nC_APPLY = 0.88                # contrast below this (relative to page) is corrected ...\nC_NOISE_SIGMAS = 3.0          # ... and only below this many robust sigmas of the page's own contrast scatter (see below)\nC_FLAG = 0.55                 # ... below this the bubble is flagged: marks may vanish in the glare\nC_MAX_GAIN = 1.0 / C_FLAG\n\n_cache: Dict[tuple, tuple] = {}\n\n\n# ------------------------------------------------------------------------------ geometry caches\ndef _annulus(R_mm: float, ppm: float):\n    key = (\"ann\", round(R_mm, 3), round(ppm, 3))\n    if key not in _cache:\n        r_out = (R_mm + ANN_OUT_MM) * ppm\n        h = int(np.ceil(r_out)) + 1\n        y, x = np.mgrid[-h:h + 1, -h:h + 1]\n        rr = np.hypot(x, y) / ppm\n        m = (rr >= R_mm + ANN_IN_MM) & (rr <= R_mm + ANN_OUT_MM)\n        ang = np.mod(np.arctan2(y, x), 2 * np.pi)\n        sec = np.floor(ang / (2 * np.pi / N_SECT)).astype(int) % N_SECT\n        y, x, sec = y[m], x[m], sec[m]\n        groups = [np.nonzero(sec == s)[0] for s in range(N_SECT)]\n        _cache[key] = (y, x, groups)\n    return _cache[key]\n\n\ndef _ring(R_mm: float, ppm: float):\n    \"\"\"Offsets of the printed ring line (for the contrast measurement).\"\"\"\n    key = (\"ring\", round(R_mm, 3), round(ppm, 3))\n    if key not in _cache:\n        h = int(np.ceil((R_mm + 0.6) * ppm))\n        y, x = np.mgrid[-h:h + 1, -h:h + 1]\n        rr = np.hypot(x, y) / ppm\n        m = np.abs(rr - R_mm) <= 0.22\n        _cache[key] = (y[m], x[m])\n    return _cache[key]\n\n\ndef _sector_geometry(R_mm: float, disc_dy: np.ndarray, disc_dx: np.ndarray, ppm: float):\n    \"\"\"Normalised weights W[k, p] of sector sample k over disc pixel p.\"\"\"\n    key = (\"W\", round(R_mm, 3), round(ppm, 3), len(disc_dy))\n    if key not in _cache:\n        th = (np.arange(N_SECT) + 0.5) * 2 * np.pi / N_SECT\n        rs = R_mm + 0.5 * (ANN_IN_MM + ANN_OUT_MM)\n        sx, sy = rs * np.cos(th), rs * np.sin(th)\n        qx, qy = disc_dx / ppm, disc_dy / ppm\n        d2 = (qx[None, :] - sx[:, None]) ** 2 + (qy[None, :] - sy[:, None]) ** 2\n        W = np.exp(-d2 / (2 * SIGMA_MM ** 2)).astype(np.float32)\n        _cache[key] = (W, sx, sy)\n    return _cache[key]\n\n\ndef _gather(img: np.ndarray, px: np.ndarray, py: np.ndarray, dy: np.ndarray, dx: np.ndarray) -> np.ndarray:\n    H, W = img.shape\n    if len(px) and px.min() + dx.min() >= 0 and px.max() + dx.max() < W and py.min() + dy.min() >= 0 and py.max() + dy.max() < H \\\n            and img.flags.c_contiguous:\n        # every window lies inside the image: one flat take instead of two clipped fancy indexings\n        return np.take(img, (dy[None, :] + py[:, None]) * W + (dx[None, :] + px[:, None])).astype(np.float32)\n    ys = np.clip(dy[None, :] + py[:, None], 0, H - 1)\n    xs = np.clip(dx[None, :] + px[:, None], 0, W - 1)\n    return img[ys, xs].astype(np.float32)\n\n\n# ------------------------------------------------------------------------------ paper samples\ndef paper_samples(img: np.ndarray, centers_mm, diameter_mm: float, ppm: float):\n    \"\"\"(n, N_SECT) gray level of blank paper in the annulus around every bubble, after repairing isolated outliers.\"\"\"\n    c = np.asarray(centers_mm, np.float64) * ppm\n    px = np.round(c[:, 0]).astype(int)\n    py = np.round(c[:, 1]).astype(int)\n    ay, ax, groups = _annulus(diameter_mm / 2, ppm)\n    pix = _gather(img, px, py, ay, ax)\n    v = np.stack([pct_rows(pix[:, g], SECT_PCT) for g in groups], axis=1)\n    # an isolated odd sector (text glyph, streak, a neighbour's smudge): its two neighbours agree and it does not\n    prv, nxt = np.roll(v, 1, axis=1), np.roll(v, -1, axis=1)\n    m = 0.5 * (prv + nxt)\n    odd = (np.abs(v - m) > OUTLIER_TOL * np.maximum(m, 1.0)) & (np.abs(prv - nxt) < 0.5 * OUTLIER_TOL * np.maximum(m, 1.0))\n    return np.where(odd, m, v).astype(np.float32)\n\n\ndef _plane_basis(R_mm: float):\n    \"\"\"Fixed least-squares plane fit through the sector sample positions: (A (K,3), pinv (3,K), sx, sy).\"\"\"\n    key = (\"plane\", round(R_mm, 3))\n    if key not in _cache:\n        th = (np.arange(N_SECT) + 0.5) * 2 * np.pi / N_SECT\n        rs = R_mm + 0.5 * (ANN_IN_MM + ANN_OUT_MM)\n        sx, sy = rs * np.cos(th), rs * np.sin(th)\n        A = np.stack([np.ones(N_SECT), sx, sy], 1)\n        _cache[key] = (A, np.linalg.pinv(A), sx, sy)\n    return _cache[key]\n\n\ndef _wplane(v, w, A):\n    \"\"\"Weighted least-squares plane through the samples, batched: coef (n, 3).\"\"\"\n    AtA = np.einsum(\"nk,ki,kj->nij\", w, A, A)\n    Atv = np.einsum(\"nk,ki,nk->ni\", w, A, v)\n    AtA = AtA + 1e-6 * np.eye(3)[None]\n    return np.linalg.solve(AtA, Atv[..., None])[..., 0]\n\n\ndef paper_model(v: np.ndarray, R_mm: float, dy: np.ndarray, dx: np.ndarray, ppm: float, W: np.ndarray,\n                explained: Optional[np.ndarray] = None):\n    \"\"\"Paper level of every disc pixel from the K annulus samples -> (P (n, m), consistent (n,), is_step (n,)).\n\n    * smooth illumination (a gradient, a soft penumbra, raking light): the samples lie on a plane within\n      ``PLANE_TOL``; the plane is evaluated at each disc pixel, so even a 30 % slope across the bubble is undone.\n      Up to two inlier-violating samples are ignored when they are junk, i.e. not an adjacent pair (a text glyph,\n      a streak, a neighbour's smudge; an adjacent pair is what a shadow edge cutting the annulus looks like).\n    * otherwise there is a step (hard shadow edge) near the bubble: samples are clustered by value, each disc pixel\n      takes the cluster with the most spatial support at that pixel.  If different pixels of the disc pick\n      clusters with different paper levels the edge runs through the bubble: ``consistent`` is False and the caller\n      must flag.\"\"\"\n    n = len(v)\n    A, _, _, _ = _plane_basis(R_mm)\n    scale = np.maximum(v.mean(1), 1.0)\n    w = np.ones_like(v) if explained is None else (~explained).astype(np.float32)\n    w[w.sum(1) < 4] = 1.0\n    coef = _wplane(v, w, A)\n    for _ in range(2):                                            # drop the worst sample while the fit is bad\n        resid = np.abs(v - coef @ A.T)\n        bad = (resid * w).max(1) > PLANE_TOL * scale\n        if not bad.any():\n            break\n        worst = np.argmax(resid * w, axis=1)\n        w[bad, worst[bad]] = 0.0\n        coef = _wplane(v, w, A)\n    signed = v - coef @ A.T\n    resid = np.abs(signed)\n    out = (w == 0) & (True if explained is None else ~explained)\n    # an adjacent pair of ignored samples is what a shadow edge cutting the annulus looks like - unless both are\n    # DARKER than the fit: then the bubble is on the bright side and the dark pair is a neighbour's overflowing mark\n    # or printed furniture (it can only darken); a nearby edge then touches the disc by < 0.7 mm at worst.\n    adj = (out & np.roll(out, 1, axis=1)).any(1) & ~(~out | (signed < 0)).all(1)\n    plane_ok = ((resid * w).max(1) <= PLANE_TOL * scale) & ~adj\n    qx, qy = dx / ppm, dy / ppm\n    P = coef[:, 0:1] + coef[:, 1:2] * qx[None, :] + coef[:, 2:3] * qy[None, :]\n    consistent = np.ones(n, bool)\n    step = ~plane_ok\n    if step.any():\n        vs = v[step]\n        ref = np.maximum(vs, 1.0)\n        C = (np.abs(vs[:, None, :] - vs[:, :, None]) <= CLUSTER_TOL * ref[:, :, None]).astype(np.float32)   # [b,k,j]\n        S = np.matmul(C, W)                                                                                 # support of cluster k at pixel p\n        kbest = np.argmax(S, axis=1)                                                                        # (ns, m)\n        Cb = C[np.arange(len(vs))[:, None], kbest]                                                          # (ns, m, K)\n        Wm = Cb * W.T[None]\n        Pc = (Wm * vs[:, None, :]).sum(-1) / np.maximum(Wm.sum(-1), 1e-6)                                   # (ns, m)\n        consistent[step] = (Pc.max(1) - Pc.min(1)) <= EDGE_TOL * np.maximum(Pc.max(1), 1.0)\n        P[step] = Pc\n    return np.maximum(P, 1.0), consistent, step\n\n\ndef explained_by_neighbours(centers_mm, hot: np.ndarray, v: np.ndarray, ref: np.ndarray):\n    \"\"\"(n, K) bool: annulus sectors that face an inked neighbour bubble and are darker than the bubble's typical paper.\n    A neighbour's mark overflowing its ring (or its blur) darkens exactly the sectors that look at it; a shadow edge\n    does not care where the neighbours' marks are.  Such a sector is not paper: leave it out of the fit.\"\"\"\n    cc = np.asarray(centers_mm, np.float64)\n    n = len(cc)\n    out = np.zeros((n, N_SECT), bool)\n    hi = np.nonzero(hot)[0]\n    if hi.size == 0:\n        return out\n    d = cc[hi][None, :, :] - cc[:, None, :]                        # (n, nh, 2)\n    dist = np.hypot(d[..., 0], d[..., 1])\n    near = (dist > 1e-6) & (dist < NEIGHBOUR_MM)\n    r, c = np.nonzero(near)                                        # only the (bubble, inked neighbour) pairs that are close are worked out\n    if r.size == 0:\n        return out\n    dr = d[r, c]\n    dist = dist[r, c]\n    ang = np.mod(np.arctan2(dr[:, 1], dr[:, 0]), 2 * np.pi)\n    half = np.arcsin(np.clip(3.6 / np.maximum(dist, 3.7), 0, 1))     # angular half-width of a (overflowing) mark\n    centre = (np.arange(N_SECT) + 0.5) * 2 * np.pi / N_SECT\n    dang = np.abs((ang[:, None] - centre[None, :] + np.pi) % (2 * np.pi) - np.pi)    # (pairs, K)\n    hit = (dang <= (half[:, None] + np.pi / N_SECT)).astype(np.uint8)\n    starts = np.flatnonzero(np.r_[True, r[1:] != r[:-1]])             # r is sorted: reduce the pairs of each bubble\n    anyhit = np.zeros((n, N_SECT), bool)\n    anyhit[r[starts]] = np.bitwise_or.reduceat(hit, starts, axis=0) != 0\n    return anyhit & (v < 0.93 * ref[:, None])\n\n\ndef halo_lift(centers_mm, hot: np.ndarray, level: np.ndarray) -> np.ndarray:\n    \"\"\"(n,) factor that undoes a mark's own blur halo in the paper samples of an inked bubble.\n\n    Ink only ever darkens, and blur (a defocused or moving camera, a tilted sheet) spreads a mark past its printed\n    ring: all eight annulus samples of an inked bubble are then a few percent too dark, its darkness comes out\n    too low, and the mark looks weaker than the page's others (measured: -4..-8 % of paper level at blur, none sharp).\n    The un-inked bubbles around it have the real paper level; the lift is their median relative to the bubble's own\n    level, never below 1 and never above HALO_MAX (a shadow edge between them must not invent a lot of darkness).\"\"\"\n    cc = np.asarray(centers_mm, np.float64)\n    lift = np.ones(len(cc))\n    blank = np.nonzero(~hot)[0]\n    hi = np.nonzero(hot)[0]\n    if hi.size == 0 or blank.size == 0:\n        return lift\n    d = np.hypot(*(cc[hi][:, None, :] - cc[blank][None, :, :]).transpose(2, 0, 1))      # (nh, nb)\n    d = np.where(d <= HALO_REACH_MM, d, np.inf)\n    k = min(HALO_NEIGHBOURS, blank.size)\n    nn = np.argpartition(d, k - 1, axis=1)[:, :k]\n    ok = np.isfinite(np.take_along_axis(d, nn, axis=1))\n    lv = np.where(ok, level[blank][nn], np.nan)\n    with np.errstate(all=\"ignore\"):\n        nb = np.nanmedian(lv, axis=1)\n    lift[hi] = np.clip(np.where(np.isfinite(nb), nb / np.maximum(level[hi], 1.0), 1.0), 1.0, HALO_MAX)\n    return lift\n\n\n# ------------------------------------------------------------------------------ contrast (glare)\ndef contrast_field(img: np.ndarray, centers_mm, diameter_mm: float, ppm: float, paper: np.ndarray):\n    \"\"\"Local contrast factor c per bubble (1 = like the page's typical bubble ring, < 1 = glare / haze).\n\n    The printed ring line of every bubble is a black of the same strength everywhere on the sheet.  Its darkness\n    relative to the bubble's paper level, normalised by the page's reference, is c; the median over the nearest\n    bubbles makes it a smooth, outlier-proof field (a marked bubble's ring is darker, an erased one lighter: both\n    are a minority among their neighbours).\"\"\"\n    cc = np.asarray(centers_mm, np.float64)\n    n = len(cc)\n    c = cc * ppm\n    px = np.round(c[:, 0]).astype(int)\n    py = np.round(c[:, 1]).astype(int)\n    ry, rx = _ring(diameter_mm / 2, ppm)\n    pix = _gather(img, px, py, ry, rx)\n    dark = 1.0 - pct_rows(pix, 25) / np.maximum(paper, 1.0)     # the dark quartile of the ring line\n    ref = float(np.percentile(dark, C_REF_PCT))\n    if ref < 0.03:\n        return np.ones(n, np.float32), ref\n    rel = dark / ref\n    k = min(C_NEIGHBOURS, n)\n    if n <= k:\n        return np.full(n, float(np.median(rel)), np.float32), ref\n    d2 = ((cc[:, None, :] - cc[None, :, :]) ** 2).sum(-1)\n    nn = np.argpartition(d2, k - 1, axis=1)[:, :k]\n    return np.median(rel[nn], axis=1).astype(np.float32), ref\n\n\n# ------------------------------------------------------------------------------ tiles (user idea D)\ndef _tile_paper(img: np.ndarray, px: np.ndarray, py: np.ndarray, ppm: float, tile_mm: float, pct: float = 92.0):\n    \"\"\"Paper level from the tile each bubble centre falls into: a high percentile of all pixels of the tile.\"\"\"\n    H, W = img.shape\n    t = max(int(round(tile_mm * ppm)), 4)\n    ny, nx = (H + t - 1) // t, (W + t - 1) // t\n    small = cv2.resize(img, None, fx=0.25, fy=0.25, interpolation=cv2.INTER_AREA)\n    ts = max(t // 4, 1)\n    out = np.zeros((ny, nx), np.float32)\n    for j in range(ny):\n        for i in range(nx):\n            blk = small[j * ts:(j + 1) * ts, i * ts:(i + 1) * ts]\n            out[j, i] = np.percentile(blk, pct) if blk.size else 255.0\n    return out[np.clip(py // t, 0, ny - 1), np.clip(px // t, 0, nx - 1)]\n\n\n# ------------------------------------------------------------------------------ entry point\nMETHODS = (\"B\", \"D10\", \"D20\", \"F\", \"E\")        # E is the shipped method (\"final\" is an alias)\n\n\ndef bubble_darkness(smooth: np.ndarray, centers_mm, diameter_mm: float, ppm: float, method: str = \"final\",\n                    bg: Optional[np.ndarray] = None, bgscale: float = 1.0):\n    \"\"\"Per-pixel darkness of the inner disc of every bubble, 0 = paper, 1 = black -> (D (n, npix), reliable (n,)).\n\n    method: B   per-bubble scalar paper level = median of the 8 annulus samples (layout-guided sampling only)\n            D10 / D20  tiles of 10 / 20 mm: tile paper level = high percentile of the tile (user idea, for comparison)\n            F   per-pixel plane / cluster paper model + flag where an edge crosses the disc\n            E   F + local contrast correction and glare flag (the method to use; \"final\" is an alias)\"\"\"\n    from .recognize import _disc\n    c = np.asarray(centers_mm, np.float64) * ppm\n    px = np.round(c[:, 0]).astype(int)\n    py = np.round(c[:, 1]).astype(int)\n    n = len(px)\n    dy, dx, _ = _disc(INNER_DISC_FRAC * diameter_mm / 2 * ppm)\n    pix = _gather(smooth, px, py, dy, dx)\n    reliable = np.ones(n, bool)\n    if method in (\"D10\", \"D20\"):\n        P = np.maximum(_tile_paper(smooth, px, py, ppm, 10.0 if method == \"D10\" else 20.0), 1.0)[:, None]\n        return 1.0 - pix / P, reliable\n    v = paper_samples(smooth, centers_mm, diameter_mm, ppm)\n    if method == \"B\":\n        P = np.maximum(np.median(v, axis=1), 1.0) * PAPER_GAIN\n        return 1.0 - pix / P[:, None], reliable\n    W, _, _ = _sector_geometry(diameter_mm / 2, dy, dx, ppm)\n    ref = np.median(v, axis=1)\n    hot = (1.0 - pix.mean(1) / np.maximum(ref, 1.0)) > HOT_DARKNESS\n    v = v * halo_lift(centers_mm, hot, ref)[:, None]\n    ref = np.median(v, axis=1)\n    expl = explained_by_neighbours(centers_mm, hot, v, ref)\n    expl |= hot[:, None] & (v < 0.93 * ref[:, None])      # a mark may overflow its own ring into the annulus\n    expl[expl.sum(1) > 3] = False                          # more than 3 dark sectors is a shadow edge, not an overflow\n    P, consistent, _ = paper_model(v, diameter_mm / 2, dy, dx, ppm, W, expl)\n    reliable = consistent & (v.max(1) >= MIN_PAPER)\n    P = P * PAPER_GAIN\n    D = 1.0 - pix / P\n    if method[0] == \"E\" or method == \"final\":\n        c_flag = int(method[1:]) / 100.0 if method[1:].isdigit() else C_FLAG\n        c_loc, _ = contrast_field(smooth, centers_mm, diameter_mm, ppm, np.median(v, axis=1))\n        # The ring is a thin line: at low resolution / blur its darkness is a weak signal (0.1 of paper vs 0.26 sharp),\n        # so c scatters by 10-20 % with no glare at all.  The correction is one-sided (it only raises darkness), so\n        # applying it to that scatter inflates a random fifth of the marks and with them the page's ink level, and\n        # every ordinary mark then looks weak by comparison.  Correct only what stands out from the page's own scatter.\n        sigma = 1.4826 * float(np.median(np.abs(c_loc - np.median(c_loc))))\n        c_apply = min(C_APPLY, float(np.median(c_loc)) - C_NOISE_SIGMAS * sigma)\n        gain = np.where(c_loc < c_apply, 1.0 / np.clip(c_loc, C_FLAG, 1.0), 1.0)\n        D = D * gain[:, None]\n        reliable &= c_loc >= c_flag\n    D = np.where(reliable[:, None], D, 0.0).astype(np.float32)\n    return D, reliable\n", "omr/ink.py": "\"\"\"Self-calibrating mark-darkness (\"ink\") floor.  Pure functions over darkness arrays; nothing here does I/O.\n\nProblem\n-------\n``omr.recognize`` keeps an *ink floor*: a mark must be at least ``ABS_INK_FRAC`` (0.45) of the printed black to\ntake part in the page's ink level, and the page ink level (never below the floor) scales the per-pixel\nfill ramp.  A fixed 0.45 is a compromise between very light pencil (which it rejects as \"weak\" and flags) and\nerasure ghosts / paper noise (which a lower floor would start to read).  The right value depends on the sheet: how light the\npencil is, how much was erased, how pale the printer's black is.\n\nMethod\n------\nThe sheet itself says what a mark is.  Every answer question and every ID / subject column has exactly one mark\nor none: the *darkest* bubble of a row (\"top-1\") is a mark or a blank row's strongest noise, the *second\ndarkest* (\"top-2\") is a non-mark almost always (ghost, stray, paper noise; ID / subject rows are the cleanest source).\nThe ink measure of a bubble is ``bubble_ink`` (85th percentile of its disc darkness, same as ``_ink_level``).\n\n1. ``g`` = a high quantile (90 %) of the top-2 population: how dark non-marks get on this sheet and this light.\n2. Candidate floors are scanned over the physical bounds [LO_FRAC, HI_FRAC] x printed black; each candidate is\n   scored by the rows that have exactly one bubble above it (what a sheet should look like) minus\n   MULTI_PENALTY x rows with two or more above it (a floor that is too low turns ghosts into multi marks).\n   Floors below ``g + MARGIN_FRAC x black`` are not allowed (erased ghosts must not be read).\n3. The chosen floor is the lowest point of the best-scoring plateau (just above the ghosts): every sheet keeps as\n   many light marks as the evidence allows.  (The middle of the plateau was measured to flag pale pencil needlessly.)\n4. *Separation* = (25th percentile of the marks' top-1 - g) / black.  Too few marks or separation below\n   MIN_SEPARATION: the sheet gives no reliable evidence, the caller keeps today's rule (DEFAULT_FRAC x black) exactly\n   (source \"default\").  Tightening the strength requirement there was measured and does not pay: it flags more\n   pencil marks on mixed sheets and removes no silent error, so ``weak`` is reported (calibration) but not acted on.\n\nBounds (relative to the printed black measured on the same frame by the header guard cells / marker borders)\n  LO_FRAC = 0.45  today's fixed rule.  Lowering below it was measured (0.30, 0.38) and rejected: on a very light pencil\n                  sheet it flags less but reads erasure ghosts (erased gray 190-232 overlaps very light graphite\n                  140-185 in the synthetic bench) and silent errors rise.  Only ``LO_FRAC`` needs changing to allow it.\n  HI_FRAC = 0.60  above this a light-pencil mark (graphite 110-150 of 255, 0.45-0.6 of a toner black) is rejected.\nThe floor is therefore never lower than today's and rises where the sheet's own ghosts demand it.\n\nFusion\n------\nThe floor is chosen per frame (every frame's fill is computed relative to it) and ``PageRaw.ink`` already carries\nthe median over the track; add ``ink_source`` / ``ink_separation`` the same way (source: any 'default' frame ->\n'default'; separation: median).  Nothing else is needed because fills, not darkness arrays, are what gets fused.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Dict, List, Optional, Sequence, Tuple\n\nimport numpy as np\n\nfrom . import layout as lay\nfrom .fastops import pct1, pct_rows\n\nMARKER_CELLS = 6                 # ArUco 4x4 pattern incl. its black border: 6 x 6 cells\nMARKER_BLACK_PERCENTILE = 75     # of the border pixels' darkness: the darkest quartile (robust to white toner streaks)\nBUBBLE_PERCENTILE = 85           # per-bubble ink measure: as omr.recognize._ink_level\n\n\ndef bubble_ink(D: np.ndarray) -> np.ndarray:\n    \"\"\"Per-bubble ink measure from an (n_bubbles, n_pixels) darkness array: the 85th percentile of the disc.\"\"\"\n    return pct_rows(D, BUBBLE_PERCENTILE).astype(np.float32)\n\n\ndef marker_border_samples(warped: np.ndarray, bg: np.ndarray, bgscale: float, ppm: float, page: int,\n                          marker_ids: Sequence[int]) -> Dict[int, np.ndarray]:\n    \"\"\"Darkness (0 = local paper, 1 = black) of the pixels in the central half of every black border cell of each\n    detected marker, per marker id.  `bg`/`bgscale`: the paper-level map supplied by the caller (today\n    e.g. one built from omr.illum's paper samples); this module never estimates paper level or lighting itself,\n    pipeline order is illum -> ink.\"\"\"\n    from . import markers as mk\n    out: Dict[int, np.ndarray] = {}\n    H, W = warped.shape\n    rects = lay.marker_rects(page)\n    for corner, (x, y, w, h) in rects.items():\n        mid = mk.marker_id(page, corner)\n        if mid not in marker_ids:\n            continue\n        cw, ch = w / MARKER_CELLS, h / MARKER_CELLS\n        vals = []\n        for i in range(MARKER_CELLS):\n            for j in range(MARKER_CELLS):\n                if 0 < i < MARKER_CELLS - 1 and 0 < j < MARKER_CELLS - 1:\n                    continue\n                x0, x1 = (x + (j + 0.25) * cw) * ppm, (x + (j + 0.75) * cw) * ppm\n                y0, y1 = (y + (i + 0.25) * ch) * ppm, (y + (i + 0.75) * ch) * ppm\n                xs, xe = int(round(x0)), max(int(round(x1)), int(round(x0)) + 1)\n                ys, ye = int(round(y0)), max(int(round(y1)), int(round(y0)) + 1)\n                if xs < 0 or ys < 0 or xe > W or ye > H:\n                    continue\n                cell = warped[ys:ye, xs:xe].astype(np.float32)\n                b = bg[int(np.clip(round(0.5 * (ys + ye) * bgscale), 0, bg.shape[0] - 1)),\n                       int(np.clip(round(0.5 * (xs + xe) * bgscale), 0, bg.shape[1] - 1))]\n                vals.append((1.0 - cell / max(float(b), 1.0)).ravel())\n        if vals:\n            out[mid] = np.concatenate(vals)\n    return out\n\n\n# ---------------------------------------------------------------------------------------------- auto floor\nLO_FRAC, HI_FRAC = 0.45, 0.60\nDEFAULT_FRAC = 0.45              # today's fixed rule (omr.recognize.ABS_INK_FRAC)\nMARGIN_FRAC = 0.06               # floor stays this far (x black) above the ghosts' 90th percentile\nGHOST_PCT = 95\nMULTI_PENALTY = 3.0\nMIN_MARK_ROWS = 5\nMIN_SEPARATION = 0.08            # x black\nN_CANDIDATES = 31\n\n\n@dataclass\nclass AutoInk:\n    floor: float                 # darkness floor to use in place of ABS_INK_FRAC * black\n    source: str                  # \"auto\" | \"default\"\n    separation: float            # (marks' 25th percentile - ghosts' 90th percentile) / black; 0 when unknown\n    weak: bool                   # True: little evidence (reported in calibration only)\n\n\ndef choose_floor(rows: Sequence[np.ndarray], black: float) -> AutoInk:\n    \"\"\"Per-sheet ink floor from the rows of one page: each row is the ink measures (``bubble_ink``) of the bubbles\n    of ONE answer question or ONE ID / subject digit column.\"\"\"\n    default = AutoInk(DEFAULT_FRAC * black, \"default\", 0.0, True)\n    rows = [np.sort(np.asarray(r, np.float32))[::-1] for r in rows if len(r) >= 2]\n    if len(rows) < MIN_MARK_ROWS:\n        return default\n    w = min(len(r) for r in rows)\n    M = np.stack([r[:w] for r in rows])                 # (rows, w) descending\n    t1, t2 = M[:, 0], M[:, 1]\n    lo, hi = LO_FRAC * black, HI_FRAC * black\n    g = float(np.percentile(t2, GHOST_PCT))\n    floor_min = max(lo, g + MARGIN_FRAC * black)\n    if floor_min >= hi:\n        return default\n    cand = np.linspace(floor_min, hi, N_CANDIDATES)\n    n1 = np.array([((M >= t).sum(1) == 1).sum() for t in cand], np.float32)\n    n2 = np.array([((M >= t).sum(1) >= 2).sum() for t in cand], np.float32)\n    score = n1 - MULTI_PENALTY * n2\n    best = score.max()\n    plateau = np.nonzero(score >= best - 0.01 * len(rows))[0]\n    # the run of the plateau around the best candidate; its lowest point is the floor\n    k0 = int(np.argmax(score))\n    a = b = k0\n    while a - 1 in plateau:\n        a -= 1\n    while b + 1 in plateau:\n        b += 1\n    floor = float(cand[a])           # just above the ghosts: the lowest floor that still has the best score\n    marks = t1[t1 >= floor]\n    if len(marks) < MIN_MARK_ROWS:\n        return default\n    sep = float((np.percentile(marks, 25) - g) / max(black, 1e-6))\n    if sep < MIN_SEPARATION:\n        return AutoInk(DEFAULT_FRAC * black, \"default\", sep, True)\n    return AutoInk(floor, \"auto\", sep, False)\n\n\n# ---------------------------------------------------------------------------------------------- local ink level\nLOCAL_RADII = (4, 8, 16)         # answer rows around a row whose marks set its ink level (grown until LOCAL_MIN_MARKS found)\nLOCAL_MIN_MARKS = 3\nLOCAL_DEADBAND = 0.15            # the level only goes DOWN, and only when it is this fraction under the page level (a region of lighter marks);\n                                 # a darker or similar region keeps the page level (single-instrument sheets stay exactly as they were)\nLOCAL_PCT = 75                   # windowed rows: this percentile of the neighbourhood's marks (the median is dragged down by a cluster of erasure ghosts)\n\n\ndef local_levels(row_marks: Sequence[float], floor: float, fallback: float,\n                 sections: Sequence[Tuple[Sequence[int], bool]]) -> np.ndarray:\n    \"\"\"Ink level per row from the marks of its own neighbourhood instead of the whole page.\n\n    One page can carry several instruments (pencil ID block, dark pen answers, a dying pen swapped for a fresh one half-way).\n    A single page-wide level makes the lighter instrument look \"weak\" (strength = darkness / ink level).  `row_marks`: per\n    row, the ink measure of its darkest bubble (0 when it has no hot bubble).  A row with a mark at or above `floor` (which\n    the sheet's own ghosts keep above erasure residue, see `choose_floor`) is judged by that mark's own darkness: a mark\n    lighter than its neighbours is a mark, not a \"weak\" one.  Other rows (blank, ghosts): median of the marks in their\n    neighbourhood, clipped below at `floor`; too few marks (fewer than `LOCAL_MIN_MARKS`) in reach: `fallback` (the page level).  `sections`: (row indices in reading order, windowed) -\n    windowed (answers): the neighbourhood is +-r rows, r from LOCAL_RADII, the first with enough marks; not windowed\n    (the ID + subject block): the whole section is one neighbourhood.\"\"\"\n    rm = np.asarray(row_marks, np.float32)\n    out = np.full(len(rm), fallback, np.float32)\n    for idx, windowed in sections:\n        idx = np.asarray(idx, int)\n        if not len(idx):\n            continue\n        v = rm[idx]\n        ok = v >= floor\n        for j in range(len(idx)):\n            for r in (LOCAL_RADII if windowed else (len(idx),)):\n                lo, hi = max(0, j - r), min(len(idx), j + r + 1)\n                w = v[lo:hi][ok[lo:hi]]\n                if len(w) >= LOCAL_MIN_MARKS:\n                    lvl = max(floor, float(pct1(w, LOCAL_PCT if windowed else 50)))\n                    out[idx[j]] = lvl if lvl < (1.0 - LOCAL_DEADBAND) * fallback else fallback\n                    break\n    return out\n", "omr/tracks.py": "\"\"\"Timing tracks: measure where the ticks along the four edges really are and bend the page flat again.\n\nA sheet folded once (two flat halves at an angle), curled or waved is not what the four corner markers' homography\nassumes: points between the markers are displaced by several mm.  Sheets printed with header version >= 2 carry rows\nof small black squares along the four edges (omr.layout.track_tick_rects).  After the coarse warp from the corner\nmarkers each tick sits near its nominal place; this module\n\n  1. finds every tick (blob response on a thin band along the edge, candidates per tick),\n  2. picks the chain of candidates that is smooth along the edge and complete (a small dynamic programme over the\n     ticks; it tolerates missing ticks, a hand over part of an edge, header cells / frame lines next to the track),\n  3. interpolates the displacement of the four edges into the page (transfinite / Coons patch: exact on all four\n     edges, linear across the page between opposite edges - what two flat halves at a crease look like), and\n  4. resamples the canvas so that everything (header, bubbles, serial strip, name box) is at its nominal place.\n\nAll in canvas pixels of the corner-marker warp (``ppm`` px per mm), displacement d = measured - nominal in mm.\nNothing here decides anything about marks; recognition falls back to the old (quadratic) model when the tracks\ncannot be trusted.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Dict, List, Optional\n\nimport cv2\nimport numpy as np\n\nfrom . import layout as lay\n\n# ---- tunables\nRING_MM = 2.6                        # blob detector: dark box (tick) inside a brighter ring this much larger (total, both sides)\nDETECT_SCALE = 0.5                   # ticks are found on a half-resolution copy of the band (sub-pixel peak refinement)\nMIN_RESP = 0.22                      # contrast (1 - tick/paper) a blob needs to be a candidate\nNMS_MM = 3.0                         # candidates closer than this are one blob\nWIN_ALONG_MM = 7.5                   # where a tick may be found relative to its nominal place along the track ...\nWIN_ACROSS_MM = {\"L\": 8.0, \"R\": 8.0, \"T\": 5.5, \"B\": 5.5}   # ... and across it (top: the header rows start 2.4 mm below the ticks)\nEXT_ACROSS_MM = {\"L\": 14.0, \"R\": 14.0, \"T\": 7.0, \"B\": 9.0}  # ticks beyond those windows are still followed from the chain's ends (a hidden corner marker: the\nEXT_WIN_MM = 2.2                     # ... extrapolated page runs far off): each next tick is searched this far around the line the last two ticks predict\nEXT_DAMP = 0.9                       # ... with the slope damped by this per tick\nEXT_MISSES = 2                       # ... until this many ticks in a row are not found\nQUAD = 0.08                          # ... plus this per mm squared: one real step (a crease) is paid once, a detour onto a stray blob and back twice\nLAMBDA = 0.25                        # chain cost per mm the displacement changes between neighbouring ticks\nMISS = 0.3                           # chain cost per tick left out (missing, hidden, not a candidate)\nPRIOR = 0.002                        # chain cost per mm of displacement (a whisper: periodic ticks cannot tell a one-tick slip apart)\nANCHOR_MM, ANCHOR_SLOPE = 2.0, 0.12     # a chain end next to a visible corner marker may differ from the marker's displacement by this + slope * distance (mm)\nANCHOR_COST = 1.0                    # chain cost per mm beyond that\nROUGH_MAX_MM = 0.5                   # a track rougher than this (median second difference) is not a row of ticks\nMAX_GAP = 12                         # ticks the chain may skip at once\nPRESENT_FRAC = 0.3                  # share of ticks on the bottom or top edge that says \"this sheet has tracks\"\nMIN_FRAC = 0.5                       # share of a track's ticks that must be found for the track to count\nFLAT_MM = 0.5                        # a field this small everywhere is not worth resampling the canvas for\nMAX_DISP_MM = 14.0                   # a larger displacement is not a bent sheet\nOUTLIER_MM = 1.2                     # a tick this far from the median of its neighbours' interpolation is dropped\n\n\n@dataclass\nclass Track:\n    side: str\n    nominal: np.ndarray            # (n, 2) mm\n    d: np.ndarray                  # (n, 2) displacement mm, NaN where not found\n    resp: np.ndarray               # (n,) blob contrast of the chosen candidate (0 = none)\n\n    @property\n    def found(self) -> int:\n        return int(np.isfinite(self.d[:, 0]).sum())\n\n    @property\n    def frac(self) -> float:\n        return self.found / max(len(self.nominal), 1)\n\n\n# =============================================================================== detection\ndef _response(band: np.ndarray, ppm: float, size_mm):\n    \"\"\"Blob contrast of a dark box of ``size_mm`` (w, h) inside a brighter ring: (ring - box) / ring, float32.\"\"\"\n    iw, ih = max(int(round(size_mm[0] * ppm)), 3), max(int(round(size_mm[1] * ppm)), 3)\n    ow, oh = int(round((size_mm[0] + RING_MM) * ppm)), int(round((size_mm[1] + RING_MM) * ppm))\n    inner = cv2.boxFilter(band, -1, (iw, ih), normalize=True, borderType=cv2.BORDER_REPLICATE)\n    outer = cv2.boxFilter(band, -1, (ow, oh), normalize=True, borderType=cv2.BORDER_REPLICATE)\n    a_in, a_out = iw * ih, ow * oh\n    ring = (outer * a_out - inner * a_in) / max(a_out - a_in, 1)\n    return np.clip((ring - inner) / np.maximum(ring, 24.0), -1.0, 1.5)\n\n\ndef _peaks(resp: np.ndarray, ppm: float):\n    \"\"\"(row, col, value) of the local maxima of ``resp`` above MIN_RESP, with a parabolic sub-pixel position.\"\"\"\n    k = int(round(NMS_MM * ppm)) | 1\n    mx = cv2.dilate(resp, np.ones((k, k), np.uint8))\n    ys, xs = np.nonzero((resp >= mx) & (resp >= MIN_RESP))\n    out = []\n    H, W = resp.shape\n    for y, x in zip(ys, xs):\n        fy, fx = float(y), float(x)\n        if 0 < y < H - 1:\n            a, b, c = resp[y - 1, x], resp[y, x], resp[y + 1, x]\n            fy += 0.5 * (a - c) / (a - 2 * b + c - 1e-9)\n        if 0 < x < W - 1:\n            a, b, c = resp[y, x - 1], resp[y, x], resp[y, x + 1]\n            fx += 0.5 * (a - c) / (a - 2 * b + c - 1e-9)\n        out.append((fy, fx, float(resp[y, x])))\n    return out\n\n\ndef _anchor_cost(d: np.ndarray, anchor, dist) -> np.ndarray:\n    \"\"\"Chain cost of starting / ending at displacements ``d`` (m, 2) next to a corner marker of displacement ``anchor``.\"\"\"\n    if anchor is None:\n        return np.zeros(len(d))\n    return ANCHOR_COST * np.maximum(0.0, np.hypot(d[:, 0] - anchor[0], d[:, 1] - anchor[1]) - ANCHOR_MM - ANCHOR_SLOPE * dist)\n\n\ndef _chain(allc: np.ndarray, T: np.ndarray, n: int, a0=None, a1=None, dist0=None, dist1=None):\n    \"\"\"Best chain: one candidate (d_x, d_y, resp) or nothing per tick.  allc: (m, 3) array of (dx, dy, resp), T: the tick\n    each belongs to (non-decreasing).\n\n    a0 / a1: displacement of the corner marker next to the first / last tick (None = hidden), dist0 / dist1: its distance\n    (mm) from tick 0 / n-1.  Ticks are periodic, so only these anchors (and the ends) tell the true chain from one slipped by a tick.\"\"\"\n    tot = len(allc)\n    if tot == 0:\n        return {}\n    start = np.searchsorted(T, np.arange(n + 1))\n    X, Y, R = allc[:, 0], allc[:, 1], allc[:, 2]\n    Z = X + 1j * Y\n    unary = R - PRIOR * np.abs(Z)\n    first = unary - MISS * T - _anchor_cost(allc[:, :2], a0, (dist0 or 0) + T * lay.TRACK_PITCH)   # chain starts here\n    S = first.copy()          # best chain score ending at the candidate\n    Sg = S + MISS * T         # ... plus the gap cost already counted for its tick (a skip of g ticks costs MISS * (k - j - 1))\n    prev = np.full(tot, -1)\n    for k in range(n):\n        a, b = start[k], start[k + 1]\n        p0 = start[max(0, k - MAX_GAP - 1)]\n        if a == b or p0 == a:\n            continue\n        dd = np.abs(Z[a:b, None] - Z[None, p0:a])\n        tr = Sg[None, p0:a] - LAMBDA * dd - QUAD * dd * dd\n        arg = tr.argmax(1)\n        best = tr[np.arange(b - a), arg] + unary[a:b] - MISS * (k - 1)\n        take = best > first[a:b]\n        S[a:b] = np.where(take, best, first[a:b])\n        Sg[a:b] = S[a:b] + MISS * k\n        prev[a:b] = np.where(take, p0 + arg, -1)\n    ends = S - MISS * (n - 1 - T)\n    if a1 is not None:\n        ends = ends - _anchor_cost(np.stack([X, Y], 1), a1, (dist1 or 0) + (n - 1 - T) * lay.TRACK_PITCH)\n    cur = int(ends.argmax())\n    out: Dict[int, tuple] = {}\n    while cur >= 0:\n        out[int(T[cur])] = (X[cur], Y[cur], R[cur])\n        cur = int(prev[cur])\n    return out\n\n\n_ENDS = {\"L\": (\"TL\", \"BL\"), \"R\": (\"TR\", \"BR\"), \"T\": (\"TL\", \"TR\"), \"B\": (\"BL\", \"BR\")}   # corner markers at the first / last tick\n\n\ndef _detect_side(canvas: np.ndarray, ppm: float, side: str, centers: np.ndarray, anchors: Optional[dict] = None) -> Track:\n    \"\"\"Chain of the ticks of one side in the corner-marker warp ``canvas`` (gray float32).\"\"\"\n    H, W = canvas.shape\n    horiz = side in (\"T\", \"B\")                         # track runs left-right\n    WA = WIN_ACROSS_MM[side]\n    if horiz:\n        size = (lay.TRACK_LEN - 0.4, lay.TRACK_TB_H - 0.3)\n        across0 = centers[0, 1]\n        WB = max(WA, EXT_ACROSS_MM[side])\n        lo, hi = across0 - WB - 2.5, across0 + WB + 2.5\n        r0, r1 = int(max(lo * ppm, 0)), int(min(hi * ppm, H))\n        c0, c1 = int(max((centers[0, 0] - WIN_ALONG_MM - 3) * ppm, 0)), int(min((centers[-1, 0] + WIN_ALONG_MM + 3) * ppm, W))\n        off = np.array([c0, r0], np.float64)\n    else:\n        size = (lay.TRACK_LR_W - 0.4, lay.TRACK_LEN)\n        across0 = centers[0, 0]\n        WB = max(WA, EXT_ACROSS_MM[side])\n        lo, hi = across0 - WB - 2.5, across0 + WB + 2.5\n        c0, c1 = int(max(lo * ppm, 0)), int(min(hi * ppm, W))\n        r0, r1 = int(max((centers[0, 1] - WIN_ALONG_MM - 3) * ppm, 0)), int(min((centers[-1, 1] + WIN_ALONG_MM + 3) * ppm, H))\n        off = np.array([c0, r0], np.float64)\n    n = len(centers)\n    d = np.full((n, 2), np.nan)\n    rsp = np.zeros(n)\n    if r1 - r0 < 8 or c1 - c0 < 8:\n        return Track(side, centers, d, rsp)\n    band = cv2.resize(canvas[r0:r1, c0:c1], None, fx=DETECT_SCALE, fy=DETECT_SCALE, interpolation=cv2.INTER_AREA).astype(np.float32)\n    peaks = _peaks(_response(band, ppm * DETECT_SCALE, size), ppm * DETECT_SCALE)\n    if not peaks:\n        return Track(side, centers, d, rsp)\n    pts = (np.array([[p[1], p[0]] for p in peaks]) + 0.5) / DETECT_SCALE - 0.5 + off          # canvas px\n    pts_mm = pts / ppm\n    val = np.array([p[2] for p in peaks])\n    ia, ic = (0, 1) if horiz else (1, 0)\n    rel = pts_mm[None, :, :] - centers[:, None, :]                  # (tick, peak, 2)\n    kk, pp = np.nonzero((np.abs(rel[..., ia]) <= WIN_ALONG_MM) & (np.abs(rel[..., ic]) <= WIN_ACROSS_MM[side]))\n    allc = np.column_stack([rel[kk, pp, 0], rel[kk, pp, 1], val[pp]])\n    anchors = anchors or {}\n    ca, cb = _ENDS[side]\n    mc = {c: np.array([r[0] + r[2] / 2, r[1] + r[3] / 2]) for c, r in lay.marker_rects(0).items()}\n    a0, a1 = anchors.get(ca), anchors.get(cb)\n    for k, c in _chain(allc, kk, n, a0, a1, float(np.linalg.norm(centers[0] - mc[ca])), float(np.linalg.norm(centers[-1] - mc[cb]))).items():\n        d[k] = (c[0], c[1])\n        rsp[k] = c[2]\n    _extend(d, rsp, centers, pts_mm, val)\n    _drop_outliers(d, rsp)\n    if _roughness(d) > ROUGH_MAX_MM:        # blobs that do not line up (header cells, text): not a track\n        d[:] = np.nan\n        rsp[:] = 0.0\n    return Track(side, centers, d, rsp)\n\n\ndef _roughness(d: np.ndarray) -> float:\n    \"\"\"Median deviation (mm) of each found tick from the line through its two neighbours (one each side) - 0 for a straight\n    or smoothly bending track, large for blobs that are not a row of ticks.  A crease shows as a few kinks: the median ignores them.\"\"\"\n    idx = np.nonzero(np.isfinite(d[:, 0]))[0]\n    if len(idx) < 5:\n        return 0.0\n    a, m, b = idx[:-2], idx[1:-1], idx[2:]\n    t = ((m - a) / (b - a))[:, None]\n    dev = np.linalg.norm(d[m] - ((1 - t) * d[a] + t * d[b]), axis=1) / (1.0 + 0.15 * (b - a - 2))\n    return float(np.median(dev))\n\n\ndef _extend(d: np.ndarray, rsp: np.ndarray, centers: np.ndarray, pts_mm: np.ndarray, val: np.ndarray) -> None:\n    \"\"\"Follow the chain beyond its first / last found tick, one tick at a time along the line of the last two.\"\"\"\n    idx = np.nonzero(np.isfinite(d[:, 0]))[0]\n    if len(idx) < 3 or not len(pts_mm):\n        return\n    n = len(d)\n    for step, ends in ((-1, idx[:2]), (1, idx[::-1][:2])):\n        k0, k1 = int(ends[0]), int(ends[1])                     # last found tick in this direction, the one before it\n        cur, slope = d[k0].copy(), (d[k0] - d[k1]) / float(abs(k0 - k1))      # change of d per tick in the walking direction\n        misses, k = 0, k0 + step\n        while 0 <= k < n and misses < EXT_MISSES:\n            cur = cur + slope\n            slope = slope * EXT_DAMP\n            rel = pts_mm - centers[k] - cur\n            near = np.nonzero(np.hypot(rel[:, 0], rel[:, 1]) <= EXT_WIN_MM)[0]\n            if len(near):\n                j = near[int(np.argmax(val[near]))]\n                if not np.isfinite(d[k, 0]) or val[j] > rsp[k]:\n                    d[k] = pts_mm[j] - centers[k]\n                    rsp[k] = val[j]\n                cur = d[k].copy()\n                misses = 0\n            else:\n                misses += 1\n            k += step\n\n\ndef _drop_outliers(d: np.ndarray, rsp: np.ndarray) -> None:\n    \"\"\"Remove ticks that disagree with the line through their two nearest found neighbours (one on each side if possible).\"\"\"\n    for _ in range(6):\n        idx = np.nonzero(np.isfinite(d[:, 0]))[0]\n        if len(idx) < 4:\n            return\n        pred = np.empty((len(idx), 2))\n        lim = np.empty(len(idx))\n        a, m, b = idx[:-2], idx[1:-1], idx[2:]\n        t = ((m - a) / (b - a))[:, None]\n        pred[1:-1] = (1 - t) * d[a] + t * d[b]\n        lim[1:-1] = OUTLIER_MM + 0.15 * (b - a)\n        for e, (i0, i1, i2) in ((0, (idx[0], idx[1], idx[2])), (len(idx) - 1, (idx[-1], idx[-2], idx[-3]))):\n            pred[e] = d[i1] + (d[i2] - d[i1]) * ((i0 - i1) / (i2 - i1))\n            lim[e] = 2.0 * OUTLIER_MM\n        bad = np.linalg.norm(d[idx] - pred, axis=1) > lim\n        if not bad.any():\n            return\n        worst = idx[int(np.argmax(np.where(bad, np.linalg.norm(d[idx] - pred, axis=1) / lim, 0)))]\n        d[worst] = np.nan                   # one at a time: a bad tick makes its neighbours look bad too\n        rsp[worst] = 0.0\n\n\ndef detect(canvas: np.ndarray, ppm: float, anchors: Optional[dict] = None) -> Dict[str, Track]:\n    \"\"\"Find the ticks of all four sides in the corner-marker warp.  anchors: corner name -> displacement (mm) of its visible marker.\"\"\"\n    return {side: _detect_side(canvas, ppm, side, c, anchors) for side, c in lay.track_tick_centers().items()}\n\n\n# =============================================================================== the field\n_XL = lay.TRACK_EDGE_LR + lay.TRACK_LR_W / 2\n_XR = lay.PAGE_W - _XL\n_YT = lay.TRACK_EDGE_TB + lay.TRACK_TB_H / 2\n_YB = lay.PAGE_H - _YT\n\n\nclass Field:\n    \"\"\"Displacement d(x, y) (mm) of the printed page in the canvas, as a Coons patch of the four edges' tick displacements.\"\"\"\n\n    def __init__(self, tracks: Dict[str, Track]):\n        self.tracks = tracks\n        self.sides_ok = {s: t.frac >= MIN_FRAC for s, t in tracks.items()}\n        end = {}\n        for s, t in tracks.items():          # displacement at the first / last found tick of each side\n            idx = np.nonzero(np.isfinite(t.d[:, 0]))[0]\n            end[s] = (t.d[idx[0]], t.d[idx[-1]]) if len(idx) and self.sides_ok[s] else (None, None)\n\n        def corner(a, b):\n            v = [x for x in (a, b) if x is not None]\n            return np.mean(v, axis=0) if v else np.zeros(2)\n        # L / R run top -> bottom, T / B left -> right\n        self.c = {\"TL\": corner(end[\"L\"][0], end[\"T\"][0]), \"TR\": corner(end[\"R\"][0], end[\"T\"][1]),\n                  \"BL\": corner(end[\"L\"][1], end[\"B\"][0]), \"BR\": corner(end[\"R\"][1], end[\"B\"][1])}\n        self._fn = {}\n        for s, (lo, hi, c_lo, c_hi) in {\"L\": (_YT, _YB, \"TL\", \"BL\"), \"R\": (_YT, _YB, \"TR\", \"BR\"),\n                                        \"T\": (_XL, _XR, \"TL\", \"TR\"), \"B\": (_XL, _XR, \"BL\", \"BR\")}.items():\n            t = tracks[s]\n            idx = np.nonzero(np.isfinite(t.d[:, 0]))[0] if self.sides_ok[s] else np.array([], int)\n            ax = 1 if s in (\"L\", \"R\") else 0\n            u = np.concatenate([[lo], t.nominal[idx, ax], [hi]])\n            v = np.vstack([self.c[c_lo][None], t.d[idx], self.c[c_hi][None]])\n            self._fn[s] = (u, v)\n\n    def _edge(self, s: str, u: np.ndarray) -> np.ndarray:\n        xs, v = self._fn[s]\n        return np.stack([np.interp(u, xs, v[:, 0]), np.interp(u, xs, v[:, 1])], -1)\n\n    def __call__(self, x: np.ndarray, y: np.ndarray) -> np.ndarray:\n        \"\"\"Displacement (..., 2) at nominal page positions (mm).\"\"\"\n        x, y = np.asarray(x, np.float64), np.asarray(y, np.float64)\n        s = np.clip((x - _XL) / (_XR - _XL), 0, 1)[..., None]\n        t = np.clip((y - _YT) / (_YB - _YT), 0, 1)[..., None]\n        xc, yc = np.clip(x, _XL, _XR), np.clip(y, _YT, _YB)\n        c = self.c\n        d = ((1 - t) * self._edge(\"T\", xc) + t * self._edge(\"B\", xc) + (1 - s) * self._edge(\"L\", yc) + s * self._edge(\"R\", yc)\n             - ((1 - s) * (1 - t) * c[\"TL\"] + s * (1 - t) * c[\"TR\"] + (1 - s) * t * c[\"BL\"] + s * t * c[\"BR\"]))\n        return d\n\n    def grid(self, px: np.ndarray, py: np.ndarray) -> np.ndarray:\n        \"\"\"`self(xs, ys)` on the grid of all (px, py) -> (len(py), len(px), 2), the same numbers, but every edge function is\n        evaluated once per row / column instead of once per grid point.\"\"\"\n        px, py = np.asarray(px, np.float64), np.asarray(py, np.float64)\n        s = np.clip((px - _XL) / (_XR - _XL), 0, 1)[None, :, None]\n        t = np.clip((py - _YT) / (_YB - _YT), 0, 1)[:, None, None]\n        xc, yc = np.clip(px, _XL, _XR), np.clip(py, _YT, _YB)\n        c = self.c\n        return ((1 - t) * self._edge(\"T\", xc)[None] + t * self._edge(\"B\", xc)[None]\n                + (1 - s) * self._edge(\"L\", yc)[:, None] + s * self._edge(\"R\", yc)[:, None]\n                - ((1 - s) * (1 - t) * c[\"TL\"] + s * (1 - t) * c[\"TR\"] + (1 - s) * t * c[\"BL\"] + s * t * c[\"BR\"]))\n\n    # ---- quality\n    @property\n    def usable(self) -> bool:\n        ok = self.sides_ok\n        return (ok[\"L\"] and ok[\"R\"]) or (ok[\"T\"] and ok[\"B\"])\n\n    def max_disp(self) -> float:\n        if getattr(self, \"_max_disp\", None) is not None:\n            return self._max_disp\n        xs, ys = np.meshgrid(np.linspace(_XL, _XR, 15), np.linspace(_YT, _YB, 20))\n        self._max_disp = float(np.linalg.norm(self(xs, ys), axis=-1).max())\n        return self._max_disp\n\n    def info(self) -> dict:\n        t = self.tracks\n        return {\"tracks_found\": float(np.mean([t[s].frac for s in t])),\n                \"tracks_sides\": int(sum(self.sides_ok.values())),\n                \"tracks_max_mm\": self.max_disp()}\n\n\ndef measure(canvas: np.ndarray, ppm: float, anchors: Optional[dict] = None) -> Optional[Field]:\n    \"\"\"Field of a sheet's tracks in the corner-marker warp, or None when they cannot be trusted.\n\n    Cheap exit first: a sheet without tracks (older format, not a sheet) shows none on the bottom nor the top edge.\"\"\"\n    cen = lay.track_tick_centers()\n    tr = {s: _detect_side(canvas, ppm, s, cen[s], anchors) for s in (\"B\", \"T\")}\n    if max(t.frac for t in tr.values()) < PRESENT_FRAC:\n        return None\n    tr.update({s: _detect_side(canvas, ppm, s, cen[s], anchors) for s in (\"L\", \"R\")})\n    f = Field(tr)\n    if not f.usable or f.max_disp() > MAX_DISP_MM:\n        return None\n    return f\n\n\ndef rectify(canvas: np.ndarray, field: Field, ppm: float, border: float = 255) -> np.ndarray:\n    \"\"\"Canvas resampled so that every nominal page position (mm * ppm) holds what the field says is printed there.\"\"\"\n    H, W = canvas.shape\n    ds = max(int(round(1.5 * ppm)), 2)                  # field sampled every ~1.5 mm, bilinear in between (cv2.resize pixel-centre convention)\n    nW, nH = -(-W // ds), -(-H // ds)\n    px = ((np.arange(nW) + 0.5) * ds - 0.5) / ppm       # mm of the sample points\n    py = ((np.arange(nH) + 0.5) * ds - 0.5) / ppm\n    d = field.grid(px, py)\n    mx = ((px[None, :] + d[..., 0]) * ppm).astype(np.float32)\n    my = ((py[:, None] + d[..., 1]) * ppm).astype(np.float32)\n    mapx = cv2.resize(mx, (nW * ds, nH * ds), interpolation=cv2.INTER_LINEAR)[:H, :W]\n    mapy = cv2.resize(my, (nW * ds, nH * ds), interpolation=cv2.INTER_LINEAR)[:H, :W]\n    return cv2.remap(canvas, mapx, mapy, cv2.INTER_LINEAR, borderMode=cv2.BORDER_CONSTANT, borderValue=border)\n\n\nFLAT = object()      # \"measured, and the sheet is flat\": recognize keeps the plain warp\n", "omr/recognize.py": "\"\"\"One camera image -> structured recognition result. Pure function, no I/O, no state.\n\n    result = recognize(image_bgr, resolve_layout)\n\nPipeline: ArUco corners -> homography (all 16 corner points) -> canonical warp ->\nheader decode (the sheet describes its own layout: question count, choices, ID / subject digits, pages, page;\nCRC-16) -> layout -> bubble scoring relative to the local paper level, decided per question against page-level\ncalibration.  No database is needed.  Legacy sheets (single-row meta strip with a 16-bit form id) are still read\nwhen a `resolve_layout(form_id)` callable is given.\n\nDesign rule: anything doubtful is flagged or left unread, never guessed.  A wrong student\nID is worse than none, so ID digits use stricter rules than answers.\n\"\"\"\nfrom __future__ import annotations\n\nimport time\nfrom dataclasses import dataclass, field\nfrom typing import Callable, Dict, List, Optional, Tuple\n\nimport cv2\nimport numpy as np\n\nfrom . import illum\nfrom . import ink as inkmod\nfrom . import layout as lay\nfrom . import markers as mk\nfrom . import tracks as trk\nfrom .fastops import pct1, pct_axis0, pct_rows\nfrom .detect import find_markers, find_markers_scaled\n\nDEFAULT_PX_PER_MM = 6.0\n\n# ---- statuses\nOK, NO_SHEET, PARTIAL, INCONSISTENT = \"ok\", \"no_sheet\", \"partial\", \"inconsistent\"\nUNKNOWN_FORM, BAD_META, BAD_GEOMETRY = \"unknown_form\", \"bad_meta\", \"bad_geometry\"\n\n# ---- tunables (all relative / physical units, none depends on a particular ink colour)\nMIN_MARKERS = 3              # corner markers of one page needed (3 of 4 give 12 points for the homography)\nFOREIGN_MIN_SIDE_FRAC = 0.6   # a marker of another page group this much smaller than a corner marker (measured on this sheet's plane) is junk\nFOREIGN_MARGIN_MM = 5.0      # markers of another page group must lie this far outside the sheet\nMAX_EDGE_RATIO = 3.0         # opposite edges of the projected page may differ at most by this factor (extreme perspective)\nMAX_REPROJ_MM = 2.0          # marker corner reprojection error above this -> bad_geometry (paper bow moves the corners)\nMAX_REPROJ_TRACKS_MM = 8.0   # ... unless the sheet has timing tracks that straighten it (omr.tracks): then this much\nMETA_MIN_CONTRAST = 0.25     # 1 - black/white of the meta guard cells\nHOT_MEAN_DARKNESS = 0.15     # a bubble whose disc is on average this much darker than paper is \"not empty\"\nINK_PERCENTILE = 50\nBLACK_PERCENTILE = 25        # printed-black reference: darker quartile of the black guard cells (robust to white streaks)\nABS_INK_FRAC = 0.45          # absolute ink floor = this fraction of the printed-black darkness (meta strip) on the same frame\nMIN_CALIB_MARKS = 5          # confident marks needed before the page's own marks may raise the ink level\nSTRENGTH_UNCALIBRATED = 0.7  # sparse page: only the absolute scale is trusted, so lean towards \"ambiguous\"\nDEFAULT_TYP_FILL = 0.9\nT_HI_MIN, T_HI_MAX, T_HI_OF_TYP = 0.45, 0.65, 0.65\nALIGN_PX_PER_MM = 4.0         # ring correlation resolution\nALIGN_SAMPLES_PER_GROUP = 40\nALIGN_MIN_CORR = 0.35\nALIGN_SEARCH_MM = 1.4\nALIGN_REFINE_STAGES = 2        # extra ring searches around the model's prediction when a marker is hidden\nALIGN_MIN_COVERAGE = 0.8       # ... and the share of sampled rings that must confirm the model then\nALIGN_MAX_SHIFT_EXTRAP_MM = 4.0\nRING_SCORE_SIGMA_MM, RING_SCORE_MIN, RING_SCORE_FRAC = 0.5, 0.25, 0.5   # per-row ring check on a straightened page (_rows_misfit)\nTRACKS_MIN_RING_CORR, TRACKS_MIN_INLIERS = 0.4, 0.55   # a page straightened by its timing tracks: rings must confirm it (median correlation / inlier share)\nALIGN_MAX_SHIFT_MM = 2.0     # a larger correction means something is wrong: fall back to nominal positions\nMIN_STRENGTH = 0.6          # mean ink darkness relative to the page's ink level\nT_LO_FRAC = 0.2             # t_lo = T_LO_FRAC * t_hi\nDIGIT_MARGIN = 0.08         # strict digits (ID, subject) need this much more fill than t_hi when the mark is dark ...\nREL_MARGIN = 0.15           # relative rule: a choice whose disc darkness is this much (absolute, 0..1) above the median of the\n                            # question's other choices counts as marked even when it is too faint for the absolute fill thresholds\nREL_SURE = 0.20             # ... read silently only from this excess on (answers); between REL_MARGIN and this the row is flagged\nREL_SURE_DIGIT = 0.20       # ... strict digit columns (ID, subject): a digit is read from a relative-only mark from this excess on\nDIGIT_MARGIN_FROM, DIGIT_MARGIN_FULL = 0.7, 1.0   # ... scaled in by strength between these (measured: half-filled bubbles of strength < 0.8\n                                                  # never reached t_hi, 0.8-1.0 reached t_hi + 0.02, above 1.0 t_hi + 0.07)\n\n\nSOFT_FLAGS = (\"serial_unreadable\", \"corner_hidden\", \"guessed_answers\", \"marker_dropped\")   # informational: never a reason for human review\nSERIAL_ABSENT_RATIO = 0.65            # darkest/brightest serial cell above this = nothing printed\n\n\ndef hard_flags(flags) -> list:\n    return [f for f in flags or [] if f not in SOFT_FLAGS]\n\n\n# =============================================================================== results\n@dataclass\nclass QuestionResult:\n    number: int\n    state: str                 # \"single\" | \"blank\" | \"multi\"\n    marked: List[int]          # choice indices (0-based) judged marked\n    labels: List[str]\n    confidence: float          # 0..1\n    ambiguous: bool            # a close call: a human should look\n    scores: List[float]        # darkness per choice (0 = paper, 1 = black)\n    guess: Optional[int] = None  # best-guess choice of an UNCERTAIN row (always together with ambiguous); None = confident / no choice stands out\n    guessed: bool = False      # the row's value is a best guess (== guess is not None); a human should look\n\n    @property\n    def answer(self) -> Optional[int]:\n        \"\"\"The row's value: the single mark, or - for an uncertain blank row - the best guess.\n        A clearly blank row and a multi-mark row (its answer is the whole `marked` set) stay None.\"\"\"\n        if self.state == \"single\":\n            return self.marked[0]\n        return self.guess\n\n\n@dataclass\nclass DigitResult:\n    index: int\n    state: str\n    value: Optional[int]       # the digit; for an uncertain column the best guess (guessed=True); None = clearly blank / nothing stands out\n    confidence: float\n    ambiguous: bool\n    scores: List[float]\n    guessed: bool = False      # value is a best guess, not a confident read (always ambiguous)\n\n\n@dataclass\nclass RecognitionResult:\n    status: str\n    form_key: Optional[str] = None         # identity of the printed form (omr.markers.Header.form_key)\n    form_id: Optional[int] = None          # legacy sheets only\n    page: Optional[int] = None             # 0-based\n    total_pages: Optional[int] = None\n    serial: Optional[int] = None           # printed per-copy number; None = none printed / unreadable (flag \"serial_unreadable\")\n    answers: List[QuestionResult] = field(default_factory=list)\n    student_id: Optional[str] = None\n    id_digits: List[DigitResult] = field(default_factory=list)\n    subject: Optional[str] = None          # marked subject code; \"\" = the form has none; None = not readable\n    subject_digits: List[DigitResult] = field(default_factory=list)\n    flags: List[str] = field(default_factory=list)\n    marker_ids: List[int] = field(default_factory=list)\n    marker_corners: Dict[int, List[List[float]]] = field(default_factory=dict)  # id -> 4x(x,y) in the source image\n    missing_corners: List[str] = field(default_factory=list)\n    homography: Optional[List[List[float]]] = None   # source image px -> canvas px (canvas px = mm * px_per_mm)\n    px_per_mm: float = DEFAULT_PX_PER_MM\n    quality: Dict[str, float] = field(default_factory=dict)\n    calibration: Dict[str, object] = field(default_factory=dict)\n    # alignment-corrected bubble centres in page mm: \"answers\" [question][choice] -> (x, y), \"id\" [digit][value] -> (x, y)\n    bubble_centers_mm: Dict[str, list] = field(default_factory=dict)\n    timing_ms: Dict[str, float] = field(default_factory=dict)\n    warped: Optional[np.ndarray] = None    # canonical gray canvas (flattened by the timing tracks when the sheet has them)\n    name_crop: Optional[np.ndarray] = None  # gray crop of the name box (from the canonical canvas)\n    raw: Optional[\"PageRaw\"] = None        # per-bubble measurements (for multi-frame fusion)\n    fused_frames: int = 0                  # > 0: decisions fused over this many frames of one track (omr.fusion)\n    dewarp: Optional[object] = None        # omr.tracks.Field: page mm -> displacement in the homography canvas (None = flat sheet)\n\n    @property\n    def id_guessed(self) -> bool:\n        return \"id_guessed\" in self.flags\n\n    @property\n    def subject_guessed(self) -> bool:\n        return \"subject_guessed\" in self.flags\n\n    @property\n    def needs_review(self) -> bool:\n        return (self.status == OK and (self.student_id is None or self.subject is None or bool(hard_flags(self.flags))\n                or any(a.ambiguous or a.guessed or a.state != \"single\" for a in self.answers)))\n\n    def image_points(self, pts_mm) -> np.ndarray:\n        \"\"\"Map layout mm coordinates (page space) to source-image pixels (for overlays).\"\"\"\n        if self.homography is None:\n            raise ValueError(\"no homography\")\n        p = np.asarray(pts_mm, np.float64).reshape(-1, 2)\n        if self.dewarp is not None:          # canvas position of a point of the flattened page\n            p = p + self.dewarp(p[:, 0], p[:, 1])\n        p = p * self.px_per_mm\n        Hi = np.linalg.inv(np.asarray(self.homography))\n        return cv2.perspectiveTransform(p.reshape(-1, 1, 2), Hi).reshape(-1, 2)\n\n    def to_dict(self) -> dict:\n        \"\"\"JSON-serialisable view (no image arrays).\"\"\"\n        def conv(v):\n            if isinstance(v, np.generic):\n                return v.item()\n            if isinstance(v, np.ndarray):\n                return v.tolist()\n            if isinstance(v, dict):\n                return {str(k): conv(x) for k, x in v.items()}\n            if isinstance(v, (list, tuple)):\n                return [conv(x) for x in v]\n            if hasattr(v, \"__dataclass_fields__\"):\n                return {k: conv(getattr(v, k)) for k in v.__dataclass_fields__}\n            return v\n        d = {k: conv(getattr(self, k)) for k in self.__dataclass_fields__ if k not in (\"warped\", \"name_crop\", \"raw\", \"dewarp\")}\n        d[\"needs_review\"] = self.needs_review\n        d[\"id_guessed\"], d[\"subject_guessed\"] = self.id_guessed, self.subject_guessed\n        d[\"guessed_answers\"] = sum(1 for a in self.answers if a.guessed)\n        return d\n\n\n# =============================================================================== helpers\n_disc_cache: Dict[Tuple[int, float], Tuple[np.ndarray, np.ndarray, np.ndarray]] = {}\n\n\ndef _disc(radius_px: float):\n    \"\"\"(dy, dx, mask) index offsets for a disc of the given radius.\"\"\"\n    key = (0, round(radius_px, 2))\n    if key not in _disc_cache:\n        r = int(np.ceil(radius_px))\n        y, x = np.mgrid[-r:r + 1, -r:r + 1]\n        m = (x * x + y * y) <= radius_px * radius_px\n        _disc_cache[key] = (y[m], x[m], m)\n    return _disc_cache[key]\n\n\ndef _marker_corners_mm(page: int) -> Dict[int, np.ndarray]:\n    out = {}\n    for corner, (x, y, w, h) in lay.marker_rects(page).items():\n        # ArUco returns corners in the marker's own TL, TR, BR, BL order\n        out[mk.marker_id(page, corner)] = np.array([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], np.float64)\n    return out\n\n\ndef _quality_sharpness(gray: np.ndarray, quad: np.ndarray) -> float:\n    x0, y0 = np.maximum(quad.min(0).astype(int), 0)\n    x1, y1 = quad.max(0).astype(int)\n    roi = gray[y0:y1, x0:x1]\n    if roi.size < 100:\n        return 0.0\n    if max(roi.shape) > 700:  # keep cost bounded & comparable\n        roi = cv2.resize(roi, None, fx=700 / max(roi.shape), fy=700 / max(roi.shape), interpolation=cv2.INTER_AREA)\n    return float(cv2.Laplacian(roi, cv2.CV_32F).var())\n\n\ndef _plausible_sheet(Hinv: np.ndarray, ppm: float) -> bool:\n    \"\"\"The page rectangle must project to a convex quadrilateral with sane perspective.\"\"\"\n    q = cv2.perspectiveTransform(np.array([[[0, 0], [lay.PAGE_W * ppm, 0], [lay.PAGE_W * ppm, lay.PAGE_H * ppm],\n                                            [0, lay.PAGE_H * ppm]]], np.float64), Hinv)[0]\n    cr = [float((q[(i + 1) % 4] - q[i])[0] * (q[(i + 2) % 4] - q[(i + 1) % 4])[1] - (q[(i + 1) % 4] - q[i])[1] * (q[(i + 2) % 4] - q[(i + 1) % 4])[0]) for i in range(4)]\n    if not (all(c > 0 for c in cr) or all(c < 0 for c in cr)):\n        return False\n    e = [np.linalg.norm(q[(i + 1) % 4] - q[i]) for i in range(4)]\n    return min(e) > 0 and max(e[0], e[2]) / min(e[0], e[2]) < MAX_EDGE_RATIO and max(e[1], e[3]) / min(e[1], e[3]) < MAX_EDGE_RATIO\n\n\n# =============================================================================== meta strip\ndef _read_meta(warped: np.ndarray, ppm: float):\n    \"\"\"Decode the 40-cell strip with guard-cell black/white references interpolated along the strip.\n\n    Returns (Meta | None, info dict).\"\"\"\n    rects = lay.meta_cell_rects()\n    means = np.empty(len(rects))\n    for i, (x, y, w, h) in enumerate(rects):\n        x0, x1 = (x + 0.2 * w) * ppm, (x + 0.8 * w) * ppm\n        y0, y1 = (y + 0.2 * h) * ppm, (y + 0.8 * h) * ppm\n        means[i] = warped[int(round(y0)):max(int(round(y1)), int(round(y0)) + 1),\n                          int(round(x0)):max(int(round(x1)), int(round(x0)) + 1)].mean()\n    n = len(means)\n    sg = [i for i, b in enumerate(mk.START_GUARD)]\n    eg = [n - len(mk.STOP_GUARD) + i for i in range(len(mk.STOP_GUARD))]\n    black_l = np.mean([means[i] for i in sg if mk.START_GUARD[i]])\n    white_l = np.mean([means[i] for i in sg if not mk.START_GUARD[i]])\n    black_r = np.mean([means[j] for i, j in enumerate(eg) if mk.STOP_GUARD[i]])\n    white_r = np.mean([means[j] for i, j in enumerate(eg) if not mk.STOP_GUARD[i]])\n    t = (np.arange(n) - 1.5) / (n - 4.0)\n    black = black_l + (black_r - black_l) * t\n    white = white_l + (white_r - white_l) * t\n    contrast = 1.0 - min(black_l / max(white_l, 1), black_r / max(white_r, 1))\n    info = {\"meta_contrast\": float(contrast)}\n    if contrast < META_MIN_CONTRAST or min(white_l, white_r) <= min(black_l, black_r):\n        return None, info\n    info[\"meta_black\"] = _printed_black(warped, ppm, rects, white_l, white_r)\n    bits = means < 0.5 * (black + white)\n    margin = np.abs(means - 0.5 * (black + white)) / np.maximum(white - black, 1)\n    info[\"meta_min_margin\"] = float(margin.min())\n    return mk.decode_meta(bits), info\n\n\ndef _printed_black(warped, ppm, rects, white_l: float, white_r: float) -> float:\n    \"\"\"Darkness (0 = paper, 1 = black) of the printed black on this frame, measured on the meta strip's black guard cells.\n\n    A cheap printer renders black as grey and drops thin lines of toner (white streaks): the cell *mean*\n    then mixes ink and paper.  The darker quartile of the cell's pixels is the ink itself, independent of how\n    many streaks fall into the cell; for a solid print it equals the mean.\"\"\"\n    vals = []\n    paper = 0.5 * (white_l + white_r)\n    for i, black in enumerate(mk.START_GUARD):\n        if black:\n            vals.append(_cell_quartile(warped, ppm, rects[i]))\n    n = len(rects)\n    for j, black in enumerate(mk.STOP_GUARD):\n        if black:\n            vals.append(_cell_quartile(warped, ppm, rects[n - len(mk.STOP_GUARD) + j]))\n    return float(np.clip(1.0 - np.mean(vals) / max(paper, 1.0), 0.0, 1.0))\n\n\ndef _cell_quartile(warped, ppm, rect) -> float:\n    x, y, w, h = rect\n    c = warped[int(round((y + 0.2 * h) * ppm)):max(int(round((y + 0.8 * h) * ppm)), int(round((y + 0.2 * h) * ppm)) + 1),\n               int(round((x + 0.2 * w) * ppm)):max(int(round((x + 0.8 * w) * ppm)), int(round((x + 0.2 * w) * ppm)) + 1)]\n    return float(np.percentile(c, BLACK_PERCENTILE))\n\n\ndef _read_serial(warped: np.ndarray, ppm: float):\n    \"\"\"Serial strip -> (serial or None, state) with state in \"ok\" | \"absent\" | \"unreadable\".\n\n    \"absent\": nothing printed (serial 0 prints nothing) *or nothing readable there* (a hand / shadow over the\n    footer): no guard-cell pattern with printed contrast on either side.  Only a strip that visibly is there\n    (clean start or stop guard) and still fails to decode is \"unreadable\" and flagged.\n    Black/white references come from the strip's own guard cells, interpolated like the meta strip.\"\"\"\n    rects = lay.serial_cell_rects()\n    means = np.empty(len(rects))\n    for i, (x, y, w, h) in enumerate(rects):\n        x0, x1 = (x + 0.2 * w) * ppm, (x + 0.8 * w) * ppm\n        y0, y1 = (y + 0.2 * h) * ppm, (y + 0.8 * h) * ppm\n        means[i] = warped[int(round(y0)):max(int(round(y1)), int(round(y0)) + 1),\n                          int(round(x0)):max(int(round(x1)), int(round(x0)) + 1)].mean()\n    if means.min() >= SERIAL_ABSENT_RATIO * means.max():\n        return None, \"absent\"\n    n = len(means)\n    sg, eg = mk.START_GUARD, mk.STOP_GUARD\n    st = list(range(len(sg)))\n    en = [n - len(eg) + i for i in range(len(eg))]\n    black_l = np.mean([means[i] for i in st if sg[i]])\n    white_l = np.mean([means[i] for i in st if not sg[i]])\n    black_r = np.mean([means[j] for i, j in enumerate(en) if eg[i]])\n    white_r = np.mean([means[j] for i, j in enumerate(en) if not eg[i]])\n    ok_l = 1.0 - black_l / max(white_l, 1) >= META_MIN_CONTRAST and white_l > black_l\n    ok_r = 1.0 - black_r / max(white_r, 1) >= META_MIN_CONTRAST and white_r > black_r\n    if not (ok_l or ok_r):\n        return None, \"absent\"\n    if not ok_l:\n        black_l, white_l = black_r, white_r\n    if not ok_r:\n        black_r, white_r = black_l, white_l\n    t = (np.arange(n) - 1.5) / (n - 4.0)\n    black = black_l + (black_r - black_l) * t\n    white = white_l + (white_r - white_l) * t\n    v = mk.decode_serial(means < 0.5 * (black + white))\n    return (v, \"ok\") if v is not None else (None, \"unreadable\")\n\n\n# =============================================================================== self-describing header\nHEADER_SEARCH_MM = 2.0       # local registration window of a header row (paper bow / curl near the top edge); < half a row pitch\nHEADER_BAND_MM = 1.0         # white paper band above / below a row used as that row's local paper level\nHEADER_WIDE_SEARCH_MM = (4.0, 2.6)   # (dx, dy) retry window when the sheet is warped from only 3 corner markers or the first pass failed: the\n                                     # extrapolated corner (paper curl / bow) moves the far end of the header 2-3 mm; dy stays < half a row pitch\nHEADER_WIDE_DISAGREE_MM = (3.5, 2.8) # ... and the two ends may then differ this much (dx, dy)\nTRACK_SEG, TRACK_HOP = 8, 4          # tracked retry: windows of 8 cells, every 4 cells\nTRACK_STEP_MM = 1.2                  # ... each searched this far around the previous window's offset\nTRACK_FIRST_MM = 3.0                 # ... the first one this far around the nominal position (< half the row pitch)\nTRACK_MIN_CONTRAST = 40.0            # flat-field gray levels (paper = 235): bright bands minus dark band needed to trust a window\nHEADER_FLIP_CANDIDATES = 3   # least-certain data cells that may be flipped (singly or in pairs) to satisfy the CRC ...\nHEADER_FLIP_MARGIN = 0.3     # ... only when they are this close to the threshold (fraction of the black-white contrast)\n\n\ndef _box_mean(ii, x0, y0, x1, y1) -> float:\n    \"\"\"Mean of the canvas over [x0, x1) x [y0, y1) (px, clipped) from an integral image.\"\"\"\n    H, W = ii.shape[0] - 1, ii.shape[1] - 1\n    x0, x1 = min(max(round(x0), 0), W - 1), min(max(round(x1), 1), W)      # plain ints: np.clip per call dominated the header read\n    y0, y1 = min(max(round(y0), 0), H - 1), min(max(round(y1), 1), H)\n    x1, y1 = max(x1, x0 + 1), max(y1, y0 + 1)\n    return float((ii[y1, x1] - ii[y0, x1] - ii[y1, x0] + ii[y0, x0]) / ((x1 - x0) * (y1 - y0)))\n\n\ndef _box_means(ii, x0, y0, x1, y1) -> np.ndarray:\n    \"\"\"`_box_mean` over arrays of boxes at once (same clipping / rounding, so the same numbers).\"\"\"\n    H, W = ii.shape[0] - 1, ii.shape[1] - 1\n    x0 = np.minimum(np.maximum(np.rint(x0), 0), W - 1).astype(np.intp)\n    x1 = np.minimum(np.maximum(np.rint(x1), 1), W).astype(np.intp)\n    y0 = np.minimum(np.maximum(np.rint(y0), 0), H - 1).astype(np.intp)\n    y1 = np.minimum(np.maximum(np.rint(y1), 1), H).astype(np.intp)\n    x1, y1 = np.maximum(x1, x0 + 1), np.maximum(y1, y0 + 1)\n    return (ii[y1, x1] - ii[y0, x1] - ii[y1, x0] + ii[y0, x0]) / ((x1 - x0) * (y1 - y0))\n\n\ndef _band_scores(ii, ppm, xs0, xs1, y, h, dys) -> np.ndarray:\n    \"\"\"bright band - dark band - bright band score of a header row segment at every vertical offset of `dys`.\"\"\"\n    inside = _box_means(ii, xs0 * ppm, (y + dys + 0.15 * h) * ppm, xs1 * ppm, (y + dys + 0.85 * h) * ppm)\n    above = _box_means(ii, xs0 * ppm, (y + dys - 0.2 - HEADER_BAND_MM) * ppm, xs1 * ppm, (y + dys - 0.2) * ppm)\n    below = _box_means(ii, xs0 * ppm, (y + dys + h + 0.2) * ppm, xs1 * ppm, (y + dys + h + 0.2 + HEADER_BAND_MM) * ppm)\n    return np.minimum(above, below) - inside\n\n\ndef _register_row(ii, ppm, row, guard, side, search=(HEADER_SEARCH_MM, HEADER_SEARCH_MM), dy_fixed=None):\n    \"\"\"(dx, dy) in mm that put the nominal header row on the printed one, at one end of the row.\n\n    Edge-based and independent of the data bits: dy maximises the darkness inside the row's band against the white\n    bands above and below it (a box correlation of the vertical profile); dx aligns the known guard pattern plus the\n    white paper beyond the row's end (a 1-D correlation of the horizontal profile).\"\"\"\n    x, y, w, h = row[0] if side == \"L\" else row[-1]\n    n_end = 8                                     # cells at this end used for the vertical profile\n    xs0 = row[0][0] if side == \"L\" else row[-n_end][0]\n    xs1 = row[n_end - 1][0] + w if side == \"L\" else row[-1][0] + w\n    step = 1.0 / ppm\n    best = (-1e9, 0.0)\n    if dy_fixed is None:\n        dys = np.arange(-search[1], search[1] + 1e-9, step)\n        if len(dys):\n            sc = _band_scores(ii, ppm, xs0, xs1, y, h, dys)\n            k = int(np.argmax(sc))\n            if sc[k] > best[0]:\n                best = (float(sc[k]), float(dys[k]))\n    dy = best[1] if dy_fixed is None else dy_fixed\n    # horizontal: guard cells + one white cell beyond the end, as a +1 (black) / -1 (white) template\n    pat = ([False] + list(guard)) if side == \"L\" else (list(guard) + [False])\n    x_first = (row[0][0] - w) if side == \"L\" else row[-len(guard)][0]\n    best = (-1e9, 0.0)\n    dxs = np.arange(-search[0], search[0] + 1e-9, step)\n    if len(dxs):\n        base = (x_first + dxs)[:, None]\n        i_ = np.arange(len(pat))[None, :]\n        vals = _box_means(ii, (base + (i_ + 0.25) * w) * ppm, (y + dy + 0.2 * h) * ppm,\n                          (base + (i_ + 0.75) * w) * ppm, (y + dy + 0.8 * h) * ppm)           # (ndx, ncell)\n        sign = np.where(pat, -1.0, 1.0)          # bright where white, dark where black\n        sc = (sign[None, :] * (vals - vals.mean(axis=1, keepdims=True))).sum(axis=1)\n        k = int(np.argmax(sc))\n        if sc[k] > best[0]:\n            best = (float(sc[k]), float(dxs[k]))\n    return best[1], dy\n\n\nHEADER_REACH_MM = 40.0       # nothing of the header read touches the canvas further than this below the flat-field band\nHEADER_FLAT_MARGIN_MM = 4.0  # paper sampled this far above / below the header rows for the flat field\nHEADER_FLAT_PCT = 85         # printed black covers < 50 % of any column of that window, so this percentile is paper\nHEADER_FLAT_SIGMA_MM = 1.2   # smoothing of the per-column paper level along the row\n\n\ndef _flatten_header(warped: np.ndarray, ppm: float) -> np.ndarray:\n    \"\"\"float32 copy of the canvas whose header band is divided by the paper level of its own column.\n\n    Registration and thresholds then see a lighting-independent picture: a hard shadow edge, glare or a gradient *along*\n    the row (the usual case: the header spans 144 mm) becomes a flat white background, where the raw picture has two\n    different \"papers\" and a ``bright band - dark band`` score picks the edge instead of the cells.  Per column, not\n    per pixel: the black cells never cover half of a column of the window, so a high percentile is the paper itself.\"\"\"\n    rows = lay.header_cell_rects()\n    y0 = max(int(round((rows[0][0][1] - HEADER_FLAT_MARGIN_MM) * ppm)), 0)\n    y1 = min(int(round((rows[-1][0][1] + rows[-1][0][3] + HEADER_FLAT_MARGIN_MM) * ppm)), warped.shape[0])\n    # rows far below the header are never read (registration reaches < 25 mm from a row): neither converted nor integrated\n    out = warped[:min(y1 + int(round(HEADER_REACH_MM * ppm)), warped.shape[0])].astype(np.float32)\n    band = out[y0:y1]\n    paper = pct_axis0(band, HEADER_FLAT_PCT).astype(np.float32)\n    paper = cv2.GaussianBlur(paper.reshape(1, -1), (0, 0), HEADER_FLAT_SIGMA_MM * ppm).reshape(-1)\n    out[y0:y1] = np.clip(band / np.maximum(paper, 8.0) * 235.0, 0, 255)\n    return out\n\n\ndef _track_dy(ii, ppm, row, first_search: float):\n    \"\"\"Vertical offset (mm) of one header row at every cell, followed along the row.\n\n    A sheet warped from three corners (or a bowed / rotated one) can have its header run 5 mm uphill over its 144 mm: far more\n    than a two-end registration may search without jumping onto the other row (pitch 5.5 mm).  The vertical profile of a\n    window of SEG cells (bright band - dark band - bright band, as in _register_row, independent of the data bits) is\n    searched +-TRACK_STEP_MM around the previous window's offset, starting with the widest search at the left end.  A window\n    with no dark cells (all-white data bits) has no contrast: the previous offset is kept.\"\"\"\n    n = len(row)\n    x, y, w, h = row[0]\n    step = 1.0 / ppm\n    centres, dys = [], []\n    prev = 0.0\n    for k, i0 in enumerate(sorted(set(list(range(0, n - TRACK_SEG + 1, TRACK_HOP)) + [n - TRACK_SEG]))):\n        xs0, xs1 = row[i0][0], row[i0 + TRACK_SEG - 1][0] + w\n        half = first_search if k == 0 else TRACK_STEP_MM\n        best = (-1e9, prev)\n        dys_ = np.arange(prev - half, prev + half + 1e-9, step)\n        if len(dys_):\n            sc = _band_scores(ii, ppm, xs0, xs1, y, h, dys_)\n            k = int(np.argmax(sc))\n            if sc[k] > best[0]:\n                best = (float(sc[k]), float(dys_[k]))\n        if best[0] >= TRACK_MIN_CONTRAST:\n            prev = best[1]\n        centres.append(i0 + (TRACK_SEG - 1) / 2.0)\n        dys.append(prev)\n    return np.interp(np.arange(n), centres, dys)\n\n\ndef _read_header(warped: np.ndarray, ppm: float):\n    \"\"\"Header decode with a wider registration retry (see _read_header_pass); the CRC-16 judges every attempt.\"\"\"\n    flat = _flatten_header(warped, ppm)\n    ii = cv2.integral(flat, sdepth=cv2.CV_64F)\n    h, info = _read_header_pass(flat, ii, ppm, (HEADER_SEARCH_MM, HEADER_SEARCH_MM), (1.2, 1.5))\n    if h is None and info.get(\"meta_contrast\", 1.0) >= META_MIN_CONTRAST:\n        h2, info2 = _read_header_pass(flat, ii, ppm, HEADER_WIDE_SEARCH_MM, HEADER_WIDE_DISAGREE_MM)\n        if h2 is not None:\n            info2[\"header_wide\"] = 1.0\n            return h2, info2\n        h3, info3 = _read_header_pass(flat, ii, ppm, HEADER_WIDE_SEARCH_MM, (HEADER_WIDE_DISAGREE_MM[0], 8.0), track=True)\n        if h3 is not None:\n            info3[\"header_tracked\"] = 1.0\n            return h3, info3\n    return h, info\n\n\ndef _read_header_pass(flat: np.ndarray, ii: np.ndarray, ppm: float, search, disagree, track=False):\n    \"\"\"Decode the two-row self-describing header.  Returns (Header | None, info).\n\n    Each row is regi
