, FI[:n_id], SI[:n_id], float(ink), float(min_str), verified=coef is not None,\n                  FS=FI[n_id:] if sg is not None else None, SS=SI[n_id:] if sg is not None else None,\n                  ink_source=ia.source, ink_separation=float(ia.separation),\n                  MA=MA, MI=MI[:n_id], MS=MI[n_id:] if sg is not None else None)\n    dec = decide_page(raw)\n    res.answers, res.id_digits, res.student_id, idflags, res.calibration = \\\n        dec.answers, dec.id_digits, dec.student_id, dec.flags, dec.calibration\n    res.subject_digits, res.subject = dec.subject_digits, dec.subject\n    order = sorted(range(len(res.answers)), key=lambda i: res.answers[i].number)\n    res.answers = [res.answers[i] for i in order]\n    res.raw = raw\n    raw.decided_sig = decision_sig(dec.answers, res.student_id, res.subject)   # what `omr.fusion.trustworthy` compares against\n    if coef is None:  # bubble positions could not be verified against the printed rings: trust nothing\n        res.flags.append(\"alignment_unverified\")\n    res.flags.extend(idflags)\n    lap(\"score\", t0)\n\n    # ---- 7. name box crop (kept so a later stage can read/OCR it)\n    x, y, w, h = pg.name_box\n    res.name_crop = warped[int(y * px_per_mm):int((y + h) * px_per_mm), int(x * px_per_mm):int((x + w) * px_per_mm)].copy() \\\n        if keep_images else None\n    res.status = OK\n    return done(res)\n", "omr/fusion.py": "\"\"\"Multi-frame fusion: one physical sheet seen in many frames -> one set of decisions.\n\nA *track* is a run of frames believed to be the same physical sheet.  Per-bubble raw measurements (fill and\nstrength, exposed by `recognize` as `result.raw`) are fused with a per-bubble median over the track's recent\nframes, and the ONE decision function (`omr.recognize.decide_page`) runs on the fused arrays - the rules are not\nduplicated here.  Different frames typically leave different digits unreadable (blur, a light mark, a shadow);\nthe median resolves what no single frame could.\n\nA frame joins the track only if it is compatible with it, otherwise the track ends and a new one starts with\nthat frame.  Two sheets are never blended:\n  * another form (form_key) / page, or another (readable) serial;\n  * a jump of the sheet quad between consecutive frames (moved or replaced);\n  * a confident contradiction: a digit (student ID or subject code) / answer the fused track reads confidently\n    that this frame reads confidently as something else (a different readable subject = another sheet), or >= CONTRADICT_BUBBLES bubbles whose fill swings by >= CONTRADICT_FILL\n    against the fused value (a different hand-drawn mark pattern, even when no single decision is confident).\nFrames whose bubble alignment could not be verified (`raw.verified` False) never contribute.\nPure: no I/O, no clock.\n\"\"\"\nfrom __future__ import annotations\n\nimport copy\nimport warnings\nfrom collections import Counter, deque\nfrom typing import Optional, Tuple\n\nimport numpy as np\n\nfrom .fastops import nanmedian0\nfrom .recognize import UNRELIABLE_FILL, UNRELIABLE_STRENGTH, PageRaw, decide_page, decision_sig, unreliable_mask\n\nWINDOW = 12              # most recent frames fused (the median adapts, memory is bounded)\nCONTRADICT_FILL = 0.6    # per-bubble fill swing that counts as a contradiction ...\nCONTRADICT_BUBBLES = 2   # ... when at least this many bubbles swing\nJUMP_FRACTION = 0.2      # sheet-quad centre jump (fraction of sheet size) between consecutive frames\nSCALE_JUMP = 0.35        # relative change of the sheet size between consecutive frames\nID_FLAGS = (\"id_blank\", \"id_unreadable\", \"alignment_unverified\", \"subject_blank\", \"subject_unreadable\",\n            \"id_guessed\", \"subject_guessed\", \"guessed_answers\")\n\n\ndef sheet_quad(r):\n    \"\"\"(cx, cy, size) of the projected page rectangle in image px (independent of which markers were visible).\"\"\"\n    if r.homography is None:\n        return None\n    try:\n        q = r.image_points([[0, 0], [210, 0], [210, 297], [0, 297]])\n    except Exception:\n        return None\n    return (float(q[:, 0].mean()), float(q[:, 1].mean()),\n            float(max(np.ptp(q[:, 0]), np.ptp(q[:, 1]))))\n\n\ndef _sig(answers, student_id, subject):\n    return decision_sig(answers, student_id, subject)\n\n\ndef trustworthy(r) -> bool:\n    \"\"\"A frame can feed a track: raw measurements present, verified, and consistent with the frame's decisions\n    (a result whose decisions were edited after the fact is not fused).\"\"\"\n    raw = r.raw\n    if raw is None or not raw.verified:\n        return False\n    # the decision signature recognize() took when it decided this very raw (decide_page is deterministic): not decided again per frame\n    sig = getattr(raw, \"decided_sig\", None)\n    if sig is None:\n        d = decide_page(raw)\n        sig = _sig(d.answers, d.student_id, d.subject)\n    return sig == _sig(r.answers, r.student_id, r.subject)\n\n\nclass Track:\n    def __init__(self, no: int, r, t: float):\n        self.no = no\n        self.form_key, self.page = r.form_key, r.page\n        self.frames: deque = deque(maxlen=WINDOW)\n        self.serials: Counter = Counter()\n        self.t0 = self.t_last = t\n        self.n = 0\n        self.quad = None\n        self.committed = False\n        self.held_since: Optional[float] = None    # set while a stable-but-unreadable-ID result is being held\n        self.best = None                            # (sharpness, result, payload, t) of the sharpest frame\n        self._dec = None\n        self._raw: Optional[PageRaw] = None\n        self.add(r, t, None)\n\n    # ------------------------------------------------------------------ fusion\n    def fused_raw(self) -> PageRaw:\n        if self._raw is None:\n            fr = list(self.frames)\n            r0 = fr[-1]\n\n            def med(f):\n                return np.median(np.stack([getattr(x, f) for x in fr]), axis=0)\n\n            def med_fs(ff, sf):    # fill + strength: a frame that judged a bubble unknowable (sentinel) does not vote on it; unknowable in every frame -> stays unknowable\n                F, S = np.stack([getattr(x, ff) for x in fr]), np.stack([getattr(x, sf) for x in fr])\n                bad = unreliable_mask(F, S)\n                with warnings.catch_warnings():\n                    warnings.simplefilter(\"ignore\", RuntimeWarning)\n                    mf, ms = nanmedian0(np.where(bad, np.nan, F)), nanmedian0(np.where(bad, np.nan, S))\n                allbad = bad.all(axis=0)\n                return np.where(allbad, UNRELIABLE_FILL, mf), np.where(allbad, UNRELIABLE_STRENGTH, ms)\n\n            def nanmed(f):    # disc darkness (relative rule): NaN = unknowable bubble; a frame without it does not vote; None when no frame has it\n                have = [getattr(x, f) for x in fr if getattr(x, f) is not None]\n                if not have:\n                    return None\n                with warnings.catch_warnings():\n                    warnings.simplefilter(\"ignore\", RuntimeWarning)\n                    return nanmedian0(np.stack(have))\n\n            FA, SA = med_fs(\"FA\", \"SA\")\n            FI, SI = med_fs(\"FI\", \"SI\")\n            subj = {}\n            if r0.FS is not None:    # same form on every frame of a track (form_key), so FS is present on all or none\n                FS, SS = med_fs(\"FS\", \"SS\")\n                subj = dict(FS=FS, SS=SS, MS=nanmed(\"MS\"))\n            self._raw = PageRaw(r0.numbers, r0.labels, r0.digit_index, FA, SA, FI, SI,\n                                float(np.median([x.ink for x in fr])), float(np.median([x.min_strength for x in fr])), True,\n                                ink_source=\"default\" if any(x.ink_source == \"default\" for x in fr) else \"auto\",\n                                ink_separation=float(np.median([x.ink_separation for x in fr])),\n                                MA=nanmed(\"MA\"), MI=nanmed(\"MI\"), **subj)\n        return self._raw\n\n    def decisions(self):\n        if self._dec is None:\n            self._dec = decide_page(self.fused_raw())\n        return self._dec\n\n    def serial(self) -> Optional[int]:\n        return self.serials.most_common(1)[0][0] if self.serials else None\n\n    # ------------------------------------------------------------------ membership\n    def incompatible(self, r) -> Optional[str]:\n        if (r.form_key, r.page) != (self.form_key, self.page):\n            return \"other_sheet\"\n        if r.serial is not None and self.serial() is not None and r.serial != self.serial():\n            return \"other_serial\"\n        q = sheet_quad(r)\n        if q is not None and self.quad is not None:\n            (x0, y0, s0), (x1, y1, s1) = self.quad, q\n            if ((x1 - x0) ** 2 + (y1 - y0) ** 2) ** 0.5 > JUMP_FRACTION * max(s0, s1) or abs(s1 - s0) > SCALE_JUMP * max(s0, s1):\n                return \"moved\"\n        if self.n >= 2 and self._contradicts(r):\n            return \"contradiction\"\n        return None\n\n    def _contradicts(self, r) -> bool:\n        dec = self.decisions()\n        for a, b in zip(dec.answers, r.answers):\n            if not a.ambiguous and not b.ambiguous and (a.state, a.marked) != (b.state, b.marked):   # (a guessed row is ambiguous: never a contradiction)\n                return True\n        for a, b in list(zip(dec.id_digits, r.id_digits)) + list(zip(dec.subject_digits, r.subject_digits)):\n            if a.value is not None and b.value is not None and not (a.guessed or b.guessed) and a.value != b.value:\n                return True\n        fr, raw = self.fused_raw(), r.raw\n        swing = int((np.abs(fr.FA - raw.FA) >= CONTRADICT_FILL).sum() + (np.abs(fr.FI - raw.FI) >= CONTRADICT_FILL).sum())\n        if fr.FS is not None and raw.FS is not None:\n            swing += int((np.abs(fr.FS - raw.FS) >= CONTRADICT_FILL).sum())\n        return swing >= CONTRADICT_BUBBLES\n\n    def add(self, r, t: float, payload) -> None:\n        self.frames.append(r.raw)\n        self.n += 1\n        self.t_last = t\n        if r.serial is not None:\n            self.serials[r.serial] += 1\n        self.quad = sheet_quad(r) or self.quad\n        self._raw = self._dec = None\n        sharp = float((r.quality or {}).get(\"sharpness\", 0.0))\n        if self.best is None or sharp > self.best[0]:\n            self.best = (sharp, r, payload, t)\n\n    # ------------------------------------------------------------------ result\n    def apply(self, r):\n        \"\"\"Copy of frame result `r` carrying the track's fused decisions.\"\"\"\n        dec = self.decisions()\n        out = copy.copy(r)\n        out.answers, out.id_digits, out.student_id, out.calibration = dec.answers, dec.id_digits, dec.student_id, dec.calibration\n        out.subject, out.subject_digits = dec.subject, dec.subject_digits\n        out.flags = [f for f in r.flags if f not in ID_FLAGS] + dec.flags\n        s = self.serial()\n        if s is not None:\n            out.serial = s\n            out.flags = [f for f in out.flags if f != \"serial_unreadable\"]\n        out.fused_frames = len(self.frames)\n        out.trace_src = (self.fused_raw(), list(self.frames))   # not a dataclass field: the fused measurements + the per-frame ones, for the dev log (standalone/glue.py)\n        return out\n\n    def id_unreadable(self) -> bool:\n        \"\"\"No confident ID yet: unreadable, or only a best guess (more frames may still settle it).\"\"\"\n        f = self.decisions().flags\n        return \"id_unreadable\" in f or \"id_guessed\" in f\n\n    def subject_unreadable(self) -> bool:\n        f = self.decisions().flags\n        return \"subject_unreadable\" in f or \"subject_guessed\" in f\n", "omr/identity.py": "\"\"\"Physical-sheet identity, shared by the stream state machine and the database policy.\n\n    sheet_key = sha1(f\"{serial:04d}|{subject_text}|{student_id_text}\")\n\n``serial`` is the printed per-copy number (0 = none, e.g. a photocopied master -> \"0000\", so the key\ndegrades to \"identity = subject + student ID\" without any special case).  ``student_id_text`` is the read ID, or\nthe raw per-digit reading with '?' for unread digits when the ID could not be read (deterministic).\n``subject_text`` is the marked subject code, read the same way ('?' per unread digit; \"\" for a form without a\nsubject code).  The form itself (``form_key``) and the page are NOT part of the key: callers pair it with them.\nWorks on a RecognitionResult or on its ``to_dict()``.\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nfrom typing import Optional\n\n\ndef _get(r, name, default=None):\n    return r.get(name, default) if isinstance(r, dict) else getattr(r, name, default)\n\n\ndef serial_of(r) -> int:\n    try:\n        return int(_get(r, \"serial\") or 0)\n    except (TypeError, ValueError):\n        return 0\n\n\ndef _digits_text(value, digits) -> str:\n    if value is not None and str(value).strip():\n        return str(value).strip()\n    out = []\n    for d in digits or []:\n        v = d.get(\"value\") if isinstance(d, dict) else getattr(d, \"value\", None)\n        out.append(\"?\" if v is None else str(v))\n    return \"\".join(out)\n\n\ndef student_id_text(r) -> str:\n    return _digits_text(_get(r, \"student_id\"), _get(r, \"id_digits\"))\n\n\ndef subject_text(r) -> str:\n    return _digits_text(_get(r, \"subject\"), _get(r, \"subject_digits\"))\n\n\ndef make_sheet_key(serial: int, id_text: str, subject: str = \"\") -> str:\n    return hashlib.sha1(f\"{int(serial or 0):04d}|{subject}|{id_text}\".encode()).hexdigest()[:16]\n\n\ndef sheet_key(r) -> str:\n    return make_sheet_key(serial_of(r), student_id_text(r), subject_text(r))\n\n\ndef format_serial(serial: Optional[int]) -> str:\n    return f\"No. {int(serial):04d}\" if serial else \"\"\n\n\n# ---- commit feedback for the person scanning (server and standalone use the same rule)\nSEVERE_FLAGS = (\"id_unreadable\", \"id_guessed\", \"id_blank\", \"subject_unreadable\", \"subject_guessed\", \"subject_blank\")\nQUIET_FLAGS = (\"serial_unreadable\", \"corner_hidden\", \"marker_dropped\")   # informational: no warning\n\n\ndef severity(r) -> str:\n    \"\"\"'severe' = the sheet's identity (student ID / subject code) is not reliably read: rescan or fix now;\n    'minor' = identity fine but some answer rows need a look (ambiguous / multi / guessed / other review flags);\n    'ok' = nothing to check.  Works on a RecognitionResult or its to_dict().\"\"\"\n    flags = list(_get(r, \"flags\", None) or [])\n    has_id = bool(_get(r, \"id_digits\", None))\n    if any(f in SEVERE_FLAGS for f in flags) or (has_id and not _get(r, \"student_id\", None)):\n        return \"severe\"\n    answers = _get(r, \"answers\", None) or []\n    doubtful = any((a.get(\"ambiguous\") or a.get(\"state\") == \"multi\") if isinstance(a, dict)\n                   else (a.ambiguous or a.state == \"multi\") for a in answers)\n    if doubtful or _get(r, \"needs_review\", False) or any(f not in QUIET_FLAGS for f in flags):\n        return \"minor\"\n    return \"ok\"\n", "omr/revision.py": "\"\"\"Revision of a committed sheet: upgrade-only merge of a later (fused) reading into the committed one.\n\nAfter a commit the sheet usually stays in view for a while and its frames keep fusing (omr/fusion.Track).  `merge`\ncompares the fresh fused reading `now` with the committed one `base`, row by row (answer rows, the ID, the subject):\n\n  * base row doubtful (ambiguous / guessed / unreadable) and now confident  -> adopted (\"changed\")\n  * base row confident and now confident but DIFFERENT                      -> NOT adopted; reported as a contradiction\n  * anything else (still doubtful, or a confident row turning doubtful)     -> base kept\n\nso a confident row is never flipped quietly; a contradiction adds the soft-hard flag \"contradiction\" (needs review).\nPure.  Works on RecognitionResult objects; `now` supplies images / geometry, the rows come from `base` or `now`.\n\"\"\"\nfrom __future__ import annotations\n\nimport copy\nfrom typing import List, Tuple\n\nCONTRADICTION_FLAG = \"contradiction\"\n_ID_FLAGS = (\"id_blank\", \"id_unreadable\", \"id_guessed\")\n_SUBJECT_FLAGS = (\"subject_blank\", \"subject_unreadable\", \"subject_guessed\")\n\n\ndef answer_confident(a) -> bool:\n    return not (a.ambiguous or a.guessed)\n\n\ndef _val(a):\n    return (a.state, tuple(a.marked))\n\n\ndef id_confident(r) -> bool:\n    return r.student_id is not None and \"id_guessed\" not in r.flags\n\n\ndef subject_confident(r) -> bool:\n    return r.subject is not None and \"subject_guessed\" not in r.flags\n\n\ndef doubtful(r) -> bool:\n    \"\"\"Anything left that a later frame could still resolve?\"\"\"\n    if r.id_digits and not id_confident(r):\n        return True\n    if r.subject_digits and not subject_confident(r):\n        return True\n    return any(not answer_confident(a) for a in r.answers)\n\n\ndef merge(base, now) -> Tuple[object, List[str], List[str]]:\n    \"\"\"-> (merged result, changed rows, contradicted rows); rows are \"q<number>\", \"id\", \"subject\".\"\"\"\n    changed: List[str] = []\n    contra: List[str] = []\n    answers = []\n    by_num = {a.number: a for a in now.answers}\n    for b in base.answers:\n        n = by_num.get(b.number)\n        keep = b\n        if n is not None:\n            if answer_confident(b):\n                if answer_confident(n) and _val(n) != _val(b):\n                    contra.append(f\"q{b.number}\")\n            elif answer_confident(n):\n                keep = n\n                changed.append(f\"q{b.number}\")\n        answers.append(keep)\n    out = copy.copy(now)\n    out.answers = answers\n    flags = [f for f in now.flags if f not in _ID_FLAGS + _SUBJECT_FLAGS + (\"guessed_answers\", CONTRADICTION_FLAG)]\n    for name, conf, digits_attr, val_attr, fl in ((\"id\", id_confident, \"id_digits\", \"student_id\", _ID_FLAGS),\n                                                  (\"subject\", subject_confident, \"subject_digits\", \"subject\", _SUBJECT_FLAGS)):\n        if not getattr(base, digits_attr):\n            src = now\n        elif conf(base):\n            src = base\n            if conf(now) and getattr(now, val_attr) != getattr(base, val_attr):\n                contra.append(name)\n        elif conf(now):\n            src = now\n            changed.append(name)\n        else:\n            src = base\n        setattr(out, digits_attr, getattr(src, digits_attr))\n        setattr(out, val_attr, getattr(src, val_attr))\n        flags += [f for f in src.flags if f in fl]\n    if any(a.guessed for a in answers):\n        flags.append(\"guessed_answers\")\n    if contra or CONTRADICTION_FLAG in base.flags:\n        flags.append(CONTRADICTION_FLAG)\n    out.flags = flags\n    return out, changed, contra\n", "omr/stream.py": "\"\"\"Frame-by-frame \"barcode scanner\" state machine.  Pure: no I/O, no clock, no threads.\n\n    session = StreamSession()        # self-describing sheets: no database or layout resolver is needed\n    event = session.feed(recognition_result, t_seconds, payload=frame)\n\nevent = {\"state\", \"hint\", \"overlay\", \"frame_index\", \"commit\"?}\n\nStates\n  idle       no sheet in view\n  detecting  a sheet is in view but nothing is committed for it yet\n  committed  this very frame completed a commit (event[\"commit\"] is set)\n  cooldown   the committed sheet is still in view; nothing more is committed for it\n\nRules\n  * A commit needs K consecutive `ok` frames with the same decision key\n    (form_key, page, subject code, student id, per-question state + marked).  One frame never commits.\n  * After a commit the same sheet cannot commit again until it has been gone for M consecutive frames\n    (no_sheet / partial), after which the session is idle again.\n  * Cooldown, sheet held continuously (no interruption since the commit): strict.  Only another form /\n    page, another readable student id or subject code, or answers differing in more than SWAP_FRACTION of the questions\n    count as a different sheet; smaller changes (a borderline bubble flipping) never commit a second version.\n  * Cooldown after an INTERRUPTION since the commit: a run of >= INTERRUPT_FRAMES (2) consecutive non-ok\n    frames of any status, or a jump of the marker quad between consecutive ok frames (centre moved by more\n    than JUMP_FRACTION of the sheet size, or its size changed by more than SCALE_JUMP) means the sheet was\n    moved or replaced.  The next K-stable key then commits if it differs from the committed key in any way\n    (a missed sheet is worse than an extra commit; the DB dedupes identical ones).  An identical key is the\n    same sheet put back: no commit, and the interruption is considered settled.\n  * Sheet identity: `sheet_key` = hash(serial|subject text|student-id text) (omr/identity.py).  A different key is another\n    sheet (commit once K-stable, in cooldown too); the same key and page is the same sheet.  Serial 0 (a\n    photocopied master) is just \"0000\", so identity degrades to the student ID.  Unreadable-ID digits can\n    flicker and occasionally cost an extra commit; the DB dedupes / queues it.\n  * Optional filters (`allowed_forms`: form_keys, `allowed_subjects`: subject codes) make a scanner ignore other\n    forms / subjects.  A frame whose subject is not readable is NOT filtered out (it may be the wanted one).\n  * Missed-sheet check: a (form_key, page, sheet_key) seen in >= MISSED_MIN_FRAMES ok frames that was never\n    committed in this session, and is no longer the sheet in view, is reported by `missed()`.\n  * Presence: a frame with any marker visible (status != no_sheet, i.e. also `partial`, `bad_*`, `inconsistent`)\n    means a sheet is in view.  Consecutive presence forms an episode that ends after M consecutive no_sheet\n    frames.  An episode of >= MISSED_MIN_FRAMES frames that never produced a commit is reported by\n    `unread_episodes()`: a sheet that was shown but never read (covered marker, blur, ...), also when it never\n    produced a single `ok` frame.  Events carry `present` and `unread` (the current episode is long enough\n    and still without a commit) for the live hint.\n  * Fusion (omr/fusion.py): frames of one physical sheet form a track; their per-bubble measurements are fused\n    (median) and decided by the same decision function, so a digit unreadable in every single frame can still\n    resolve.  All rules above (K-stable key, cooldown, sheet identity) operate on the FUSED result.  A track\n    never commits twice.  A stable result whose ID or subject code is still unreadable is held up to HOLD_SECONDS while the sheet\n    stays in view; it is committed unreadable only when the hold expires or the track ends (>= 2 non-contributing\n    frames, a contradicting / different sheet, `finish()`).  The commit carries the fused decisions with the\n    sharpest frame's images and `result.fused_frames`.\n  * Revision (omr/revision.py): frames of the SAME track keep fusing in cooldown.  While the committed result still has a\n    doubtful / guessed / unreadable row (at most REVISE_FRAMES frames / REVISE_SECONDS), a fused reading that makes such a\n    row confident emits event[\"revision\"] (a commit-like payload + `changed` rows + `severity`/`prev_severity`).  UPGRADE-ONLY:\n    a row that was confident at commit is never changed; fused evidence that contradicts it is reported once as\n    `contradiction` rows (flag \"contradiction\", needs review) with the row left as committed.  A different sheet ends\n    the track as before.  Each revision becomes the new committed result.\n  * The commit carries the sharpest of the K agreeing frames (result + the caller's payload).\n    Fusing the K frames' scores into one result would go in `_pick`.\n\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Any, Callable, Dict, Iterable, List, Optional, Tuple\n\nfrom .fusion import Track, trustworthy\nfrom .identity import sheet_key as _sheet_key, serial_of, severity\nfrom .revision import merge as _merge, doubtful as _doubtful\n\nIDLE, DETECTING, COMMITTED, COOLDOWN = \"idle\", \"detecting\", \"committed\", \"cooldown\"\n\nDEFAULT_K = 3\nDEFAULT_M = 5\nDEFAULT_FAST_K = 2           # frames needed instead of k when the fused result has nothing left to doubt (see `_confident`)\nDEFAULT_HINT_AFTER = 2.0     # seconds a sheet may be in view without stabilising before a hint appears\nINTERRUPT_FRAMES = 2         # consecutive non-ok frames that count as \"the sheet was disturbed\"\nJUMP_FRACTION = 0.2          # marker-quad centre jump, as a fraction of the sheet size\nSCALE_JUMP = 0.35            # relative change of the sheet size between consecutive frames\nSWAP_FRACTION = 0.3          # share of differing questions that marks a different physical sheet\nLOW_RES_PX_PER_MM = 2.2      # source px per mm below which \"move closer\" is the likely fix\nLOW_SHARPNESS = 40.0         # Laplacian variance below which \"hold still\" is the likely fix\nDEFAULT_BUBBLE_MM = 4.0\n\nHOLD_SECONDS = 1.5           # an unreadable ID is given this long (sheet still in view) to resolve through fusion\nTRACK_GAP = INTERRUPT_FRAMES  # consecutive non-contributing frames that end a track\n\nMISSED_MIN_FRAMES = 2        # ok frames a sheet must be seen in to count as \"seen\" for the missed-sheet check\n\nREVISE_FRAMES = 40           # ok frames after a commit during which the same sheet's evidence may still revise it ...\nREVISE_SECONDS = 6.0         # ... or this many seconds, whichever ends first (or earlier: nothing doubtful is left)\n\nABSENT = (\"no_sheet\", \"partial\")\n\n# overlay bubble codes\nB_EMPTY, B_MARKED, B_MULTI, B_AMBIGUOUS = 0, 1, 2, 3\n\n\ndef _confident(r) -> bool:\n    \"\"\"Nothing left to doubt: ID and subject read (not guessed), no review flag, every answer single and unambiguous.\"\"\"\n    return (r.student_id is not None and r.subject is not None and not r.needs_review\n            and not r.id_guessed and not r.subject_guessed)\n\n\ndef decision_key(r) -> tuple:\n    return (r.form_key, r.page, r.student_id,\n            tuple((a.number, a.state, tuple(a.marked)) for a in r.answers), _sheet_key(r), r.subject)\n\n\ndef identity(r) -> tuple:\n    return (r.form_key, r.page, r.student_id, r.subject)\n\n\ndef sheet_id(r) -> tuple:\n    \"\"\"(form_key, page, sheet_key): the physical-sheet identity used by the missed-sheet check.\"\"\"\n    return (r.form_key, r.page, _sheet_key(r))\n\n\ndef _answer_distance(a: tuple, b: tuple) -> float:\n    da = {n: (s, m) for n, s, m in a}\n    db = {n: (s, m) for n, s, m in b}\n    keys = set(da) | set(db)\n    if not keys:\n        return 0.0\n    return sum(1 for k in keys if da.get(k) != db.get(k)) / len(keys)\n\n\ndef _quad(r):\n    \"\"\"(cx, cy, size) of the marker quad in image px, or None.\"\"\"\n    pts = [p for q in r.marker_corners.values() for p in q]\n    if not pts:\n        return None\n    xs, ys = [p[0] for p in pts], [p[1] for p in pts]\n    return ((min(xs) + max(xs)) / 2, (min(ys) + max(ys)) / 2, max(max(xs) - min(xs), max(ys) - min(ys)))\n\n\ndef is_other_sheet(committed_key: tuple, key: tuple) -> bool:\n    \"\"\"Is `key` a different physical sheet than the one already committed (both ok-frame keys)?\"\"\"\n    f0, p0, s0, a0, k0, u0 = committed_key\n    f1, p1, s1, a1, k1, u1 = key\n    if f0 != f1 or p0 != p1 or k0 != k1:\n        return True\n    if s0 is not None and s1 is not None and s0 != s1:\n        return True\n    if u0 is not None and u1 is not None and u0 != u1:\n        return True\n    return _answer_distance(a0, a1) > SWAP_FRACTION\n\n\nclass StreamSession:\n    def __init__(self, k: int = DEFAULT_K, m: int = DEFAULT_M, hint_after: float = DEFAULT_HINT_AFTER,\n                 allowed_forms: Optional[Iterable[str]] = None, allowed_subjects: Optional[Iterable[str]] = None,\n                 resolve_layout: Optional[Callable[[int], Any]] = None, fuse: bool = True, hold_s: float = HOLD_SECONDS,\n                 fast_k: Optional[int] = DEFAULT_FAST_K):\n        self.fuse, self.hold_s = fuse, hold_s\n        self.fast_k = fast_k            # frames needed instead of k when the result is fully confident (None = always k)\n        if fast_k is not None and fast_k < 2:\n            raise ValueError(\"fast_k must be >= 2: a single frame must never commit\")\n        if k < 2:\n            raise ValueError(\"k must be >= 2: a single frame must never commit\")\n        self.k, self.m, self.hint_after = k, m, hint_after\n        self.allowed_forms = None if allowed_forms is None else set(allowed_forms)\n        self.allowed_subjects = None if allowed_subjects is None else set(allowed_subjects)\n        self.resolve_layout = resolve_layout       # legacy sheets only: form_id -> Layout (for the overlay bubble size)\n        self.frame_index = -1\n        self.reset_tracking()\n        self.reset()\n\n    def reset_tracking(self) -> None:\n        \"\"\"Forget which sheets were seen / committed (start of a new scanning session).\"\"\"\n        self._seen: Dict[Any, dict] = {}         # track number (or sheet_id for unfused frames) -> info\n        self._committed_ids: set = set()\n        self._current: Any = None                # _seen key of the sheet in view right now\n        self._track: Optional[Track] = None\n        self._track_no = 0\n        self._tgap = 0                           # consecutive frames that did not contribute to the track\n        self._ep: Optional[dict] = None           # presence episode in progress\n        self._episodes: List[dict] = []           # finished episodes\n        self._gap = 0                             # consecutive no_sheet frames\n\n    def missed(self, final: bool = False) -> List[dict]:\n        \"\"\"Sheets (tracks) seen in >= MISSED_MIN_FRAMES ok frames but never committed (the sheet in view is\n        excluded unless ``final``).\"\"\"\n        out = []\n        for key, info in self._seen.items():\n            if info[\"committed\"] or info[\"sid\"] in self._committed_ids or info[\"frames\"] < MISSED_MIN_FRAMES:\n                continue\n            if key == self._current and not final:\n                continue\n            m = {\"form_key\": info[\"sid\"][0], \"page\": info[\"sid\"][1], \"serial\": info[\"serial\"],\n                 \"student_id\": info[\"student_id\"], \"frames\": info[\"frames\"]}\n            if info.get(\"possibly_same_as\"):\n                m[\"possibly_same_as\"] = info[\"possibly_same_as\"]\n            out.append(m)\n        return sorted(out, key=lambda m: (m[\"serial\"] or 0, m[\"page\"] if m[\"page\"] is not None else -1))\n\n    def _track_presence(self, status: str, t: float, hint_status: str) -> None:\n        if status == \"no_sheet\":\n            self._gap += 1\n            if self._ep is not None and self._gap >= self.m:\n                self._episodes.append(self._ep)\n                self._ep = None\n            return\n        self._gap = 0\n        if self._ep is None:\n            self._ep = {\"t0\": t, \"t1\": t, \"frames\": 0, \"ok\": 0, \"commits\": 0, \"statuses\": {}, \"page\": None}\n        e = self._ep\n        e[\"t1\"] = t\n        e[\"frames\"] += 1\n        e[\"ok\"] += status == \"ok\"\n        e[\"statuses\"][status] = e[\"statuses\"].get(status, 0) + 1\n\n    def unread_episodes(self, final: bool = False) -> List[dict]:\n        \"\"\"Sheet-present stretches (any marker visible, incl. `partial`) that never produced a commit.\n        The one in progress is included only with ``final`` (it may still be read).\"\"\"\n        eps = list(self._episodes) + ([self._ep] if final and self._ep is not None else [])\n        return [dict(e) for e in eps if e[\"commits\"] == 0 and e[\"frames\"] >= MISSED_MIN_FRAMES]\n\n    def reset(self) -> None:\n        self.state = IDLE\n        self._absent = 0\n        self._run_key: Optional[tuple] = None\n        self._run_n = 0\n        self._best: Optional[tuple] = None          # (sharpness, result, payload, t)\n        self._committed_key: Optional[tuple] = None\n        self._committed_res = None                   # the committed (fused) result, for identity-by-evidence\n        self._since: Optional[float] = None          # when the current uncommitted sheet came into view\n        self._nonok = 0                              # consecutive non-ok frames\n        self._interrupted = False                    # sheet disturbed since the last commit\n        self._prev_quad: Optional[tuple] = None      # (cx, cy, size) of the previous ok frame\n        self._rev: Optional[dict] = None             # revision watch of the committed track (see _revise)\n\n    # ------------------------------------------------------------------ main entry\n    def feed(self, r, t: float, payload: Any = None) -> dict:\n        self.frame_index += 1\n        commit = None\n        hint = \"\"\n        self._revision = None\n        status = r.status\n        r0 = r\n        pre = None                    # commit produced by a track that ended with this frame\n        if status == \"ok\":\n            self._nonok = 0\n        else:\n            self._nonok += 1\n            self._prev_quad = None\n            if self._nonok >= INTERRUPT_FRAMES and self._committed_key is not None:\n                self._interrupted = True\n        # ---- track bookkeeping (fusion)\n        if status == \"ok\" and self.fuse and trustworthy(r):\n            self._tgap = 0\n            why = self._track.incompatible(r) if self._track is not None else None\n            if why is not None:\n                pre = self._end_track()\n            if self._track is None:\n                self._track_no += 1\n                self._track = Track(self._track_no, r, t)\n                self._track.best = (float((r.quality or {}).get(\"sharpness\", 0.0)), r, payload, t)\n            else:\n                self._track.add(r, t, payload)\n            r = self._track.apply(r)\n        else:\n            self._tgap += 1\n            if self._tgap >= TRACK_GAP and self._track is not None:\n                pre = self._end_track()\n        self._track_presence(status, t, status)\n\n        if pre is not None:\n            commit = pre\n        if status in ABSENT:\n            self._run_key, self._run_n, self._best = None, 0, None\n            self._absent += 1\n            if self._absent >= self.m:\n                self._current = None\n                self.reset()\n            elif self.state == COMMITTED:\n                self.state = COOLDOWN\n            hint = self._absent_hint(r)\n        else:\n            self._absent = 0\n            if self._since is None and self.state in (IDLE, DETECTING):\n                self._since = t\n            if self.state == IDLE:\n                self.state = DETECTING\n            elif self.state == COMMITTED:\n                self.state = COOLDOWN\n            if status == \"ok\":\n                hint, c2 = self._feed_ok(r, t, payload)\n                commit = commit or c2\n            else:\n                self._run_key, self._run_n, self._best = None, 0, None\n                hint = self._bad_hint(r, t)\n\n        if commit is not None:\n            self.state = COMMITTED\n            hint = \"Scanned\"\n            if self._ep is not None:\n                self._ep[\"commits\"] += 1\n        elif self.state == COOLDOWN and not hint:\n            hint = \"Scanned - show the next sheet\"\n        elif self.state == IDLE and not hint:\n            hint = \"Show a sheet\"\n        ev = {\"state\": self.state, \"hint\": hint, \"overlay\": self.overlay(r), \"frame_index\": self.frame_index,\n              \"present\": status != \"no_sheet\",\n              \"possibly_same\": any(i.get(\"possibly_same_as\") and not i[\"committed\"] for i in self._seen.values()),\n              \"unread\": bool(self._ep is not None and self._ep[\"commits\"] == 0 and self._ep[\"frames\"] >= MISSED_MIN_FRAMES)}\n        if commit is not None:\n            ev[\"commit\"] = commit\n        elif self._revision is not None:\n            ev[\"revision\"] = self._revision\n        return ev\n\n    def finish(self, t: float = 0.0) -> Optional[dict]:\n        \"\"\"End of stream: a held (stable, ID still unreadable) track is committed as it is.\"\"\"\n        c = self._end_track()\n        if c is not None:\n            self.state = COMMITTED\n        return c\n\n    # ------------------------------------------------------------------ tracks\n    def _end_track(self) -> Optional[dict]:\n        \"\"\"Close the current track; commit it if it was held (stable but not yet committed).\"\"\"\n        tr, self._track = self._track, None\n        self._tgap = 0\n        if tr is None or tr.committed or tr.held_since is None:\n            return None\n        sharp, r0, payload, t = tr.best\n        final = tr.apply(r0)\n        key = decision_key(final)\n        if self._committed_key is not None and self.state == COOLDOWN:      # same re-commit rules as for a live frame\n            if self._interrupted:\n                if key == self._committed_key:\n                    return None\n                if self._same_by_evidence(final):\n                    self._note_possible((\"t\", tr.no), final)\n                    return None\n            elif not is_other_sheet(self._committed_key, key):\n                return None\n        return self._do_commit(final, payload, t, key, tr.n, tr)\n\n    def _do_commit(self, final, payload, t, key, frames, track=None) -> dict:\n        commit = {\"result\": final, \"payload\": payload, \"key\": key, \"identity\": identity(final),\n                  \"t\": t, \"frames\": frames, \"frame_index\": self.frame_index, \"fused_frames\": final.fused_frames}\n        self._committed_key = key\n        self._committed_res = final\n        self._rev = None\n        if track is not None and self.fuse and _doubtful(final):\n            self._rev = {\"track\": track, \"base\": final, \"t0\": t, \"n\": 0, \"contra\": set(), \"count\": 0}\n        sid = sheet_id(final)\n        self._committed_ids.add(sid)\n        if track is not None:\n            track.committed = True\n            for k, info in self._seen.items():\n                if k == (\"t\", track.no):\n                    info[\"committed\"] = True\n        self._run_key, self._run_n, self._best = None, 0, None\n        self._since = None\n        self._interrupted = False\n        return commit\n\n    # ------------------------------------------------------------------ ok frames\n    def _feed_ok(self, r, t, payload):\n        if self.allowed_forms is not None and r.form_key not in self.allowed_forms:\n            self._run_key, self._run_n, self._best = None, 0, None\n            return \"Sheet is another form\", None\n        if (self.allowed_subjects is not None and r.subject is not None and not r.subject_guessed\n                and r.subject not in self.allowed_subjects):   # (a guessed subject never filters a sheet out)\n            self._run_key, self._run_n, self._best = None, 0, None\n            return \"Sheet is another subject\", None\n        key = decision_key(r)\n        sid = sheet_id(r)\n        tr = self._track if r.fused_frames else None\n        skey = (\"t\", tr.no) if tr is not None else sid\n        self._current = skey\n        seen = self._seen.setdefault(skey, {\"frames\": 0, \"committed\": False})\n        seen.update(sid=sid, serial=serial_of(r), student_id=r.student_id, subject=r.subject)\n        seen[\"frames\"] += 1\n        q = _quad(r)\n        if q is not None and self._prev_quad is not None and self._committed_key is not None:\n            (x0, y0, s0), (x1, y1, s1) = self._prev_quad, q\n            if ((x1 - x0) ** 2 + (y1 - y0) ** 2) ** 0.5 > JUMP_FRACTION * max(s0, s1) or abs(s1 - s0) > SCALE_JUMP * max(s0, s1):\n                self._interrupted = True\n        self._prev_quad = q\n        if key == self._run_key:\n            self._run_n += 1\n        else:\n            self._run_key, self._run_n, self._best = key, 1, None\n        sharp = float((r.quality or {}).get(\"sharpness\", 0.0))\n        if self._best is None or sharp > self._best[0]:\n            self._best = (sharp, r, payload, t)\n        if tr is not None and tr.committed:\n            self._revise(tr, r, t)                  # one commit per track; later evidence may only revise it\n            return \"\", None\n        committed_here = self.state == COOLDOWN and self._committed_key is not None\n        if committed_here:\n            if self._interrupted:\n                same = key != self._committed_key and self._same_by_evidence(r)\n                if same:\n                    self._note_possible(skey, r)\n                if key == self._committed_key or same:   # same sheet put back / re-seen\n                    if self._run_n >= self.k:\n                        self._interrupted = False\n                    return \"\", None\n            elif not is_other_sheet(self._committed_key, key):\n                return \"\", None                     # same sheet still in view (maybe flickering)\n        if self._run_n < (self.fast_k if self.fast_k is not None and _confident(r) else self.k):\n            return self._unstable_hint(r, t) if self.state != COOLDOWN else \"\", None\n        if tr is not None and (tr.id_unreadable() or tr.subject_unreadable()):   # stable, but may still resolve: hold while in view\n            if tr.held_since is None:\n                tr.held_since = t\n            if t - tr.held_since < self.hold_s:\n                return \"Reading the student ID...\", None\n        best = self._pick()\n        commit = self._do_commit(self._finalize(best[1]), best[2], best[3], key, self._run_n, tr)\n        return \"\", commit\n\n    def _revise(self, tr, r, t) -> None:\n        \"\"\"Same track, already committed: upgrade the committed result from the newly fused frame `r` (see module doc).\"\"\"\n        rv = self._rev\n        if rv is None or rv[\"track\"] is not tr:\n            return\n        rv[\"n\"] += 1\n        if rv[\"n\"] > REVISE_FRAMES or t - rv[\"t0\"] > REVISE_SECONDS:\n            self._rev = None\n            return\n        base = rv[\"base\"]\n        _, changed, contra = _merge(base, r)\n        new_contra = [c for c in contra if c not in rv[\"contra\"]]\n        if not changed and not new_contra:\n            return\n        merged, changed, contra = _merge(base, tr.apply(tr.best[1]))      # images / geometry of the sharpest frame so far\n        rv[\"contra\"].update(contra)\n        rv[\"count\"] += 1\n        key = decision_key(merged)\n        ev = {\"result\": merged, \"payload\": tr.best[2], \"key\": key, \"identity\": identity(merged), \"t\": t, \"frames\": tr.n,\n              \"frame_index\": self.frame_index, \"fused_frames\": merged.fused_frames, \"changed\": changed,\n              \"contradiction\": sorted(rv[\"contra\"]), \"new_contradiction\": new_contra, \"revision\": rv[\"count\"],\n              \"severity\": severity(merged), \"prev_severity\": severity(base), \"prev_key\": self._committed_key}\n        rv[\"base\"] = merged\n        self._committed_key, self._committed_res = key, merged\n        self._committed_ids.add(sheet_id(merged))\n        if not _doubtful(merged):\n            self._rev = None\n        self._revision = ev\n\n    def _same_by_evidence(self, r) -> bool:\n        \"\"\"After an interruption: a re-sighting whose ID is only partly readable but whose readable digits\n        (at least half) all agree with the committed sheet's ID, with IDENTICAL decisions on every answer and\n        equal serials (when either side has one), is treated as that sheet put back.  Never silent: the caller\n        records it as \"possibly the same sheet\" in the missed report.  No readable digit = no evidence: it\n        commits (a missed sheet is worse than an extra commit).\"\"\"\n        c = self._committed_res\n        if (c is None or c.student_id is None or c.id_guessed or (r.student_id is not None and not r.id_guessed)\n                or (c.form_key, c.page) != (r.form_key, r.page)):\n            return False\n        if r.subject is not None and not r.subject_guessed and r.subject != c.subject:\n            return False                            # a readable, different subject code is another sheet\n        if (r.serial is not None or c.serial is not None) and r.serial != c.serial:\n            return False\n        read = [(d.index, d.value) for d in r.id_digits if d.value is not None and not d.guessed]   # a guess is no evidence\n        if len(read) == len(r.id_digits):\n            return False                            # (inconsistent: an ID that is fully read would not be None)\n        if len(read) * 2 < len(c.id_digits) or any(c.student_id[i] != str(v) for i, v in read if i < len(c.student_id)):\n            return False\n        return [(a.number, a.state, a.marked) for a in c.answers] == [(a.number, a.state, a.marked) for a in r.answers]\n\n    def _note_possible(self, skey, r) -> None:\n        \"\"\"A commit was suppressed by `_same_by_evidence`: keep it visible (missed report + event).\"\"\"\n        info = self._seen.get(skey)\n        if info is not None:\n            info[\"possibly_same_as\"] = self._committed_res.student_id\n            info[\"student_id\"] = r.student_id\n\n    def _finalize(self, r):\n        \"\"\"The frame result chosen for the commit, carrying the track's latest fused decisions.\"\"\"\n        if r.fused_frames and self._track is not None:\n            return self._track.apply(r)\n        return r\n\n    def _pick(self):\n        \"\"\"Which frame to ingest.  Seam: fuse the agreeing frames' scores here instead of picking one.\"\"\"\n        return self._best\n\n    # ------------------------------------------------------------------ hints\n    def _stuck(self, t) -> bool:\n        return self._since is not None and (t - self._since) >= self.hint_after\n\n    def _unstable_hint(self, r, t) -> str:\n        if not self._stuck(t):\n            return \"Reading...\"\n        q = r.quality or {}\n        if r.student_id is None or r.id_guessed:\n            return \"Student ID not readable - hold still, check the ID marks\"\n        if r.subject is None or r.subject_guessed:\n            return \"Subject code not readable - hold still, check the subject marks\"\n        if q.get(\"source_px_per_mm\", 99) < LOW_RES_PX_PER_MM:\n            return \"Move closer\"\n        if q.get(\"sharpness\", 1e9) < LOW_SHARPNESS:\n            return \"Hold still (blurry)\"\n        return \"Hold still - reading keeps changing (glare or shadow?)\"\n\n    def _bad_hint(self, r, t) -> str:\n        s = r.status\n        if s == \"unknown_form\":\n            return \"Unknown sheet (not created in this system)\"\n        if not self._stuck(t):\n            return \"Reading...\"\n        if s == \"bad_geometry\":\n            return \"Flatten the sheet and keep it square to the camera\"\n        if s == \"bad_meta\":\n            return \"Cannot read the header - move closer or reduce glare\"\n        if s == \"inconsistent\":\n            return \"Several sheets visible - show one sheet\"\n        return \"Hold still\"\n\n    def _absent_hint(self, r) -> str:\n        if r.status == \"partial\":\n            c = \",\".join(r.missing_corners)\n            return f\"Marker covered or out of frame ({c})\" if c else \"Marker covered or out of frame\"\n        return \"\"\n\n    # ------------------------------------------------------------------ overlay\n    def overlay(self, r) -> dict:\n        ov: Dict[str, Any] = {\"markers\": [[[round(x), round(y)] for x, y in q] for q in r.marker_corners.values()]}\n        if r.homography is not None:\n            try:\n                ov[\"sheet\"] = [[round(float(x)), round(float(y))] for x, y in\n                               r.image_points([[0, 0], [210, 0], [210, 297], [0, 297]])]\n            except Exception:\n                pass\n        if r.status == \"ok\" and r.homography is not None and r.bubble_centers_mm:\n            ov[\"bubbles\"], ov[\"bubble_r\"] = self._bubbles(r)\n        return ov\n\n    def _bubbles(self, r):\n        pts: List[Tuple[float, float]] = []\n        codes: List[int] = []\n        for a, row in zip(r.answers, r.bubble_centers_mm[\"answers\"]):\n            for k, p in enumerate(row):\n                pts.append(p)\n                if k in a.marked:\n                    codes.append(B_MULTI if a.state == \"multi\" else B_AMBIGUOUS if a.ambiguous else B_MARKED)\n                else:\n                    codes.append(B_AMBIGUOUS if a.ambiguous and (a.guess == k or (a.scores and a.scores[k] > 0.1)) else B_EMPTY)\n        for digits, rows in ((r.id_digits, r.bubble_centers_mm[\"id\"]),\n                             (r.subject_digits, r.bubble_centers_mm.get(\"subject\") or [])):\n            for d, row in zip(digits, rows):\n                for k, p in enumerate(row):\n                    pts.append(p)\n                    if d.value == k:\n                        codes.append(B_AMBIGUOUS if d.guessed else B_MARKED)\n                    elif d.ambiguous and d.scores and d.scores[k] > 0.1:\n                        codes.append(B_AMBIGUOUS)\n                    else:\n                        codes.append(B_EMPTY)\n        img = r.image_points(pts)\n        dia = DEFAULT_BUBBLE_MM\n        if r.page is not None:\n            try:\n                if r.form_id is not None:                                # legacy sheet: layout from the resolver\n                    lay = self.resolve_layout(r.form_id)\n                else:                                                    # self-describing: from the form_key\n                    from .layout import header_from_form_key\n                    from .recognize import layout_for_header\n                    lay = layout_for_header(header_from_form_key(r.form_key))\n                dia = lay.pages[r.page].bubble_diameter\n            except Exception:\n                pass\n        rad = max(1.5, 0.5 * dia * float((r.quality or {}).get(\"source_px_per_mm\", 3.0)))\n        return [[round(float(x)), round(float(y)), c] for (x, y), c in zip(img, codes)], round(rad, 1)\n", "omr_web.py": "\"\"\"Browser glue for the standalone scanner (runs inside Pyodide, next to the unmodified ``omr`` package).\n\n``Scanner.step`` mirrors ``_frame_step`` in app/main.py for the \"all subjects (auto)\" path of /ws/scan:\nrecognize(frame) -> StreamSession.feed(...) -> event.  What differs: no database (a commit is only\nsummarised, the caller keeps the results in memory), no JPEG round trip (the browser hands over raw RGBA),\nand no legacy-form lookup (resolve_layout=None: sheets describe themselves in their header).\nKeep it in sync with app/main.py::_frame_step when that changes.\n\"\"\"\nimport base64\nimport json\nimport time\n\nimport cv2\nimport numpy as np\n\nfrom omr import recognize as R\nfrom omr.recognize import recognize\nfrom omr.stream import StreamSession\nfrom omr.identity import severity\n\nMIN_FRAME_SIDE = 64      # same as app/main.py\nDEV = False  # __DEV__: scripts/build_standalone.py --dev sets this True (extra per-frame diagnostics for standalone/dev.js)\n\n\ndef _clean(o):\n    if isinstance(o, dict):\n        return {k: _clean(v) for k, v in o.items() if not (isinstance(k, str) and k.endswith(\"_path\"))}\n    if isinstance(o, (list, tuple)):\n        return [_clean(v) for v in o]\n    if isinstance(o, np.generic):\n        return o.item()\n    return o\n\n\ndef _plain(d) -> dict:\n    \"\"\"Numbers / strings / bools of a dict (quality, calibration) rounded for the dev log.\"\"\"\n    return {k: (round(v, 4) if isinstance(v, float) else v) for k, v in (d or {}).items() if isinstance(v, (int, float, str, bool))}\n\n\ndef _r(v, n=3):\n    return None if v is None or (isinstance(v, float) and v != v) else round(float(v), n)\n\n\ndef _row_trace(f, st, md, cal, strict, labels, frame_f, trust):\n    \"\"\"Every intermediate value behind one question / ID digit / subject digit: per choice the fill (= the share of the\n    bubble that is inked, the \"marking %\"), strength, disc darkness and its excess over the other choices, the in / out / grey\n    class of the absolute rule, the spread of the fill over the fused frames; then the absolute rule's verdict, the relative\n    rule's, the thresholds and a plain-text reason.\"\"\"\n    fmax = float(f.max())\n    t_in = cal.t_hi + (R.DIGIT_MARGIN * np.clip((st - R.DIGIT_MARGIN_FROM) / (R.DIGIT_MARGIN_FULL - R.DIGIT_MARGIN_FROM), 0.0, 1.0) if strict else 0.0)\n    rel_out = 0.25 if strict else 0.35\n    ratio = f / fmax if fmax > 0 else np.zeros_like(f)\n    is_in = (f >= t_in) & (ratio >= 0.7) & (st >= cal.min_strength)\n    is_out = (f < cal.t_lo) | (ratio < rel_out)\n    s_abs, m_abs, c_abs, a_abs, confident = R._decide_abs(f, st, cal, strict)\n    rel, ex = R._relative_marks(md, strict)\n    excess = None\n    if md is not None and md.size >= 3 and not np.isnan(md).any():\n        excess = [md[i] - np.median(np.delete(md, i)) for i in range(md.size)]\n    ff = np.stack(frame_f) if frame_f else f[None]\n    ch = [{\"label\": labels[i] if labels else str(i), \"fill_pct\": round(float(f[i]) * 100, 1), \"strength\": _r(st[i]), \"disc_dark\": _r(None if md is None else md[i]),\n           \"excess_vs_others\": _r(None if excess is None else excess[i]), \"ratio_to_max\": _r(ratio[i]), \"t_in\": _r(t_in[i] if strict else t_in),\n           \"abs_class\": \"in\" if is_in[i] else \"out\" if is_out[i] else \"grey\",\n           \"fill_pct_min\": round(float(ff[:, i].min()) * 100, 1), \"fill_pct_max\": round(float(ff[:, i].max()) * 100, 1), \"fill_pct_std\": round(float(ff[:, i].std()) * 100, 1)}\n          for i in range(len(f))]\n    why = []\n    if not (f >= t_in).any():\n        why.append(f\"no choice reaches t_in ({_r(float(np.min(t_in)))}); fullest fill {_r(fmax)} \" +\n                   (\"< t_lo -> blank\" if fmax < cal.t_lo else \">= (t_lo+t_hi)/2 -> weak single guess, flagged\" if fmax >= 0.5 * (cal.t_lo + cal.t_hi) else \"-> blank (but unsure)\"))\n    else:\n        for i, c in enumerate(ch):\n            if c[\"abs_class\"] == \"grey\":\n                why.append(f\"{c['label']}: grey zone (fill {c['fill_pct']}%, ratio {c['ratio_to_max']}, strength {c['strength']}) -> doubt\")\n        if int(is_in.sum()) >= 2:\n            why.append(\"two or more choices count as marked -> multi\")\n    if not confident and rel:\n        why.append(f\"relative rule: {[ch[i]['label'] for i in rel]} darker than the other choices by {[_r(x) for x in ex]} (needs >= {R.REL_MARGIN}; silent from {R.REL_SURE_DIGIT if strict else R.REL_SURE}); rule {'ON' if trust else 'OFF (region not trusted)'}\")\n    return {\"choices\": ch, \"abs\": {\"state\": s_abs, \"marked\": [int(i) for i in m_abs], \"confidence_pct\": round(float(c_abs) * 100), \"ambiguous\": bool(a_abs), \"confident\": bool(confident)},\n            \"rel\": {\"indices\": rel, \"excess\": [_r(x) for x in ex], \"trusted\": bool(trust)}, \"fmax_pct\": round(fmax * 100, 1), \"why\": why}\n\n\ndef explain(result) -> dict:\n    \"\"\"Dev log: the decision trace of a committed sheet (see _row_trace), from the fused measurements of its track.\"\"\"\n    src = getattr(result, \"trace_src\", None) or ((result.raw, [result.raw]) if result.raw is not None else None)\n    if src is None:\n        return {}\n    raw, frames = src\n    cal = R._calibrate(raw.FA, raw.ink, min_strength=raw.min_strength)\n    trust, page_trust = R._rel_trust_answers(raw, cal)\n    FD = raw.FI if raw.FS is None else np.concatenate([raw.FI, raw.FS])\n    ical = R._calibrate(FD, raw.ink, default_typ=cal.typ, min_strength=raw.min_strength)\n    SD = raw.SI if raw.SS is None else np.concatenate([raw.SI, raw.SS])\n    MD = None if raw.MI is None else (raw.MI if raw.MS is None else np.concatenate([raw.MI, raw.MS]))\n    dtrust = page_trust or R._rel_trust_digits(FD, SD, MD, ical)\n    out = {\"page\": {\"frames_fused\": len(frames), \"ink\": _r(raw.ink), \"ink_source\": raw.ink_source, \"ink_separation\": _r(raw.ink_separation), \"min_strength\": _r(raw.min_strength),\n                    \"typ_fill\": _r(cal.typ), \"t_lo\": _r(cal.t_lo), \"t_hi\": _r(cal.t_hi), \"id_typ_fill\": _r(ical.typ), \"id_t_lo\": _r(ical.t_lo), \"id_t_hi\": _r(ical.t_hi),\n                    \"alignment_verified\": bool(raw.verified), \"relative_rule_page_trust\": bool(page_trust), \"relative_rule_digit_trust\": bool(dtrust),\n                    \"consts\": {\"REL_MARGIN\": R.REL_MARGIN, \"REL_SURE\": R.REL_SURE, \"REL_SURE_DIGIT\": R.REL_SURE_DIGIT, \"GUESS_GAP\": R.GUESS_GAP, \"DIGIT_MARGIN\": R.DIGIT_MARGIN,\n                               \"T_HI_OF_TYP\": R.T_HI_OF_TYP, \"T_LO_FRAC\": R.T_LO_FRAC}},\n           \"answers\": [], \"id\": [], \"subject\": []}\n    for i, a in enumerate(result.answers):\n        if i >= len(raw.FA):\n            break\n        t = _row_trace(raw.FA[i], raw.SA[i], None if raw.MA is None else raw.MA[i], cal, False, list(a.labels), [x.FA[i] for x in frames], trust[i])\n        t.update(q=a.number, final={\"state\": a.state, \"marked\": list(a.marked), \"confidence_pct\": round(a.confidence * 100), \"ambiguous\": bool(a.ambiguous), \"guessed\": bool(a.guessed), \"guess\": a.guess})\n        out[\"answers\"].append(t)\n    for key, digits, F, S_, M_, fr_key in ((\"id\", result.id_digits, raw.FI, raw.SI, raw.MI, \"FI\"), (\"subject\", result.subject_digits, raw.FS, raw.SS, raw.MS, \"FS\")):\n        if F is None:\n            continue\n        for i, d in enumerate(digits):\n            if i >= len(F):\n                break\n            t = _row_trace(F[i], S_[i], None if M_ is None else M_[i], ical, True, None, [getattr(x, fr_key)[i] for x in frames], dtrust)\n            t.update(digit=i + 1, final={\"state\": d.state, \"value\": d.value, \"confidence_pct\": round(d.confidence * 100), \"ambiguous\": bool(d.ambiguous), \"guessed\": bool(d.guessed)})\n            out[key].append(t)\n    return out\n\n\ndef _beacon(summary) -> None:\n    \"\"\"Tell the page about a commit the moment it is decided: the main thread beeps / flashes at once, before the rest of the event\n    (detail sheet JPEG ~20 ms native, dev trace ~60 ms) is built, serialised and posted.  No-op outside Pyodide (native tests).\"\"\"\n    try:\n        import js\n        from pyodide.ffi import to_js\n        js.postMessage(to_js({\"type\": \"beacon\", \"severity\": summary.get(\"severity\") or \"ok\"}, dict_converter=js.Object.fromEntries))\n    except Exception:\n        pass\n\n\ndef summarize(result) -> dict:\n    \"\"\"Same fields as app/main.py::summarize, plus the marked labels per question (for display / CSV).\"\"\"\n    return {\"form_key\": result.form_key, \"page\": result.page, \"total_pages\": result.total_pages,\n            \"student_id\": result.student_id, \"subject\": result.subject, \"serial\": result.serial,\n            \"n_questions\": len(result.answers),\n            \"n_blank\": sum(1 for a in result.answers if a.state == \"blank\"),\n            \"n_multi\": sum(1 for a in result.answers if a.state == \"multi\"),\n            \"n_doubtful\": sum(1 for a in result.answers if a.ambiguous),\n            \"flags\": list(result.flags), \"needs_review\": result.needs_review,\n            \"sharpness\": (result.quality or {}).get(\"sharpness\"), \"severity\": severity(result),\n            \"answers\": [{\"q\": a.number, \"state\": a.state, \"marked\": \"|\".join(a.labels[i] for i in a.marked),\n                         \"doubt\": bool(a.ambiguous)} for a in result.answers]}\n\n\ndef _digit_rows(digits, centers):\n    return [{\"state\": d.state, \"value\": d.value, \"doubt\": bool(d.ambiguous), \"guessed\": bool(getattr(d, \"guessed\", False)), \"scores\": d.scores,\n             \"centers\": centers[i]} for i, d in enumerate(digits) if i < len(centers)]\n\n\ndef detail(result) -> dict:\n    \"\"\"What the review view needs to show *where* a sheet is doubtful: the canonical (rectified) sheet as a JPEG\n    plus, per question / ID digit / subject digit, the bubble centres (mm), fill scores and the decision.\"\"\"\n    if result.warped is None:\n        return {}\n    ok, jpg = cv2.imencode(\".jpg\", result.warped, [cv2.IMWRITE_JPEG_QUALITY, 75])\n    if not ok:\n        return {}\n    bc, cal = result.bubble_centers_mm or {}, result.calibration or {}\n    ans = bc.get(\"answers\", [])\n    return {\"img\": base64.b64encode(jpg.tobytes()).decode(\"ascii\"), \"ppm\": result.px_per_mm,\n            \"t_lo\": cal.get(\"t_lo\"), \"t_hi\": cal.get(\"t_hi\"), \"id_t_lo\": cal.get(\"id_t_lo\"), \"id_t_hi\": cal.get(\"id_t_hi\"),\n            \"answers\": [{\"q\": a.number, \"state\": a.state, \"marked\": list(a.marked), \"labels\": list(a.labels),\n                         \"scores\": a.scores, \"doubt\": bool(a.ambiguous), \"guessed\": bool(getattr(a, \"guessed\", False)), \"centers\": ans[i]}\n                        for i, a in enumerate(result.answers) if i < len(ans)],\n            \"id\": _digit_rows(result.id_digits, bc.get(\"id\", [])),\n            \"subject\": _digit_rows(result.subject_digits, bc.get(\"subject\", []))}\n\n\nclass Scanner:\n    def __init__(self):\n        self.session = StreamSession(resolve_layout=None)\n        self._rgba = self._gray = None\n        self._convert_ms = 0.0\n\n    def reset(self):\n        self.session.reset()\n        self.session.reset_tracking()\n\n    def step_rgba(self, buf, w: int, h: int) -> str:\n        \"\"\"buf: RGBA bytes (memoryview / JsProxy Uint8Array) of a w x h frame.  Returns the event as JSON.\n        The recognizer only reads the grey image (omr.recognize converts BGR->GRAY first thing), so RGBA goes straight to\n        GRAY (bit-identical to RGBA->BGR->GRAY) into reused buffers: one 8 MB copy in, no BGR image, no per-frame allocation.\"\"\"\n        t0 = time.perf_counter()\n        if self._rgba is None or self._rgba.shape[:2] != (h, w):\n            self._rgba = np.empty((h, w, 4), np.uint8)\n            self._gray = np.empty((h, w), np.uint8)\n        try:\n            buf.assign_to(self._rgba)        # JsProxy (Uint8Array): memcpy straight into the numpy buffer\n        except AttributeError:               # plain bytes / memoryview (native tests)\n            self._rgba[...] = np.frombuffer(buf, np.uint8).reshape(h, w, 4)\n        except Exception:                    # any Pyodide-side surprise: fall back to the old copy path\n            self._rgba[...] = np.frombuffer(buf.to_py(), np.uint8).reshape(h, w, 4)\n        cv2.cvtColor(self._rgba, cv2.COLOR_RGBA2GRAY, dst=self._gray)\n        self._convert_ms = (time.perf_counter() - t0) * 1000\n        return json.dumps(self.step(self._gray, t0))\n\n    def step(self, img, t0=None) -> dict:\n        session = self.session\n        t0 = time.perf_counter() if t0 is None else t0\n        if min(img.shape[:2]) < MIN_FRAME_SIDE:\n            w, h = int(img.shape[1]), int(img.shape[0])\n            return {\"state\": session.state, \"hint\": f\"Camera frame too small ({w}x{h})\", \"overlay\": {},\n                    \"error\": f\"frame too small: {w}x{h}\", \"w\": w, \"h\": h}\n        res = recognize(img, None)\n        t_feed = time.perf_counter()\n        ev = session.feed(res, time.monotonic(), payload=None)\n        t_feed = (time.perf_counter() - t_feed) * 1000\n        ev[\"status\"] = res.status\n        ev[\"w\"], ev[\"h\"] = int(img.shape[1]), int(img.shape[0])\n        for name in (\"commit\", \"revision\"):      # a revision = a better reading of the sheet committed before (omr/revision.py)\n            c = ev.pop(name, None)\n            if c is None:\n                continue\n            summ = summarize(c[\"result\"])\n            if name == \"commit\":\n                _beacon(summ)        # the beep must not wait for the detail JPEG / the dev trace below\n            ev[name] = {\"summary\": summ, \"frames\": c[\"frames\"], \"detail\": detail(c[\"result\"])}\n            if name == \"revision\":\n                ev[name].update(changed=c[\"changed\"], contradiction=c[\"contradiction\"], prev_severity=c[\"prev_severity\"], n=c[\"revision\"])\n            if DEV:\n                cr = c[\"result\"]\n                ev[name][\"dev\"] = {\"quality\": _plain(cr.quality), \"calibration\": _plain(cr.calibration), \"fused_frames\": cr.fused_frames,\n                                   \"frame_index\": c.get(\"frame_index\"), \"marker_ids\": list(cr.marker_ids), \"missing_corners\": list(cr.missing_corners),\n                                   \"trace\": explain(cr)}\n        if DEV:\n            ev[\"dev\"] = {\"quality\": _plain(res.quality), \"flags\": list(res.flags), \"markers\": list(res.marker_ids),\n                         \"missing\": list(res.missing_corners), \"form_key\": res.form_key, \"page\": res.page,\n                         \"timing\": {k: round(v, 1) for k, v in (res.timing_ms or {}).items()}}\n        missed = session.missed()\n        if missed:\n            ev[\"missed\"] = missed\n        ev[\"ms\"] = {\"total\": round((time.perf_counter() - t0) * 1000, 1),\n                    \"recognize\": round(res.timing_ms.get(\"total\", 0), 1)}\n        if DEV:\n            ev[\"ms\"].update(convert=round(self._convert_ms, 2), feed=round(t_feed, 1))\n        self._convert_ms = 0.0\n        return _clean(ev)\n\n\n_scanner = None\n\n\ndef init():\n    global _scanner\n    _scanner = Scanner()\n\n\ndef reset():\n    _scanner.reset()\n\n\ndef frame(buf, w, h):\n    return _scanner.step_rgba(buf, w, h)\n"}</script>
<script>
'use strict';
const PYODIDE_BASE = 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/';
const DEV = false;   // true only in the dev build (scripts/build_standalone.py --dev): see standalone/dev.js
const $ = id => document.getElementById(id);
const video = $('video'), ov = $('ov'), stage = $('stage'), ctx = ov.getContext('2d');
const grab = document.createElement('canvas');
const gctx = grab.getContext('2d', { willReadFrequently: true });
const COLORS = ['rgba(150,150,150,.55)', '#2ecc71', '#ff5252', '#f5a524'];   // empty, marked, multi, ambiguous
const TARGET_FPS = 8;
let stream = null, track = null, audio = null, running = false, ready = false;
let busy = false, lastOv = null, lastState = 'idle', lastSend = 0, torchOn = false, frameId = 0;
let sentDims = '-', frames = 0, fpsT = performance.now(), fps = 0, rtt = 0;

let lastScan = null;   // the scan committed last (a revision event refers to it)
const scans = [];   // in-memory results of this page load

// ---- commit feedback: ok = short high beep + green; minor (answer rows to check) = two mid tones + amber;
// severe (student ID / subject code not reliably read) = three low buzzes + red, so the person can rescan at once
const FB_MS = { ok: 350, minor: 2500, severe: 4000 };
let fbTimer = null;
function tone(freq, at, dur, type, vol) {
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + at;
  o.type = type; o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
// kind 'resolved': a committed doubtful sheet became confident on later frames (soft rising chime, green border);
// kind 'contradiction': later frames contradict a row that was confident at commit (warning tone, amber border)
function feedback(sev, kind) {
  sev = FB_MS[sev] ? sev : 'ok';
  if (kind === 'resolved') sev = 'ok'; else if (kind === 'contradiction' && sev === 'ok') sev = 'minor';
  if (audio) {
    if (kind === 'resolved') { tone(784, 0, 0.12, 'sine', 0.1); tone(1175, 0.12, 0.22, 'sine', 0.1); }
    else if (kind === 'contradiction') { tone(466, 0, 0.12, 'square', 0.1); tone(466, 0.2, 0.12, 'square', 0.1); }
    else if (sev === 'ok') tone(1040, 0, 0.18, 'sine', 0.2);
    else if (sev === 'minor') { tone(740, 0, 0.13, 'triangle', 0.28); tone(587, 0.16, 0.16, 'triangle', 0.28); }
    else for (let k = 0; k < 3; k++) tone(294, k * 0.22, 0.16, 'square', 0.12);
  }
  stage.classList.remove('fb-ok', 'fb-minor', 'fb-severe'); void stage.offsetWidth; stage.classList.add('fb-' + sev);
  clearTimeout(fbTimer); fbTimer = setTimeout(() => stage.classList.remove('fb-' + sev), FB_MS[sev]);
  if (navigator.vibrate) navigator.vibrate(kind === 'resolved' ? 30 : sev === 'ok' ? 60 : sev === 'minor' ? [80, 60, 80] : [200, 80, 200, 80, 200]);
}
const SEV_TEXT = { minor: '확인할 문항 있음', severe: '학번/과목 인식 실패' };
function fixButton(sev, open) {   // banner button after a non-ok commit: opens the detail with 정정 buttons
  if (sev === 'ok') return;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'fixbtn ' + sev;
  b.textContent = SEV_TEXT[sev] + ' · 정정'; b.onclick = open; $('res').appendChild(b);
}
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function subjLabel(subject) { return subject === null || subject === undefined ? '과목? 미확인' : subject === '' ? '' : '과목 ' + subject; }

// ---- results list
function addScan(s, detail) {
  scans.push(s);
  s.li = document.createElement('li');
  renderScan(s, detail);
  $('recent').prepend(s.li);
  $('count').textContent = scans.length + '건'; $('csv').disabled = false;
}
function renderScan(s, detail) {
  const ans = s.answers.map(a => a.marked || '-').join(' ');
  const li = s.li, sev = s.severity || 'ok';
  li.style.flexDirection = 'column';
  li.style.borderLeft = sev === 'ok' ? '' : `4px solid var(--${sev === 'severe' ? 'bad' : 'warn'})`;
  const fixed = s.fixed && s.fixed.length ? ` <span class="tag">정정 ${esc(s.fixed.join(','))}<\/span>` : '';
  const flags = s.flags.length ? ` <span class="tag warn">${esc(s.flags.join(','))}<\/span>` : '';
  li.innerHTML = `<span><b>${esc(subjLabel(s.subject))}<\/b> ${s.subject === '' ? '' : '&middot;'} <b>${esc(s.student_id ?? '(번호 없음)')}<\/b> &middot; ${s.page + 1}${s.total_pages ? '/' + s.total_pages : ''}페이지` +
    (s.needs_review ? ' <span class="badge needs_review">확인 필요<\/span>' : '') + flags + `<\/span>` +
    `<span class="mut small" style="word-break:break-all">${esc(ans)}<\/span>`;
  if (fixed) li.firstChild.insertAdjacentHTML('beforeend', fixed);
  if (detail && detail.img) { li.onclick = () => showDetail(s, detail); li.title = '탭하면 인식 상세'; li.innerHTML += '<span class="mut small">탭하여 인식 상세 보기 &rsaquo;<\/span>'; }
}
// a person's correction from the detail view: update this result in memory (list, CSV) right away
const ID_FLAGS = { id: ['id_unreadable', 'id_guessed', 'id_blank'], subject: ['subject_unreadable', 'subject_guessed', 'subject_blank'] };
function recount(s, d) {   // counts + severity of a result after a human fix / a revision
  s.n_doubtful = s.answers.filter(a => a.doubt).length;
  s.n_multi = s.answers.filter(a => a.state === 'multi').length;
  s.n_blank = s.answers.filter(a => a.state === 'blank').length;
  const idBad = s.flags.some(f => ID_FLAGS.id.includes(f) || ID_FLAGS.subject.includes(f)) || (d.id && d.id.length && !s.student_id);
  s.severity = idBad ? 'severe' : (s.n_doubtful || s.n_multi) ? 'minor' : 'ok';
  s.needs_review = s.severity !== 'ok';
}
function applyFix(s, d, fix) {
  s.fixed = s.fixed || [];
  if (fix.kind === 'q') {
    const a = s.answers.find(x => x.q === fix.q), row = d.answers.find(x => x.q === fix.q);

    if (!s.fixed.includes(String(fix.q))) s.fixed.push(String(fix.q));
  } else {
    const rows = d[fix.kind], vals = rows.map((r, i) => i === fix.index ? fix.choice : (r.state === 'blank' ? null : r.value));
    const label = fix.kind === 'id' ? '학번' : '과목';
    if (!s.fixed.includes(label)) s.fixed.push(label);
    if (vals.every(v => v !== null && v !== undefined)) {
      s[fix.kind === 'id' ? 'student_id' : 'subject'] = vals.join('');
      s.flags = s.flags.filter(f => !ID_FLAGS[fix.kind].includes(f));
    }
  }
  recount(s, d);
  renderScan(s, d);
  if (scans[scans.length - 1] === s) $('res').textContent = `${subjLabel(s.subject)} · ${s.student_id ?? '(번호 없음)'}` + (s.severity === 'ok' ? ' · 정정 완료' : '');
  return {};
}
const csvCell = v => { const s = v === null || v === undefined ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
$('csv').onclick = () => {
  const nq = Math.max(0, ...scans.flatMap(s => s.answers.map(a => a.q)));
  const head = ['time', 'subject', 'student_id', 'page', 'total_pages', 'serial', 'form_key', 'n_questions', 'n_blank', 'n_multi', 'n_doubtful', 'needs_review', 'flags'];
  for (let q = 1; q <= nq; q++) head.push('q' + q);
  const rows = [head].concat(scans.map(s => {
    const byQ = {}; s.answers.forEach(a => { byQ[a.q] = a.marked; });
    const r = [s.time, s.subject, s.student_id, s.page + 1, s.total_pages, s.serial, s.form_key, s.n_questions, s.n_blank, s.n_multi, s.n_doubtful, s.needs_review, s.flags.concat(s.fixed && s.fixed.length ? ['fixed:' + s.fixed.join(',')] : [], s.revised && s.revised.length ? ['revised:' + s.revised.join(',')] : []).join(';')];
    for (let q = 1; q <= nq; q++) r.push(byQ[q] ?? '');
    return r;
  }));
  const blob = new Blob(['﻿' + rows.map(r => r.map(csvCell).join(',')).join('\n') + '\n'], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'streamomr_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
$('reset').onclick = () => { if (worker) worker.postMessage({ type: 'reset' }); };

/* OMR-DETAIL-SHARED BEGIN  (identical text lives in standalone/app.js; tests/test_review_api.py keeps them in sync)
 * Scan detail view shared by the server UI and the standalone page: the whole rectified sheet with a coloured ring
 * per bubble (green read / red multi / orange doubtful-or-blank), boxes around problem rows, a problem list with
 * per-choice darkness, and - on tap of a problem row or one of its choices - a zoomed crop of that row from the
 * full-resolution sheet (cropped client-side from the same image, so it is as crisp as the stored sheet).
 * With o.onFix(fix) given, every problem row also gets 정정 buttons: the person picks the right choice / digit and
 * onFix({kind:'q'|'id'|'subject', index, q, choice}) (choice null = blank) applies it; the row turns green (수정됨).
 * d = {ppm, page_w?, t_lo, t_hi, id_t_lo, id_t_hi, answers:[{q,state,marked,labels,scores,doubt,guessed?,centers}],
 *      id:[{state,value,doubt,guessed?,scores,centers}], subject:[...]}  (centers: mm on the sheet, per choice)  */
const OmrDetail = (() => {
  const COL = { on: '#2ecc71', bad: '#ff5252', doubt: '#f5a524', off: 'rgba(120,120,120,.7)', fixed: '#2ecc71' };
  const CSS = `
.od-modal { position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:50; overflow:auto; padding:10px; -webkit-overflow-scrolling:touch; }
.od-modal[hidden] { display:none; }
.od-box { background:var(--card,#1c2128); color:var(--fg,#e8eaed); border-radius:10px; padding:12px; max-width:720px; margin:0 auto; }
.od-box h2 { margin:0; font-size:17px; }
.od-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.od-sheet { width:100%; display:block; border-radius:4px; background:#fff; margin:6px 0; cursor:pointer; }
.od-row { border:1px solid #2a313b; border-radius:8px; padding:8px; margin:8px 0; }
.od-row.bad { border-color:var(--bad,#ff5252); } .od-row.doubt { border-color:var(--warn,#f5a524); }
.od-row.fixed { border-color:#2ecc71; }
.od-fix { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; padding-top:8px; border-top:1px dashed #2a313b; }
.od-fix b { font-size:13px; margin-right:2px; }
.od-fix button { min-width:44px; min-height:40px; font:inherit; font-size:15px; font-weight:700; border-radius:8px; border:1px solid #3a4250; background:#11151a; color:inherit; cursor:pointer; }
.od-fix button.cur { background:#2ecc71; color:#000; }
.od-fix button:disabled { opacity:.5; }
.od-row.flash { outline:2px solid #4dabf7; }
.od-top { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; cursor:pointer; min-height:32px; }
.od-tag { font-size:12px; padding:0 7px; border-radius:5px; background:#4dabf7; color:#000; font-weight:700; }
.od-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.od-chip { padding:6px 12px; min-height:36px; border-radius:8px; background:#2a313b; color:inherit; border:2px solid transparent; font:inherit; font-size:14px; cursor:pointer; }
.od-chip.on { background:#2ecc71; color:#000; } .od-chip.bad { background:#ff5252; color:#000; font-weight:700; } .od-chip.doubt { background:#f5a524; color:#000; font-weight:700; }
.od-chip.sel { border-color:#fff; box-shadow:0 0 0 2px #4dabf7; }
.od-zoom { margin-top:8px; }
.od-zoom canvas { display:block; width:100%; max-height:62vh; object-fit:contain; background:#fff; border-radius:6px; }
.od-zoom .od-tools { display:flex; gap:10px; align-items:center; margin-top:4px; font-size:13px; color:var(--mut,#9aa0a6); }
.od-zoom button { font:inherit; font-size:13px; padding:4px 10px; border-radius:6px; border:1px solid #3a4250; background:#2a313b; color:inherit; cursor:pointer; }
.od-mut { color:var(--mut,#9aa0a6); font-size:13px; }
.od-err { color:var(--bad,#ff5252); }
`;
  const cl = n => '①②③④⑤⑥⑦⑧⑨'[n] || String(n + 1);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // per-choice verdict: on = counted as marked, bad = counted wrongly (multi), doubt = grey zone / doubtful, off = empty
  function verdicts(r, lo, hi, kind) {
    const marked = kind === 'q' ? r.marked : (r.state === 'blank' ? [] : r.scores.map((v, i) => i).filter(i => r.scores[i] === Math.max(...r.scores) && r.scores[i] >= lo));
    if (r.fixed) return r.scores.map((v, i) => (kind === 'q' ? r.marked.includes(i) : r.value === i) ? 'on' : 'off');
    return r.scores.map((v, i) => {
      const isMarked = marked.includes(i);
      if (r.state === 'multi' && isMarked) return 'bad';
      if (isMarked) return r.doubt || v < hi ? 'doubt' : 'on';
      return v >= lo && v < hi && r.state !== 'blank' ? 'doubt' : (v >= lo && r.doubt ? 'doubt' : 'off');

  function rowStatus(r) {
    if (r.fixed) return ['fixed', '수정됨'];
    if (r.state === 'multi') return ['bad', '복수 마킹'];
    if (r.state === 'blank' && r.doubt) return ['doubt', '애매 (옅은 마킹?)'];
    if (r.state === 'blank') return ['doubt', '공란'];
    if (r.doubt) return ['doubt', '애매'];
    return ['', '정상'];
  }
  function bubbleR(r) {
    const gaps = r.centers.slice(1).map((c, i) => Math.hypot(c[0] - r.centers[i][0], c[1] - r.centers[i][1]));
    return Math.min(...gaps, 8) * 0.38;
