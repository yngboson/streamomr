darray] = None,\n            trust_rel: bool = True):\n    \"\"\"Absolute rules (`_decide_abs`), plus the relative rule (REL_MARGIN) for rows the absolute rules cannot call\n    with confidence: a faint pencil mark under glare is only ~20 % darker than the paper but clearly darker than its\n    neighbours.  The relative rule only ADDS reads to rows that would otherwise be blank / flagged guesses; a row with\n    a confident absolute mark is never changed (erasure ghosts and strays beside a real mark stay out).\"\"\"\n    state, marked, conf, amb, confident = _decide_abs(f, strength, c, strict)\n    if md is None or not trust_rel:\n        return state, marked, conf, amb\n    if confident:\n        # faint-pencil page: every real mark is evenly dark (md > 0).  A bubble the absolute rules read as marked but that is\n        # dark on a part of its disc only (md == 0: a half-filled bubble whose fill the low page ink overstates) is flagged.\n        if marked and not amb and any(md[i] == 0.0 for i in marked):\n            return state, marked, conf, True\n        return state, marked, conf, amb\n    rel, ex = _relative_marks(md, strict)\n    if not rel:\n        return state, marked, conf, amb\n    sure = ex.min() >= (REL_SURE_DIGIT if strict else REL_SURE)\n    if not (set(marked) <= set(rel)):        # the absolute guess is a different bubble: leave the row to the flag\n        return state, marked, conf, amb\n    rconf = float(np.clip(0.5 + (ex.min() - REL_MARGIN) / 0.3, 0.0, 0.8))\n    return (\"multi\" if len(rel) >= 2 else \"single\"), rel, rconf, not sure\n\n\ndef _decide_abs(f: np.ndarray, strength: np.ndarray, c: _Calib, strict: bool = False):\n    \"\"\"One question (or ID column) from its bubbles' fills.  Returns (state, marked, confidence, ambiguous).\n\n    in   : fill >= t_hi, at least 70% of the fullest bubble in the question, and inked strongly enough\n    out  : fill < t_lo, or under 35% (strict: 25%) of the fullest bubble\n    grey : anything else -> ambiguous, flagged for a human\n\n    Strict (digit) reading also needs a margin above t_hi.  A half-filled bubble measures up to t_hi + 0.07 (277\n    synthetic ones under blur, glare, pale print), because the fill ramp is relative to the *page's* ink level: the\n    darker the mark is than that level (strength > 1) the further its blurred edge counts as ink and the more a\n    partial mark is overstated.  A wrong student ID is the worst outcome, so the margin grows with strength\n    (DIGIT_MARGIN from DIGIT_MARGIN_FROM to DIGIT_MARGIN_FULL).  A faint, honestly partial mark is not overstated, so it\n    keeps the plain t_hi - which keeps the cost in honest digit reads small (a flat margin would not read 0.75 % of marks).\n    \"\"\"\n    fmax = float(f.max())\n    rel_out = 0.25 if strict else 0.35\n    t_in = c.t_hi + (DIGIT_MARGIN * np.clip((strength - DIGIT_MARGIN_FROM) / (DIGIT_MARGIN_FULL - DIGIT_MARGIN_FROM), 0.0, 1.0)\n                     if strict else 0.0)             # per bubble\n    if not (f >= t_in).any():\n        if fmax < c.t_lo:\n            return \"blank\", [], float(min(1.0, 0.5 + 0.5 * (c.t_lo - fmax) / c.t_lo)), False, False\n        guess = [int(np.argmax(f))] if fmax >= 0.5 * (c.t_lo + c.t_hi) else []  # best guess, always flagged\n        return (\"single\" if guess else \"blank\"), guess, 0.2, True, False\n    r = f / fmax\n    is_in = (f >= t_in) & (r >= 0.7) & (strength >= c.min_strength)\n    is_out = (f < c.t_lo) | (r < rel_out)\n    grey = ~is_in & ~is_out\n    marked = [int(i) for i in np.nonzero(is_in)[0]]\n    if not marked:  # filled but weak (smudge / ghost): best guess, always flagged\n        return \"single\", [int(np.argmax(f))], 0.2, True, False\n    # confidence: how far the weakest \"in\" bubble is above the threshold, and how small the strongest\n    # competing bubble is relative to the fullest one\n    conf_in = float(np.clip(0.5 + (f[is_in] - (t_in[is_in] if strict else c.t_hi)).min() / 0.3, 0.0, 1.0))\n    rest = f[~is_in]\n    conf_out = float(np.clip(1.0 - (rest.max() / fmax) / 0.5, 0.0, 1.0)) if rest.size else 1.0\n    conf = min(conf_in, conf_out)\n    ambiguous = bool(grey.any())\n    state = \"multi\" if len(marked) >= 2 else \"single\"\n    return state, marked, conf, ambiguous, True\n\n\n@dataclass\nclass PageRaw:\n    \"\"\"Per-bubble raw measurements of one frame (what `decide_page` needs; fusion medians these over a track).\"\"\"\n    numbers: List[int]\n    labels: List[List[str]]\n    digit_index: List[int]\n    FA: np.ndarray            # questions x choices: fill\n    SA: np.ndarray            # strength\n    FI: np.ndarray            # id digits x 10\n    SI: np.ndarray\n    ink: float\n    min_strength: float\n    verified: bool = True     # bubble positions confirmed against the printed rings\n    FS: Optional[np.ndarray] = None   # subject-code digits x 10 (None: the form has no subject code)\n    SS: Optional[np.ndarray] = None\n    ink_source: str = \"default\"       # how the ink floor was chosen: \"auto\" (the sheet's own evidence) | \"default\" (0.45 x black)\n    ink_separation: float = 0.0       # marks vs. ghosts, x printed black (omr.ink)\n    MA: Optional[np.ndarray] = None   # disc darkness per bubble (answers / ID / subject): input of the relative rule\n    MI: Optional[np.ndarray] = None\n    MS: Optional[np.ndarray] = None\n\n\n@dataclass\nclass PageDecision:\n    answers: List[QuestionResult]\n    id_digits: List[DigitResult]\n    student_id: Optional[str]\n    flags: List[str]                  # id_blank / id_unreadable / subject_blank / subject_unreadable\n    calibration: Dict[str, object]\n    subject_digits: List[DigitResult]\n    subject: Optional[str]            # \"\" when the form has no subject code, None when not readable\n\n\ndef _read_digits(F, S_, cal, verified, M_=None, trust_rel=True):\n    \"\"\"Digit columns (ID, subject code): strict rules; a digit is read only when unambiguous.\"\"\"\n    digits = []\n    for di, (f, st) in enumerate(zip(F, S_)):\n        state, marked, conf, amb = _decide(f, st, cal, strict=True, md=None if M_ is None else M_[di],\n                                          trust_rel=trust_rel)\n        val = int(marked[0]) if (state == \"single\" and not amb and verified) else None\n        digits.append(DigitResult(di, state, val, round(conf, 3), amb, [round(float(x), 4) for x in f]))\n    if all(d.value is not None for d in digits):\n        return digits, \"\".join(str(d.value) for d in digits), None\n    return digits, None, (\"blank\" if all(d.state == \"blank\" and not d.ambiguous for d in digits) else \"unreadable\")\n\n\nREL_TRUST_ROWS = 0.4        # a page is a \"faint pencil page\" when this share of its questions has a relative-only mark ...\nREL_TRUST_GHOSTS = 0.02     # ... and (almost) no other-choice beside a confident mark is as dark (erasure ghost / stray evidence), per question\n\n\ndef _rel_page_trust(raw: PageRaw, cal: _Calib) -> bool:\n    \"\"\"Does the page itself say that relative-only marks are marks rather than erasure ghosts?  A faint graphite mark and\n    the ghost of an erased one look alike (both ~15-25 % darker than paper, evenly), so the relative rule applies\n    only on a page where (a) a large share of the questions has such a mark and nothing else explains them -\n    the whole sheet is written in faint pencil - and (b) the confidently marked questions show no ghosts beside their\n    marks.  On any other page the relative rule is OFF (measured: on ordinary sheets with erasures it turned ghosts into\n    flagged guesses / silent reads and cost ID read-rate).\"\"\"\n    if raw.MA is None or not len(raw.numbers):\n        return False\n    rel_rows = ghosts = 0\n    for f, st, md in zip(raw.FA, raw.SA, raw.MA):\n        state, marked, conf, amb, confident = _decide_abs(f, st, cal)\n        rel, _ = _relative_marks(md, False)\n        if confident:\n            ghosts += len([i for i in rel if i not in marked])\n        elif rel:\n            rel_rows += 1\n    n = len(raw.numbers)\n    return rel_rows >= REL_TRUST_ROWS * n and ghosts <= REL_TRUST_GHOSTS * n\n\n\ndef decide_page(raw: PageRaw) -> PageDecision:\n    \"\"\"The one place where bubble measurements become decisions.  Used per frame by `recognize` and on\n    track-fused measurements by `omr.fusion`.\"\"\"\n    cal = _calibrate(raw.FA, raw.ink, min_strength=raw.min_strength)\n    answers = []\n    trust = _rel_page_trust(raw, cal)\n    MA = raw.MA if raw.MA is not None else [None] * len(raw.numbers)\n    for n, lab, f, st, md in zip(raw.numbers, raw.labels, raw.FA, raw.SA, MA):\n        state, marked, conf, amb = _decide(f, st, cal, md=md, trust_rel=trust)\n        answers.append(QuestionResult(n, state, marked, list(lab), round(conf, 3), amb or not raw.verified,\n                                      [round(float(x), 4) for x in f]))\n    FD = raw.FI if raw.FS is None else np.concatenate([raw.FI, raw.FS])\n    ical = _calibrate(FD, raw.ink, default_typ=cal.typ, min_strength=raw.min_strength)\n    digits, student_id, why = _read_digits(raw.FI, raw.SI, ical, raw.verified, raw.MI, trust)\n    for d, di in zip(digits, raw.digit_index):\n        d.index = di\n    flags: List[str] = [] if why is None else [\"id_\" + why]\n    sdigits, subject = [], \"\"\n    if raw.FS is not None and len(raw.FS):\n        sdigits, subject, why = _read_digits(raw.FS, raw.SS, ical, raw.verified, raw.MS, trust)\n        if why is not None:\n            flags.append(\"subject_\" + why)\n    calib = {\"ink\": cal.ink, \"typ_fill\": cal.typ, \"t_lo\": cal.t_lo, \"t_hi\": cal.t_hi,\n             \"id_typ_fill\": ical.typ, \"id_t_lo\": ical.t_lo, \"id_t_hi\": ical.t_hi,\n             \"ink_auto\": float(raw.ink_source == \"auto\"), \"ink_source\": raw.ink_source, \"ink_separation\": raw.ink_separation}\n    return PageDecision(answers, digits, student_id, flags, calib, sdigits, subject)\n\n\n# =============================================================================== main\ndef recognize(image: np.ndarray, resolve_layout: Optional[Callable[[int], Optional[lay.Layout]]] = None,\n              px_per_mm: float = DEFAULT_PX_PER_MM, keep_images: bool = True) -> RecognitionResult:\n    t_start = time.perf_counter()\n    tm: Dict[str, float] = {}\n\n    def lap(name, t0):\n        tm[name] = (time.perf_counter() - t0) * 1000.0\n\n    def done(res: RecognitionResult) -> RecognitionResult:\n        tm[\"total\"] = (time.perf_counter() - t_start) * 1000.0\n        res.timing_ms = tm\n        return res\n\n    t0 = time.perf_counter()\n    gray = image if image.ndim == 2 else cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)\n    lap(\"gray\", t0)\n\n    # ---- 1. markers\n    t0 = time.perf_counter()\n    found, dup, dinfo = find_markers_scaled(gray)\n    lap(\"detect\", t0)\n    res = RecognitionResult(status=NO_SHEET, px_per_mm=px_per_mm)\n    if not found:\n        return done(res)\n    res.marker_ids = sorted(found)\n    res.marker_corners = {i: c.tolist() for i, c in found.items()}\n    if dup:\n        res.status = INCONSISTENT\n        res.flags.append(\"duplicate_marker\")\n        return done(res)\n    by_group: Dict[int, List[int]] = {}\n    for i in found:\n        by_group.setdefault(i // 4, []).append(i)\n    solid = [g for g, v in by_group.items() if len(v) >= MIN_MARKERS]\n    if len(solid) > 1:\n        res.status = INCONSISTENT\n        res.flags.append(\"mixed_page_markers\")\n        return done(res)\n    if not solid:\n        # fewer than MIN_MARKERS of any page group: the sheet is in view but not usable (covered / cut off)\n        top = max(len(v) for v in by_group.values())\n        lead = [g for g, v in by_group.items() if len(v) == top]\n        if len(lead) > 1:\n            res.status = INCONSISTENT\n            res.flags.append(\"mixed_page_markers\")\n            return done(res)\n        page = lead[0]\n        res.status = PARTIAL\n        res.page = page\n        res.missing_corners = [c for c in mk.CORNERS if mk.marker_id(page, c) not in found]\n        return done(res)\n    page = solid[0]\n    foreign_ids = [i for i in found if i // 4 != page]\n    found = {i: found[i] for i in found if i // 4 == page}\n    res.missing_corners = [c for c in mk.CORNERS if mk.marker_id(page, c) not in found]\n\n    # ---- 2. homography from all visible corner points (>= 12)\n    t0 = time.perf_counter()\n    mm = _marker_corners_mm(page)\n    ids_sorted = sorted(found)\n    src = np.concatenate([found[i] for i in ids_sorted])\n    dst = np.concatenate([mm[i] for i in ids_sorted]) * px_per_mm\n    Hm, _ = cv2.findHomography(src, dst, 0)\n    if Hm is None or not np.isfinite(Hm).all():\n        res.status = BAD_GEOMETRY\n        return done(res)\n    proj = cv2.perspectiveTransform(src.reshape(-1, 1, 2), Hm).reshape(-1, 2)\n    err_mm = np.linalg.norm(proj - dst, axis=1) / px_per_mm\n    Hinv = np.linalg.inv(Hm)\n    back = cv2.perspectiveTransform(dst.reshape(-1, 1, 2), Hinv).reshape(-1, 2)\n    err_px = np.linalg.norm(back - src, axis=1)\n    c0 = cv2.perspectiveTransform(np.array([[[lay.PAGE_W / 2 * px_per_mm, lay.PAGE_H / 2 * px_per_mm]]]), Hinv)[0, 0]\n    # local scale at the page centre: source px per mm\n    d = cv2.perspectiveTransform(np.array([[[lay.PAGE_W / 2 * px_per_mm + px_per_mm, lay.PAGE_H / 2 * px_per_mm]],\n                                           [[lay.PAGE_W / 2 * px_per_mm, lay.PAGE_H / 2 * px_per_mm + px_per_mm]]]), Hinv)\n    src_ppm = float(np.sqrt(np.linalg.norm(d[0, 0] - c0) * np.linalg.norm(d[1, 0] - c0)))\n    # displacement (mm) of every visible corner marker in the warp: anchors of the timing-track chains (omr.tracks)\n    corner_d = {}\n    for n_, i in enumerate(ids_sorted):\n        corner_d[mk.CORNERS[i % 4]] = ((proj - dst)[4 * n_:4 * n_ + 4].mean(0) / px_per_mm)\n    res.homography = Hm.tolist()\n    res.page = page\n    res.quality = {\"reproj_max_mm\": float(err_mm.max()), \"reproj_rms_mm\": float(np.sqrt((err_mm ** 2).mean())),\n                   \"reproj_max_px\": float(err_px.max()), \"source_px_per_mm\": src_ppm,\n                   \"sharpness\": _quality_sharpness(gray, src), \"foreign_markers\": len(foreign_ids),\n                   \"markers_used\": len(found), **dinfo}\n    lap(\"homography\", t0)\n    # a sheet with timing tracks may be bent far more than a plain one (the markers sit where the paper is, not on a plane):\n    # a large marker reprojection error is then only a suspicion, settled below by whether the tracks can bend it flat\n    geom_suspect = MAX_REPROJ_MM < err_mm.max() <= MAX_REPROJ_TRACKS_MM\n    if (err_mm.max() > MAX_REPROJ_MM and not geom_suspect) or not _plausible_sheet(Hinv, px_per_mm):\n        res.status = BAD_GEOMETRY\n        return done(res)\n    # markers of another page group are tolerated only when they lie outside this sheet (another sheet / object)\n    for i in foreign_ids:\n        quad = cv2.perspectiveTransform(np.asarray(res.marker_corners[i], np.float64).reshape(-1, 1, 2), Hm).reshape(4, 2) / px_per_mm\n        if np.mean([np.linalg.norm(quad[(k + 1) % 4] - quad[k]) for k in range(4)]) < FOREIGN_MIN_SIDE_FRAC * lay.MARKER_MM:\n            continue                     # far smaller than a corner marker, yet inside the sheet: a pattern in the print, not a marker\n        ctr = quad.mean(0)\n        if any(np.linalg.norm(ctr - cv2.perspectiveTransform(c.reshape(-1, 1, 2), Hm).reshape(4, 2).mean(0) / px_per_mm) < lay.MARKER_MM\n               for c in found.values()):\n            continue                     # overlaps a marker of this page: two markers cannot share a spot, it is a mis-decode of that marker's surroundings\n        if -FOREIGN_MARGIN_MM <= ctr[0] <= lay.PAGE_W + FOREIGN_MARGIN_MM and -FOREIGN_MARGIN_MM <= ctr[1] <= lay.PAGE_H + FOREIGN_MARGIN_MM:\n            res.status = INCONSISTENT\n            res.flags.append(\"mixed_page_markers\")\n            return done(res)\n    if res.missing_corners:\n        res.flags.append(\"corner_hidden\")\n\n    # ---- 3. warp\n    t0 = time.perf_counter()\n    cw, ch = int(round(lay.PAGE_W * px_per_mm)), int(round(lay.PAGE_H * px_per_mm))\n    warped = cv2.warpPerspective(gray, Hm, (cw, ch), flags=cv2.INTER_LINEAR, borderValue=255)\n    lap(\"warp\", t0)\n    res.warped = warped if keep_images else None\n\n    # ---- 4. header: the sheet describes its own layout (legacy sheets: 16-bit form id, layout from the resolver)\n    t0 = time.perf_counter()\n    tfield = None\n    if geom_suspect:       # see above: only a sheet whose tracks bend it flat is accepted\n        tfield = trk.measure(warped, px_per_mm, corner_d)\n        if tfield is None:\n            res.status = BAD_GEOMETRY\n            return done(res)\n        warped = trk.rectify(warped, tfield, px_per_mm)\n        res.warped = warped if keep_images else None\n    hdr, info = _read_header(warped, px_per_mm)\n    if geom_suspect and (hdr is None or hdr.version < 2):\n        res.status = BAD_GEOMETRY          # not a bent sheet with tracks: the marker error stands\n        return done(res)\n    meta_pre, meta_src = None, warped\n    if hdr is None:\n        meta_pre = _read_meta(warped, px_per_mm)         # a readable legacy strip: an older sheet, nothing to straighten\n    if hdr is None and meta_pre[0] is None:\n        # header unreadable on the plain warp: a folded / curled sheet with timing tracks reads after they straighten it\n        tfield = trk.measure(warped, px_per_mm, corner_d)\n        if tfield is not None:\n            flat_ = trk.rectify(warped, tfield, px_per_mm)\n            hdr, info2 = _read_header(flat_, px_per_mm)\n            if hdr is not None and hdr.version >= 2:\n                info = info2\n                warped = flat_\n                res.warped = warped if keep_images else None\n            else:\n                hdr, tfield = None, None\n    res.quality.update(info)\n    if hdr is not None:\n        layout = layout_for_header(hdr)\n        hpage, total = hdr.page, hdr.pages\n    else:\n        meta, linfo = meta_pre if (meta_pre is not None and warped is meta_src) else _read_meta(warped, px_per_mm)\n        if meta is None:\n            lap(\"meta\", t0)\n            res.status = BAD_META\n            return done(res)\n        res.quality.update(linfo)\n        res.form_id = meta.form_id\n        hpage, total = meta.page, meta.total_pages\n        layout = resolve_layout(meta.form_id) if resolve_layout is not None else None\n        if layout is None:\n            lap(\"meta\", t0)\n            res.status = UNKNOWN_FORM\n            return done(res)\n        if layout.form_id != meta.form_id:\n            lap(\"meta\", t0)\n            res.status = BAD_META\n            res.flags.append(\"layout_mismatch\")\n            return done(res)\n    lap(\"meta\", t0)\n    res.form_key, res.total_pages = layout.form_key, total\n    if hpage != page:\n        res.status = BAD_META\n        res.flags.append(\"page_mismatch\")\n        return done(res)\n    if layout.total_pages != total or page >= len(layout.pages):\n        res.status = BAD_META\n        res.flags.append(\"layout_mismatch\")\n        return done(res)\n    pg = layout.pages[page]\n\n    # ---- 4b. timing tracks (header version >= 2): bend the page flat again, so everything below sits at its nominal place\n    t0 = time.perf_counter()\n    if pg.ticks:\n        if tfield is None:          # not yet measured (the header read fine on the plain warp)\n            tfield = trk.measure(warped, px_per_mm, corner_d)\n            if tfield is not None and tfield.max_disp() >= trk.FLAT_MM:\n                warped = trk.rectify(warped, tfield, px_per_mm)\n                res.warped = warped if keep_images else None\n            elif tfield is not None:                    # flat sheet: the tracks confirm the homography, nothing to resample\n                res.quality.update(tfield.info())\n                res.quality[\"tracks\"] = 1.0\n                tfield = trk.FLAT\n        if tfield is not trk.FLAT:\n            res.quality[\"tracks\"] = 1.0 if tfield is not None else 0.0\n            if tfield is not None:\n                res.quality.update(tfield.info())\n                res.dewarp = tfield\n    lap(\"tracks\", t0)\n\n    # ---- 5. bubbles\n    t0 = time.perf_counter()\n    smooth = cv2.GaussianBlur(warped, (0, 0), 0.25 * px_per_mm)\n    # serial strip: a failure never invalidates the frame (serial stays None, soft flag)\n    res.serial, sstate = _read_serial(warped, px_per_mm)\n    if sstate == \"unreadable\":\n        res.flags.append(\"serial_unreadable\")\n    qs = sorted((q for col in pg.columns for q in col.questions), key=lambda q: q.number)\n    nc = layout.template.choices\n    cent = [(b.cx, b.cy) for q in qs for b in q.bubbles]\n    g = pg.id_grid\n    sg = pg.subject_grid\n    # the ID and subject grids share one bubble geometry: one group for alignment and scoring\n    icols = list(g.columns) + (list(sg.columns) if sg is not None else [])\n    n_id = len(g.columns)\n    icent = [(b.cx, b.cy) for col in icols for b in col.bubbles]\n    adiag: dict = {}\n    coef, ainfo = _fit_alignment(smooth, [(cent, pg.bubble_diameter), (icent, g.bubble_diameter)], px_per_mm,\n                                 extrapolated=bool(res.missing_corners) and tfield is None, strict=tfield is not None and tfield is not trk.FLAT, diag=adiag)\n    res.quality.update(ainfo)\n    cent = _apply_alignment(cent, coef)\n    icent = _apply_alignment(icent, coef)\n    ic = np.round(icent, 2).reshape(len(icols), 10, 2)\n    res.bubble_centers_mm = {\"answers\": np.round(cent, 2).reshape(len(qs), nc, 2).tolist(),\n                             \"id\": ic[:n_id].tolist(), \"subject\": ic[n_id:].tolist()}\n    DA, UA = illum.bubble_darkness(smooth, cent, pg.bubble_diameter, px_per_mm, \"E\")\n    DI, UI = illum.bubble_darkness(smooth, icent, g.bubble_diameter, px_per_mm, \"E\")\n    UA, UI = ~UA, ~UI                                    # illum returns \"reliable\"; the fills want \"unreliable\"\n    if coef is not None and tfield is not None and tfield is not trk.FLAT and adiag:   # a straightened page: interior check\n        bad_q, bad_i = _rows_misfit(adiag, [(cent.reshape(len(qs), nc, 2), pg.bubble_diameter, 2 if nc >= 4 else 1),\n                                           (icent.reshape(len(icols), 10, 2), g.bubble_diameter, 4)])\n        UA, UI = UA | np.repeat(bad_q, nc), UI | np.repeat(bad_i, 10)\n        res.quality[\"rows_misfit\"] = float(bad_q.sum() + bad_i.sum())\n    black = float(np.clip(res.quality.get(\"meta_black\", 0.9), META_MIN_CONTRAST, 1.0))   # printed-black darkness on this frame\n    # the sheet chooses its own ink floor (never below ABS_INK_FRAC x black); illum before ink: unreliable bubbles are 0 in D\n    rows = list(inkmod.bubble_ink(DA).reshape(-1, nc)) + list(inkmod.bubble_ink(DI).reshape(-1, 10))\n    ia = inkmod.choose_floor(rows, black)\n    abs_ink = ia.floor\n    page_ink, n_marks = _ink_level([DA, DI], abs_ink)\n    ink = max(abs_ink, page_ink or 0.0)\n    min_str = MIN_STRENGTH if page_ink is not None else STRENGTH_UNCALIBRATED\n    res.quality.update({\"ink_abs\": abs_ink, \"ink_marks_used\": n_marks, \"unreliable_bubbles\": int(UA.sum() + UI.sum())})\n    FA, SA = _fill(DA, ink, UA)\n    FI, SI = _fill(DI, ink, UI)\n    MA, MI = _mean_dark(DA, UA).reshape(len(qs), nc), _mean_dark(DI, UI).reshape(len(icols), 10)\n    FA, SA = FA.reshape(len(qs), nc), SA.reshape(len(qs), nc)\n    FI, SI = FI.reshape(len(icols), 10), SI.reshape(len(icols), 10)\n    raw = PageRaw([q.number for q in qs], [[b.label for b in q.bubbles] for q in qs], [col.digit_index for col in g.columns],\n                  FA, SA, FI[:n_id], SI[:n_id], float(ink), float(min_str), verified=coef is not None,\n                  FS=FI[n_id:] if sg is not None else None, SS=SI[n_id:] if sg is not None else None,\n                  ink_source=ia.source, ink_separation=float(ia.separation),\n                  MA=MA, MI=MI[:n_id], MS=MI[n_id:] if sg is not None else None)\n    dec = decide_page(raw)\n    res.answers, res.id_digits, res.student_id, idflags, res.calibration = \\\n        dec.answers, dec.id_digits, dec.student_id, dec.flags, dec.calibration\n    res.subject_digits, res.subject = dec.subject_digits, dec.subject\n    order = sorted(range(len(res.answers)), key=lambda i: res.answers[i].number)\n    res.answers = [res.answers[i] for i in order]\n    res.raw = raw\n    if coef is None:  # bubble positions could not be verified against the printed rings: trust nothing\n        res.flags.append(\"alignment_unverified\")\n    res.flags.extend(idflags)\n    lap(\"score\", t0)\n\n    # ---- 7. name box crop (kept so a later stage can read/OCR it)\n    x, y, w, h = pg.name_box\n    res.name_crop = warped[int(y * px_per_mm):int((y + h) * px_per_mm), int(x * px_per_mm):int((x + w) * px_per_mm)].copy() \\\n        if keep_images else None\n    res.status = OK\n    return done(res)\n", "omr/fusion.py": "\"\"\"Multi-frame fusion: one physical sheet seen in many frames -> one set of decisions.\n\nA *track* is a run of frames believed to be the same physical sheet.  Per-bubble raw measurements (fill and\nstrength, exposed by `recognize` as `result.raw`) are fused with a per-bubble median over the track's recent\nframes, and the ONE decision function (`omr.recognize.decide_page`) runs on the fused arrays - the rules are not\nduplicated here.  Different frames typically leave different digits unreadable (blur, a light mark, a shadow);\nthe median resolves what no single frame could.\n\nA frame joins the track only if it is compatible with it, otherwise the track ends and a new one starts with\nthat frame.  Two sheets are never blended:\n  * another form (form_key) / page, or another (readable) serial;\n  * a jump of the sheet quad between consecutive frames (moved or replaced);\n  * a confident contradiction: a digit (student ID or subject code) / answer the fused track reads confidently\n    that this frame reads confidently as something else (a different readable subject = another sheet), or >= CONTRADICT_BUBBLES bubbles whose fill swings by >= CONTRADICT_FILL\n    against the fused value (a different hand-drawn mark pattern, even when no single decision is confident).\nFrames whose bubble alignment could not be verified (`raw.verified` False) never contribute.\nPure: no I/O, no clock.\n\"\"\"\nfrom __future__ import annotations\n\nimport copy\nimport warnings\nfrom collections import Counter, deque\nfrom typing import Optional, Tuple\n\nimport numpy as np\n\nfrom .recognize import PageRaw, decide_page\n\nWINDOW = 12              # most recent frames fused (the median adapts, memory is bounded)\nCONTRADICT_FILL = 0.6    # per-bubble fill swing that counts as a contradiction ...\nCONTRADICT_BUBBLES = 2   # ... when at least this many bubbles swing\nJUMP_FRACTION = 0.2      # sheet-quad centre jump (fraction of sheet size) between consecutive frames\nSCALE_JUMP = 0.35        # relative change of the sheet size between consecutive frames\nID_FLAGS = (\"id_blank\", \"id_unreadable\", \"alignment_unverified\", \"subject_blank\", \"subject_unreadable\")\n\n\ndef sheet_quad(r):\n    \"\"\"(cx, cy, size) of the projected page rectangle in image px (independent of which markers were visible).\"\"\"\n    if r.homography is None:\n        return None\n    try:\n        q = r.image_points([[0, 0], [210, 0], [210, 297], [0, 297]])\n    except Exception:\n        return None\n    return (float(q[:, 0].mean()), float(q[:, 1].mean()),\n            float(max(np.ptp(q[:, 0]), np.ptp(q[:, 1]))))\n\n\ndef _sig(answers, student_id, subject):\n    return (tuple((a.number, a.state, tuple(a.marked)) for a in answers), student_id, subject)\n\n\ndef trustworthy(r) -> bool:\n    \"\"\"A frame can feed a track: raw measurements present, verified, and consistent with the frame's decisions\n    (a result whose decisions were edited after the fact is not fused).\"\"\"\n    raw = r.raw\n    if raw is None or not raw.verified:\n        return False\n    d = decide_page(raw)\n    return _sig(d.answers, d.student_id, d.subject) == _sig(r.answers, r.student_id, r.subject)\n\n\nclass Track:\n    def __init__(self, no: int, r, t: float):\n        self.no = no\n        self.form_key, self.page = r.form_key, r.page\n        self.frames: deque = deque(maxlen=WINDOW)\n        self.serials: Counter = Counter()\n        self.t0 = self.t_last = t\n        self.n = 0\n        self.quad = None\n        self.committed = False\n        self.held_since: Optional[float] = None    # set while a stable-but-unreadable-ID result is being held\n        self.best = None                            # (sharpness, result, payload, t) of the sharpest frame\n        self._dec = None\n        self._raw: Optional[PageRaw] = None\n        self.add(r, t, None)\n\n    # ------------------------------------------------------------------ fusion\n    def fused_raw(self) -> PageRaw:\n        if self._raw is None:\n            fr = list(self.frames)\n            med = lambda f: np.median(np.stack([getattr(x, f) for x in fr]), axis=0)\n            r0 = fr[-1]\n\n            def nanmed(f):    # disc darkness (relative rule): NaN = unknowable bubble; a frame without it does not vote; None when no frame has it\n                have = [getattr(x, f) for x in fr if getattr(x, f) is not None]\n                if not have:\n                    return None\n                with warnings.catch_warnings():\n                    warnings.simplefilter(\"ignore\", RuntimeWarning)\n                    return np.nanmedian(np.stack(have), axis=0)\n\n            subj = {}\n            if r0.FS is not None:    # same form on every frame of a track (form_key), so FS is present on all or none\n                subj = dict(FS=med(\"FS\"), SS=med(\"SS\"), MS=nanmed(\"MS\"))\n            self._raw = PageRaw(r0.numbers, r0.labels, r0.digit_index, med(\"FA\"), med(\"SA\"), med(\"FI\"), med(\"SI\"),\n                                float(np.median([x.ink for x in fr])), float(np.median([x.min_strength for x in fr])), True,\n                                ink_source=\"default\" if any(x.ink_source == \"default\" for x in fr) else \"auto\",\n                                ink_separation=float(np.median([x.ink_separation for x in fr])),\n                                MA=nanmed(\"MA\"), MI=nanmed(\"MI\"), **subj)\n        return self._raw\n\n    def decisions(self):\n        if self._dec is None:\n            self._dec = decide_page(self.fused_raw())\n        return self._dec\n\n    def serial(self) -> Optional[int]:\n        return self.serials.most_common(1)[0][0] if self.serials else None\n\n    # ------------------------------------------------------------------ membership\n    def incompatible(self, r) -> Optional[str]:\n        if (r.form_key, r.page) != (self.form_key, self.page):\n            return \"other_sheet\"\n        if r.serial is not None and self.serial() is not None and r.serial != self.serial():\n            return \"other_serial\"\n        q = sheet_quad(r)\n        if q is not None and self.quad is not None:\n            (x0, y0, s0), (x1, y1, s1) = self.quad, q\n            if ((x1 - x0) ** 2 + (y1 - y0) ** 2) ** 0.5 > JUMP_FRACTION * max(s0, s1) or abs(s1 - s0) > SCALE_JUMP * max(s0, s1):\n                return \"moved\"\n        if self.n >= 2 and self._contradicts(r):\n            return \"contradiction\"\n        return None\n\n    def _contradicts(self, r) -> bool:\n        dec = self.decisions()\n        for a, b in zip(dec.answers, r.answers):\n            if not a.ambiguous and not b.ambiguous and (a.state, a.marked) != (b.state, b.marked):\n                return True\n        for a, b in list(zip(dec.id_digits, r.id_digits)) + list(zip(dec.subject_digits, r.subject_digits)):\n            if a.value is not None and b.value is not None and a.value != b.value:\n                return True\n        fr, raw = self.fused_raw(), r.raw\n        swing = int((np.abs(fr.FA - raw.FA) >= CONTRADICT_FILL).sum() + (np.abs(fr.FI - raw.FI) >= CONTRADICT_FILL).sum())\n        if fr.FS is not None and raw.FS is not None:\n            swing += int((np.abs(fr.FS - raw.FS) >= CONTRADICT_FILL).sum())\n        return swing >= CONTRADICT_BUBBLES\n\n    def add(self, r, t: float, payload) -> None:\n        self.frames.append(r.raw)\n        self.n += 1\n        self.t_last = t\n        if r.serial is not None:\n            self.serials[r.serial] += 1\n        self.quad = sheet_quad(r) or self.quad\n        self._raw = self._dec = None\n        sharp = float((r.quality or {}).get(\"sharpness\", 0.0))\n        if self.best is None or sharp > self.best[0]:\n            self.best = (sharp, r, payload, t)\n\n    # ------------------------------------------------------------------ result\n    def apply(self, r):\n        \"\"\"Copy of frame result `r` carrying the track's fused decisions.\"\"\"\n        dec = self.decisions()\n        out = copy.copy(r)\n        out.answers, out.id_digits, out.student_id, out.calibration = dec.answers, dec.id_digits, dec.student_id, dec.calibration\n        out.subject, out.subject_digits = dec.subject, dec.subject_digits\n        out.flags = [f for f in r.flags if f not in ID_FLAGS] + dec.flags\n        s = self.serial()\n        if s is not None:\n            out.serial = s\n            out.flags = [f for f in out.flags if f != \"serial_unreadable\"]\n        out.fused_frames = len(self.frames)\n        return out\n\n    def id_unreadable(self) -> bool:\n        return \"id_unreadable\" in self.decisions().flags\n\n    def subject_unreadable(self) -> bool:\n        return \"subject_unreadable\" in self.decisions().flags\n", "omr/identity.py": "\"\"\"Physical-sheet identity, shared by the stream state machine and the database policy.\n\n    sheet_key = sha1(f\"{serial:04d}|{subject_text}|{student_id_text}\")\n\n``serial`` is the printed per-copy number (0 = none, e.g. a photocopied master -> \"0000\", so the key\ndegrades to \"identity = subject + student ID\" without any special case).  ``student_id_text`` is the read ID, or\nthe raw per-digit reading with '?' for unread digits when the ID could not be read (deterministic).\n``subject_text`` is the marked subject code, read the same way ('?' per unread digit; \"\" for a form without a\nsubject code).  The form itself (``form_key``) and the page are NOT part of the key: callers pair it with them.\nWorks on a RecognitionResult or on its ``to_dict()``.\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nfrom typing import Optional\n\n\ndef _get(r, name, default=None):\n    return r.get(name, default) if isinstance(r, dict) else getattr(r, name, default)\n\n\ndef serial_of(r) -> int:\n    try:\n        return int(_get(r, \"serial\") or 0)\n    except (TypeError, ValueError):\n        return 0\n\n\ndef _digits_text(value, digits) -> str:\n    if value is not None and str(value).strip():\n        return str(value).strip()\n    out = []\n    for d in digits or []:\n        v = d.get(\"value\") if isinstance(d, dict) else getattr(d, \"value\", None)\n        out.append(\"?\" if v is None else str(v))\n    return \"\".join(out)\n\n\ndef student_id_text(r) -> str:\n    return _digits_text(_get(r, \"student_id\"), _get(r, \"id_digits\"))\n\n\ndef subject_text(r) -> str:\n    return _digits_text(_get(r, \"subject\"), _get(r, \"subject_digits\"))\n\n\ndef make_sheet_key(serial: int, id_text: str, subject: str = \"\") -> str:\n    return hashlib.sha1(f\"{int(serial or 0):04d}|{subject}|{id_text}\".encode()).hexdigest()[:16]\n\n\ndef sheet_key(r) -> str:\n    return make_sheet_key(serial_of(r), student_id_text(r), subject_text(r))\n\n\ndef format_serial(serial: Optional[int]) -> str:\n    return f\"No. {int(serial):04d}\" if serial else \"\"\n", "omr/stream.py": "\"\"\"Frame-by-frame \"barcode scanner\" state machine.  Pure: no I/O, no clock, no threads.\n\n    session = StreamSession()        # self-describing sheets: no database or layout resolver is needed\n    event = session.feed(recognition_result, t_seconds, payload=frame)\n\nevent = {\"state\", \"hint\", \"overlay\", \"frame_index\", \"commit\"?}\n\nStates\n  idle       no sheet in view\n  detecting  a sheet is in view but nothing is committed for it yet\n  committed  this very frame completed a commit (event[\"commit\"] is set)\n  cooldown   the committed sheet is still in view; nothing more is committed for it\n\nRules\n  * A commit needs K consecutive `ok` frames with the same decision key\n    (form_key, page, subject code, student id, per-question state + marked).  One frame never commits.\n  * After a commit the same sheet cannot commit again until it has been gone for M consecutive frames\n    (no_sheet / partial), after which the session is idle again.\n  * Cooldown, sheet held continuously (no interruption since the commit): strict.  Only another form /\n    page, another readable student id or subject code, or answers differing in more than SWAP_FRACTION of the questions\n    count as a different sheet; smaller changes (a borderline bubble flipping) never commit a second version.\n  * Cooldown after an INTERRUPTION since the commit: a run of >= INTERRUPT_FRAMES (2) consecutive non-ok\n    frames of any status, or a jump of the marker quad between consecutive ok frames (centre moved by more\n    than JUMP_FRACTION of the sheet size, or its size changed by more than SCALE_JUMP) means the sheet was\n    moved or replaced.  The next K-stable key then commits if it differs from the committed key in any way\n    (a missed sheet is worse than an extra commit; the DB dedupes identical ones).  An identical key is the\n    same sheet put back: no commit, and the interruption is considered settled.\n  * Sheet identity: `sheet_key` = hash(serial|subject text|student-id text) (omr/identity.py).  A different key is another\n    sheet (commit once K-stable, in cooldown too); the same key and page is the same sheet.  Serial 0 (a\n    photocopied master) is just \"0000\", so identity degrades to the student ID.  Unreadable-ID digits can\n    flicker and occasionally cost an extra commit; the DB dedupes / queues it.\n  * Optional filters (`allowed_forms`: form_keys, `allowed_subjects`: subject codes) make a scanner ignore other\n    forms / subjects.  A frame whose subject is not readable is NOT filtered out (it may be the wanted one).\n  * Missed-sheet check: a (form_key, page, sheet_key) seen in >= MISSED_MIN_FRAMES ok frames that was never\n    committed in this session, and is no longer the sheet in view, is reported by `missed()`.\n  * Presence: a frame with any marker visible (status != no_sheet, i.e. also `partial`, `bad_*`, `inconsistent`)\n    means a sheet is in view.  Consecutive presence forms an episode that ends after M consecutive no_sheet\n    frames.  An episode of >= MISSED_MIN_FRAMES frames that never produced a commit is reported by\n    `unread_episodes()`: a sheet that was shown but never read (covered marker, blur, ...), also when it never\n    produced a single `ok` frame.  Events carry `present` and `unread` (the current episode is long enough\n    and still without a commit) for the live hint.\n  * Fusion (omr/fusion.py): frames of one physical sheet form a track; their per-bubble measurements are fused\n    (median) and decided by the same decision function, so a digit unreadable in every single frame can still\n    resolve.  All rules above (K-stable key, cooldown, sheet identity) operate on the FUSED result.  A track\n    never commits twice.  A stable result whose ID or subject code is still unreadable is held up to HOLD_SECONDS while the sheet\n    stays in view; it is committed unreadable only when the hold expires or the track ends (>= 2 non-contributing\n    frames, a contradicting / different sheet, `finish()`).  The commit carries the fused decisions with the\n    sharpest frame's images and `result.fused_frames`.\n  * The commit carries the sharpest of the K agreeing frames (result + the caller's payload).\n    Fusing the K frames' scores into one result would go in `_pick`.\n\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Any, Callable, Dict, Iterable, List, Optional, Tuple\n\nfrom .fusion import Track, trustworthy\nfrom .identity import sheet_key as _sheet_key, serial_of\n\nIDLE, DETECTING, COMMITTED, COOLDOWN = \"idle\", \"detecting\", \"committed\", \"cooldown\"\n\nDEFAULT_K = 3\nDEFAULT_M = 5\nDEFAULT_HINT_AFTER = 2.0     # seconds a sheet may be in view without stabilising before a hint appears\nINTERRUPT_FRAMES = 2         # consecutive non-ok frames that count as \"the sheet was disturbed\"\nJUMP_FRACTION = 0.2          # marker-quad centre jump, as a fraction of the sheet size\nSCALE_JUMP = 0.35            # relative change of the sheet size between consecutive frames\nSWAP_FRACTION = 0.3          # share of differing questions that marks a different physical sheet\nLOW_RES_PX_PER_MM = 2.2      # source px per mm below which \"move closer\" is the likely fix\nLOW_SHARPNESS = 40.0         # Laplacian variance below which \"hold still\" is the likely fix\nDEFAULT_BUBBLE_MM = 4.0\n\nHOLD_SECONDS = 1.5           # an unreadable ID is given this long (sheet still in view) to resolve through fusion\nTRACK_GAP = INTERRUPT_FRAMES  # consecutive non-contributing frames that end a track\n\nMISSED_MIN_FRAMES = 2        # ok frames a sheet must be seen in to count as \"seen\" for the missed-sheet check\n\nABSENT = (\"no_sheet\", \"partial\")\n\n# overlay bubble codes\nB_EMPTY, B_MARKED, B_MULTI, B_AMBIGUOUS = 0, 1, 2, 3\n\n\ndef decision_key(r) -> tuple:\n    return (r.form_key, r.page, r.student_id,\n            tuple((a.number, a.state, tuple(a.marked)) for a in r.answers), _sheet_key(r), r.subject)\n\n\ndef identity(r) -> tuple:\n    return (r.form_key, r.page, r.student_id, r.subject)\n\n\ndef sheet_id(r) -> tuple:\n    \"\"\"(form_key, page, sheet_key): the physical-sheet identity used by the missed-sheet check.\"\"\"\n    return (r.form_key, r.page, _sheet_key(r))\n\n\ndef _answer_distance(a: tuple, b: tuple) -> float:\n    da = {n: (s, m) for n, s, m in a}\n    db = {n: (s, m) for n, s, m in b}\n    keys = set(da) | set(db)\n    if not keys:\n        return 0.0\n    return sum(1 for k in keys if da.get(k) != db.get(k)) / len(keys)\n\n\ndef _quad(r):\n    \"\"\"(cx, cy, size) of the marker quad in image px, or None.\"\"\"\n    pts = [p for q in r.marker_corners.values() for p in q]\n    if not pts:\n        return None\n    xs, ys = [p[0] for p in pts], [p[1] for p in pts]\n    return ((min(xs) + max(xs)) / 2, (min(ys) + max(ys)) / 2, max(max(xs) - min(xs), max(ys) - min(ys)))\n\n\ndef is_other_sheet(committed_key: tuple, key: tuple) -> bool:\n    \"\"\"Is `key` a different physical sheet than the one already committed (both ok-frame keys)?\"\"\"\n    f0, p0, s0, a0, k0, u0 = committed_key\n    f1, p1, s1, a1, k1, u1 = key\n    if f0 != f1 or p0 != p1 or k0 != k1:\n        return True\n    if s0 is not None and s1 is not None and s0 != s1:\n        return True\n    if u0 is not None and u1 is not None and u0 != u1:\n        return True\n    return _answer_distance(a0, a1) > SWAP_FRACTION\n\n\nclass StreamSession:\n    def __init__(self, k: int = DEFAULT_K, m: int = DEFAULT_M, hint_after: float = DEFAULT_HINT_AFTER,\n                 allowed_forms: Optional[Iterable[str]] = None, allowed_subjects: Optional[Iterable[str]] = None,\n                 resolve_layout: Optional[Callable[[int], Any]] = None, fuse: bool = True, hold_s: float = HOLD_SECONDS):\n        self.fuse, self.hold_s = fuse, hold_s\n        if k < 2:\n            raise ValueError(\"k must be >= 2: a single frame must never commit\")\n        self.k, self.m, self.hint_after = k, m, hint_after\n        self.allowed_forms = None if allowed_forms is None else set(allowed_forms)\n        self.allowed_subjects = None if allowed_subjects is None else set(allowed_subjects)\n        self.resolve_layout = resolve_layout       # legacy sheets only: form_id -> Layout (for the overlay bubble size)\n        self.frame_index = -1\n        self.reset_tracking()\n        self.reset()\n\n    def reset_tracking(self) -> None:\n        \"\"\"Forget which sheets were seen / committed (start of a new scanning session).\"\"\"\n        self._seen: Dict[Any, dict] = {}         # track number (or sheet_id for unfused frames) -> info\n        self._committed_ids: set = set()\n        self._current: Any = None                # _seen key of the sheet in view right now\n        self._track: Optional[Track] = None\n        self._track_no = 0\n        self._tgap = 0                           # consecutive frames that did not contribute to the track\n        self._ep: Optional[dict] = None           # presence episode in progress\n        self._episodes: List[dict] = []           # finished episodes\n        self._gap = 0                             # consecutive no_sheet frames\n\n    def missed(self, final: bool = False) -> List[dict]:\n        \"\"\"Sheets (tracks) seen in >= MISSED_MIN_FRAMES ok frames but never committed (the sheet in view is\n        excluded unless ``final``).\"\"\"\n        out = []\n        for key, info in self._seen.items():\n            if info[\"committed\"] or info[\"sid\"] in self._committed_ids or info[\"frames\"] < MISSED_MIN_FRAMES:\n                continue\n            if key == self._current and not final:\n                continue\n            m = {\"form_key\": info[\"sid\"][0], \"page\": info[\"sid\"][1], \"serial\": info[\"serial\"],\n                 \"student_id\": info[\"student_id\"], \"frames\": info[\"frames\"]}\n            if info.get(\"possibly_same_as\"):\n                m[\"possibly_same_as\"] = info[\"possibly_same_as\"]\n            out.append(m)\n        return sorted(out, key=lambda m: (m[\"serial\"] or 0, m[\"page\"] if m[\"page\"] is not None else -1))\n\n    def _track_presence(self, status: str, t: float, hint_status: str) -> None:\n        if status == \"no_sheet\":\n            self._gap += 1\n            if self._ep is not None and self._gap >= self.m:\n                self._episodes.append(self._ep)\n                self._ep = None\n            return\n        self._gap = 0\n        if self._ep is None:\n            self._ep = {\"t0\": t, \"t1\": t, \"frames\": 0, \"ok\": 0, \"commits\": 0, \"statuses\": {}, \"page\": None}\n        e = self._ep\n        e[\"t1\"] = t\n        e[\"frames\"] += 1\n        e[\"ok\"] += status == \"ok\"\n        e[\"statuses\"][status] = e[\"statuses\"].get(status, 0) + 1\n\n    def unread_episodes(self, final: bool = False) -> List[dict]:\n        \"\"\"Sheet-present stretches (any marker visible, incl. `partial`) that never produced a commit.\n        The one in progress is included only with ``final`` (it may still be read).\"\"\"\n        eps = list(self._episodes) + ([self._ep] if final and self._ep is not None else [])\n        return [dict(e) for e in eps if e[\"commits\"] == 0 and e[\"frames\"] >= MISSED_MIN_FRAMES]\n\n    def reset(self) -> None:\n        self.state = IDLE\n        self._absent = 0\n        self._run_key: Optional[tuple] = None\n        self._run_n = 0\n        self._best: Optional[tuple] = None          # (sharpness, result, payload, t)\n        self._committed_key: Optional[tuple] = None\n        self._committed_res = None                   # the committed (fused) result, for identity-by-evidence\n        self._since: Optional[float] = None          # when the current uncommitted sheet came into view\n        self._nonok = 0                              # consecutive non-ok frames\n        self._interrupted = False                    # sheet disturbed since the last commit\n        self._prev_quad: Optional[tuple] = None      # (cx, cy, size) of the previous ok frame\n\n    # ------------------------------------------------------------------ main entry\n    def feed(self, r, t: float, payload: Any = None) -> dict:\n        self.frame_index += 1\n        commit = None\n        hint = \"\"\n        status = r.status\n        r0 = r\n        pre = None                    # commit produced by a track that ended with this frame\n        if status == \"ok\":\n            self._nonok = 0\n        else:\n            self._nonok += 1\n            self._prev_quad = None\n            if self._nonok >= INTERRUPT_FRAMES and self._committed_key is not None:\n                self._interrupted = True\n        # ---- track bookkeeping (fusion)\n        if status == \"ok\" and self.fuse and trustworthy(r):\n            self._tgap = 0\n            why = self._track.incompatible(r) if self._track is not None else None\n            if why is not None:\n                pre = self._end_track()\n            if self._track is None:\n                self._track_no += 1\n                self._track = Track(self._track_no, r, t)\n                self._track.best = (float((r.quality or {}).get(\"sharpness\", 0.0)), r, payload, t)\n            else:\n                self._track.add(r, t, payload)\n            r = self._track.apply(r)\n        else:\n            self._tgap += 1\n            if self._tgap >= TRACK_GAP and self._track is not None:\n                pre = self._end_track()\n        self._track_presence(status, t, status)\n\n        if pre is not None:\n            commit = pre\n        if status in ABSENT:\n            self._run_key, self._run_n, self._best = None, 0, None\n            self._absent += 1\n            if self._absent >= self.m:\n                self._current = None\n                self.reset()\n            elif self.state == COMMITTED:\n                self.state = COOLDOWN\n            hint = self._absent_hint(r)\n        else:\n            self._absent = 0\n            if self._since is None and self.state in (IDLE, DETECTING):\n                self._since = t\n            if self.state == IDLE:\n                self.state = DETECTING\n            elif self.state == COMMITTED:\n                self.state = COOLDOWN\n            if status == \"ok\":\n                hint, c2 = self._feed_ok(r, t, payload)\n                commit = commit or c2\n            else:\n                self._run_key, self._run_n, self._best = None, 0, None\n                hint = self._bad_hint(r, t)\n\n        if commit is not None:\n            self.state = COMMITTED\n            hint = \"Scanned\"\n            if self._ep is not None:\n                self._ep[\"commits\"] += 1\n        elif self.state == COOLDOWN and not hint:\n            hint = \"Scanned - show the next sheet\"\n        elif self.state == IDLE and not hint:\n            hint = \"Show a sheet\"\n        ev = {\"state\": self.state, \"hint\": hint, \"overlay\": self.overlay(r), \"frame_index\": self.frame_index,\n              \"present\": status != \"no_sheet\",\n              \"possibly_same\": any(i.get(\"possibly_same_as\") and not i[\"committed\"] for i in self._seen.values()),\n              \"unread\": bool(self._ep is not None and self._ep[\"commits\"] == 0 and self._ep[\"frames\"] >= MISSED_MIN_FRAMES)}\n        if commit is not None:\n            ev[\"commit\"] = commit\n        return ev\n\n    def finish(self, t: float = 0.0) -> Optional[dict]:\n        \"\"\"End of stream: a held (stable, ID still unreadable) track is committed as it is.\"\"\"\n        c = self._end_track()\n        if c is not None:\n            self.state = COMMITTED\n        return c\n\n    # ------------------------------------------------------------------ tracks\n    def _end_track(self) -> Optional[dict]:\n        \"\"\"Close the current track; commit it if it was held (stable but not yet committed).\"\"\"\n        tr, self._track = self._track, None\n        self._tgap = 0\n        if tr is None or tr.committed or tr.held_since is None:\n            return None\n        sharp, r0, payload, t = tr.best\n        final = tr.apply(r0)\n        key = decision_key(final)\n        if self._committed_key is not None and self.state == COOLDOWN:      # same re-commit rules as for a live frame\n            if self._interrupted:\n                if key == self._committed_key:\n                    return None\n                if self._same_by_evidence(final):\n                    self._note_possible((\"t\", tr.no), final)\n                    return None\n            elif not is_other_sheet(self._committed_key, key):\n                return None\n        return self._do_commit(final, payload, t, key, tr.n, tr)\n\n    def _do_commit(self, final, payload, t, key, frames, track=None) -> dict:\n        commit = {\"result\": final, \"payload\": payload, \"key\": key, \"identity\": identity(final),\n                  \"t\": t, \"frames\": frames, \"frame_index\": self.frame_index, \"fused_frames\": final.fused_frames}\n        self._committed_key = key\n        self._committed_res = final\n        sid = sheet_id(final)\n        self._committed_ids.add(sid)\n        if track is not None:\n            track.committed = True\n            for k, info in self._seen.items():\n                if k == (\"t\", track.no):\n                    info[\"committed\"] = True\n        self._run_key, self._run_n, self._best = None, 0, None\n        self._since = None\n        self._interrupted = False\n        return commit\n\n    # ------------------------------------------------------------------ ok frames\n    def _feed_ok(self, r, t, payload):\n        if self.allowed_forms is not None and r.form_key not in self.allowed_forms:\n            self._run_key, self._run_n, self._best = None, 0, None\n            return \"Sheet is another form\", None\n        if self.allowed_subjects is not None and r.subject is not None and r.subject not in self.allowed_subjects:\n            self._run_key, self._run_n, self._best = None, 0, None\n            return \"Sheet is another subject\", None\n        key = decision_key(r)\n        sid = sheet_id(r)\n        tr = self._track if r.fused_frames else None\n        skey = (\"t\", tr.no) if tr is not None else sid\n        self._current = skey\n        seen = self._seen.setdefault(skey, {\"frames\": 0, \"committed\": False})\n        seen.update(sid=sid, serial=serial_of(r), student_id=r.student_id, subject=r.subject)\n        seen[\"frames\"] += 1\n        q = _quad(r)\n        if q is not None and self._prev_quad is not None and self._committed_key is not None:\n            (x0, y0, s0), (x1, y1, s1) = self._prev_quad, q\n            if ((x1 - x0) ** 2 + (y1 - y0) ** 2) ** 0.5 > JUMP_FRACTION * max(s0, s1) or abs(s1 - s0) > SCALE_JUMP * max(s0, s1):\n                self._interrupted = True\n        self._prev_quad = q\n        if key == self._run_key:\n            self._run_n += 1\n        else:\n            self._run_key, self._run_n, self._best = key, 1, None\n        sharp = float((r.quality or {}).get(\"sharpness\", 0.0))\n        if self._best is None or sharp > self._best[0]:\n            self._best = (sharp, r, payload, t)\n        if tr is not None and tr.committed:\n            return \"\", None                         # one commit per track, however the fused reading evolves\n        committed_here = self.state == COOLDOWN and self._committed_key is not None\n        if committed_here:\n            if self._interrupted:\n                same = key != self._committed_key and self._same_by_evidence(r)\n                if same:\n                    self._note_possible(skey, r)\n                if key == self._committed_key or same:   # same sheet put back / re-seen\n                    if self._run_n >= self.k:\n                        self._interrupted = False\n                    return \"\", None\n            elif not is_other_sheet(self._committed_key, key):\n                return \"\", None                     # same sheet still in view (maybe flickering)\n        if self._run_n < self.k:\n            return self._unstable_hint(r, t) if self.state != COOLDOWN else \"\", None\n        if tr is not None and (tr.id_unreadable() or tr.subject_unreadable()):   # stable, but may still resolve: hold while in view\n            if tr.held_since is None:\n                tr.held_since = t\n            if t - tr.held_since < self.hold_s:\n                return \"Reading the student ID...\", None\n        best = self._pick()\n        commit = self._do_commit(self._finalize(best[1]), best[2], best[3], key, self._run_n, tr)\n        return \"\", commit\n\n    def _same_by_evidence(self, r) -> bool:\n        \"\"\"After an interruption: a re-sighting whose ID is only partly readable but whose readable digits\n        (at least half) all agree with the committed sheet's ID, with IDENTICAL decisions on every answer and\n        equal serials (when either side has one), is treated as that sheet put back.  Never silent: the caller\n        records it as \"possibly the same sheet\" in the missed report.  No readable digit = no evidence: it\n        commits (a missed sheet is worse than an extra commit).\"\"\"\n        c = self._committed_res\n        if c is None or c.student_id is None or r.student_id is not None or (c.form_key, c.page) != (r.form_key, r.page):\n            return False\n        if r.subject is not None and r.subject != c.subject:\n            return False                            # a readable, different subject code is another sheet\n        if (r.serial is not None or c.serial is not None) and r.serial != c.serial:\n            return False\n        if all(d.value is not None for d in r.id_digits):\n            return False                            # (inconsistent: an ID that is fully read would not be None)\n        read = [(d.index, d.value) for d in r.id_digits if d.value is not None]\n        if len(read) * 2 < len(c.id_digits) or any(c.student_id[i] != str(v) for i, v in read if i < len(c.student_id)):\n            return False\n        return [(a.number, a.state, a.marked) for a in c.answers] == [(a.number, a.state, a.marked) for a in r.answers]\n\n    def _note_possible(self, skey, r) -> None:\n        \"\"\"A commit was suppressed by `_same_by_evidence`: keep it visible (missed report + event).\"\"\"\n        info = self._seen.get(skey)\n        if info is not None:\n            info[\"possibly_same_as\"] = self._committed_res.student_id\n            info[\"student_id\"] = r.student_id\n\n    def _finalize(self, r):\n        \"\"\"The frame result chosen for the commit, carrying the track's latest fused decisions.\"\"\"\n        if r.fused_frames and self._track is not None:\n            return self._track.apply(r)\n        return r\n\n    def _pick(self):\n        \"\"\"Which frame to ingest.  Seam: fuse the agreeing frames' scores here instead of picking one.\"\"\"\n        return self._best\n\n    # ------------------------------------------------------------------ hints\n    def _stuck(self, t) -> bool:\n        return self._since is not None and (t - self._since) >= self.hint_after\n\n    def _unstable_hint(self, r, t) -> str:\n        if not self._stuck(t):\n            return \"Reading...\"\n        q = r.quality or {}\n        if r.student_id is None:\n            return \"Student ID not readable - hold still, check the ID marks\"\n        if r.subject is None:\n            return \"Subject code not readable - hold still, check the subject marks\"\n        if q.get(\"source_px_per_mm\", 99) < LOW_RES_PX_PER_MM:\n            return \"Move closer\"\n        if q.get(\"sharpness\", 1e9) < LOW_SHARPNESS:\n            return \"Hold still (blurry)\"\n        return \"Hold still - reading keeps changing (glare or shadow?)\"\n\n    def _bad_hint(self, r, t) -> str:\n        s = r.status\n        if s == \"unknown_form\":\n            return \"Unknown sheet (not created in this system)\"\n        if not self._stuck(t):\n            return \"Reading...\"\n        if s == \"bad_geometry\":\n            return \"Flatten the sheet and keep it square to the camera\"\n        if s == \"bad_meta\":\n            return \"Cannot read the header - move closer or reduce glare\"\n        if s == \"inconsistent\":\n            return \"Several sheets visible - show one sheet\"\n        return \"Hold still\"\n\n    def _absent_hint(self, r) -> str:\n        if r.status == \"partial\":\n            c = \",\".join(r.missing_corners)\n            return f\"Marker covered or out of frame ({c})\" if c else \"Marker covered or out of frame\"\n        return \"\"\n\n    # ------------------------------------------------------------------ overlay\n    def overlay(self, r) -> dict:\n        ov: Dict[str, Any] = {\"markers\": [[[round(x), round(y)] for x, y in q] for q in r.marker_corners.values()]}\n        if r.homography is not None:\n            try:\n                ov[\"sheet\"] = [[round(float(x)), round(float(y))] for x, y in\n                               r.image_points([[0, 0], [210, 0], [210, 297], [0, 297]])]\n            except Exception:\n                pass\n        if r.status == \"ok\" and r.homography is not None and r.bubble_centers_mm:\n            ov[\"bubbles\"], ov[\"bubble_r\"] = self._bubbles(r)\n        return ov\n\n    def _bubbles(self, r):\n        pts: List[Tuple[float, float]] = []\n        codes: List[int] = []\n        for a, row in zip(r.answers, r.bubble_centers_mm[\"answers\"]):\n            for k, p in enumerate(row):\n                pts.append(p)\n                if k in a.marked:\n                    codes.append(B_MULTI if a.state == \"multi\" else B_AMBIGUOUS if a.ambiguous else B_MARKED)\n                else:\n                    codes.append(B_AMBIGUOUS if a.ambiguous and a.scores and a.scores[k] > 0.1 else B_EMPTY)\n        for digits, rows in ((r.id_digits, r.bubble_centers_mm[\"id\"]),\n                             (r.subject_digits, r.bubble_centers_mm.get(\"subject\") or [])):\n            for d, row in zip(digits, rows):\n                for k, p in enumerate(row):\n                    pts.append(p)\n                    if d.value == k:\n                        codes.append(B_MARKED)\n                    elif d.ambiguous and d.scores and d.scores[k] > 0.1:\n                        codes.append(B_AMBIGUOUS)\n                    else:\n                        codes.append(B_EMPTY)\n        img = r.image_points(pts)\n        dia = DEFAULT_BUBBLE_MM\n        if r.page is not None:\n            try:\n                if r.form_id is not None:                                # legacy sheet: layout from the resolver\n                    lay = self.resolve_layout(r.form_id)\n                else:                                                    # self-describing: from the form_key\n                    from .layout import header_from_form_key\n                    from .recognize import layout_for_header\n                    lay = layout_for_header(header_from_form_key(r.form_key))\n                dia = lay.pages[r.page].bubble_diameter\n            except Exception:\n                pass\n        rad = max(1.5, 0.5 * dia * float((r.quality or {}).get(\"source_px_per_mm\", 3.0)))\n        return [[round(float(x)), round(float(y)), c] for (x, y), c in zip(img, codes)], round(rad, 1)\n", "omr_web.py": "\"\"\"Browser glue for the standalone scanner (runs inside Pyodide, next to the unmodified ``omr`` package).\n\n``Scanner.step`` mirrors ``_frame_step`` in app/main.py for the \"all subjects (auto)\" path of /ws/scan:\nrecognize(frame) -> StreamSession.feed(...) -> event.  What differs: no database (a commit is only\nsummarised, the caller keeps the results in memory), no JPEG round trip (the browser hands over raw RGBA),\nand no legacy-form lookup (resolve_layout=None: sheets describe themselves in their header).\nKeep it in sync with app/main.py::_frame_step when that changes.\n\"\"\"\nimport base64\nimport json\nimport time\n\nimport cv2\nimport numpy as np\n\nfrom omr.recognize import recognize\nfrom omr.stream import StreamSession\n\nMIN_FRAME_SIDE = 64      # same as app/main.py\n\n\ndef _clean(o):\n    if isinstance(o, dict):\n        return {k: _clean(v) for k, v in o.items() if not (isinstance(k, str) and k.endswith(\"_path\"))}\n    if isinstance(o, (list, tuple)):\n        return [_clean(v) for v in o]\n    if isinstance(o, np.generic):\n        return o.item()\n    return o\n\n\ndef summarize(result) -> dict:\n    \"\"\"Same fields as app/main.py::summarize, plus the marked labels per question (for display / CSV).\"\"\"\n    return {\"form_key\": result.form_key, \"page\": result.page, \"total_pages\": result.total_pages,\n            \"student_id\": result.student_id, \"subject\": result.subject, \"serial\": result.serial,\n            \"n_questions\": len(result.answers),\n            \"n_blank\": sum(1 for a in result.answers if a.state == \"blank\"),\n            \"n_multi\": sum(1 for a in result.answers if a.state == \"multi\"),\n            \"n_doubtful\": sum(1 for a in result.answers if a.ambiguous),\n            \"flags\": list(result.flags), \"needs_review\": result.needs_review,\n            \"sharpness\": (result.quality or {}).get(\"sharpness\"),\n            \"answers\": [{\"q\": a.number, \"state\": a.state, \"marked\": \"|\".join(a.labels[i] for i in a.marked),\n                         \"doubt\": bool(a.ambiguous)} for a in result.answers]}\n\n\ndef _digit_rows(digits, centers):\n    return [{\"state\": d.state, \"value\": d.value, \"doubt\": bool(d.ambiguous), \"scores\": d.scores,\n             \"centers\": centers[i]} for i, d in enumerate(digits) if i < len(centers)]\n\n\ndef detail(result) -> dict:\n    \"\"\"What the review view needs to show *where* a sheet is doubtful: the canonical (rectified) sheet as a JPEG\n    plus, per question / ID digit / subject digit, the bubble centres (mm), fill scores and the decision.\"\"\"\n    if result.warped is None:\n        return {}\n    ok, jpg = cv2.imencode(\".jpg\", result.warped, [cv2.IMWRITE_JPEG_QUALITY, 75])\n    if not ok:\n        return {}\n    bc, cal = result.bubble_centers_mm or {}, result.calibration or {}\n    ans = bc.get(\"answers\", [])\n    return {\"img\": base64.b64encode(jpg.tobytes()).decode(\"ascii\"), \"ppm\": result.px_per_mm,\n            \"t_lo\": cal.get(\"t_lo\"), \"t_hi\": cal.get(\"t_hi\"), \"id_t_lo\": cal.get(\"id_t_lo\"), \"id_t_hi\": cal.get(\"id_t_hi\"),\n            \"answers\": [{\"q\": a.number, \"state\": a.state, \"marked\": list(a.marked), \"labels\": list(a.labels),\n                         \"scores\": a.scores, \"doubt\": bool(a.ambiguous), \"centers\": ans[i]}\n                        for i, a in enumerate(result.answers) if i < len(ans)],\n            \"id\": _digit_rows(result.id_digits, bc.get(\"id\", [])),\n            \"subject\": _digit_rows(result.subject_digits, bc.get(\"subject\", []))}\n\n\nclass Scanner:\n    def __init__(self):\n        self.session = StreamSession(resolve_layout=None)\n\n    def reset(self):\n        self.session.reset()\n        self.session.reset_tracking()\n\n    def step_rgba(self, buf, w: int, h: int) -> str:\n        \"\"\"buf: RGBA bytes (memoryview / JsProxy Uint8Array) of a w x h frame.  Returns the event as JSON.\"\"\"\n        t0 = time.perf_counter()\n        if hasattr(buf, \"to_py\"):\n            buf = buf.to_py()\n        rgba = np.frombuffer(buf, np.uint8).reshape(h, w, 4)\n        img = cv2.cvtColor(rgba, cv2.COLOR_RGBA2BGR)\n        return json.dumps(self.step(img, t0))\n\n    def step(self, img, t0=None) -> dict:\n        session = self.session\n        t0 = time.perf_counter() if t0 is None else t0\n        if min(img.shape[:2]) < MIN_FRAME_SIDE:\n            w, h = int(img.shape[1]), int(img.shape[0])\n            return {\"state\": session.state, \"hint\": f\"Camera frame too small ({w}x{h})\", \"overlay\": {},\n                    \"error\": f\"frame too small: {w}x{h}\", \"w\": w, \"h\": h}\n        res = recognize(img, None)\n        ev = session.feed(res, time.monotonic(), payload=None)\n        ev[\"status\"] = res.status\n        ev[\"w\"], ev[\"h\"] = int(img.shape[1]), int(img.shape[0])\n        commit = ev.pop(\"commit\", None)\n        if commit is not None:\n            ev[\"commit\"] = {\"summary\": summarize(commit[\"result\"]), \"frames\": commit[\"frames\"], \"detail\": detail(commit[\"result\"])}\n        missed = session.missed()\n        if missed:\n            ev[\"missed\"] = missed\n        ev[\"ms\"] = {\"total\": round((time.perf_counter() - t0) * 1000, 1),\n                    \"recognize\": round(res.timing_ms.get(\"total\", 0), 1)}\n        return _clean(ev)\n\n\n_scanner = None\n\n\ndef init():\n    global _scanner\n    _scanner = Scanner()\n\n\ndef reset():\n    _scanner.reset()\n\n\ndef frame(buf, w, h):\n    return _scanner.step_rgba(buf, w, h)\n"}</script>
<script>
'use strict';
const PYODIDE_BASE = 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/';
const $ = id => document.getElementById(id);
const video = $('video'), ov = $('ov'), stage = $('stage'), ctx = ov.getContext('2d');
const grab = document.createElement('canvas');
const gctx = grab.getContext('2d', { willReadFrequently: true });
const COLORS = ['rgba(150,150,150,.55)', '#2ecc71', '#ff5252', '#f5a524'];   // empty, marked, multi, ambiguous
const TARGET_FPS = 8;
let stream = null, track = null, audio = null, running = false, ready = false;
let busy = false, lastOv = null, lastState = 'idle', lastSend = 0, torchOn = false, frameId = 0;
let sentDims = '-', frames = 0, fpsT = performance.now(), fps = 0, rtt = 0;
const scans = [];   // in-memory results of this page load

function beep() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = 1040; o.connect(g); g.connect(audio.destination);
  g.gain.setValueAtTime(0.2, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.18);
  o.start(); o.stop(audio.currentTime + 0.2);
}
function flash() { stage.classList.add('flash'); setTimeout(() => stage.classList.remove('flash'), 350); }
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function subjLabel(subject) { return subject === null || subject === undefined ? '과목? 미확인' : subject === '' ? '' : '과목 ' + subject; }

// ---- results list
function addScan(s, detail) {
  scans.push(s);
  const ans = s.answers.map(a => a.marked || '-').join(' ');
  const li = document.createElement('li');
  li.style.flexDirection = 'column';
  const flags = s.flags.length ? ` <span class="tag warn">${esc(s.flags.join(','))}<\/span>` : '';
  li.innerHTML = `<span><b>${esc(subjLabel(s.subject))}<\/b> ${s.subject === '' ? '' : '&middot;'} <b>${esc(s.student_id ?? '(번호 없음)')}<\/b> &middot; ${s.page + 1}${s.total_pages ? '/' + s.total_pages : ''}페이지` +
    (s.needs_review ? ' <span class="badge needs_review">확인 필요<\/span>' : '') + flags + `<\/span>` +
    `<span class="mut small" style="word-break:break-all">${esc(ans)}<\/span>`;
  if (detail && detail.img) { li.onclick = () => showDetail(s, detail); li.title = '탭하면 인식 상세'; li.innerHTML += '<span class="mut small">탭하여 인식 상세 보기 &rsaquo;<\/span>'; }
  $('recent').prepend(li);
  $('count').textContent = scans.length + '건'; $('csv').disabled = false;
}
const csvCell = v => { const s = v === null || v === undefined ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
$('csv').onclick = () => {
  const nq = Math.max(0, ...scans.flatMap(s => s.answers.map(a => a.q)));
  const head = ['time', 'subject', 'student_id', 'page', 'total_pages', 'serial', 'form_key', 'n_questions', 'n_blank', 'n_multi', 'n_doubtful', 'needs_review', 'flags'];
  for (let q = 1; q <= nq; q++) head.push('q' + q);
  const rows = [head].concat(scans.map(s => {
    const byQ = {}; s.answers.forEach(a => { byQ[a.q] = a.marked; });
    const r = [s.time, s.subject, s.student_id, s.page + 1, s.total_pages, s.serial, s.form_key, s.n_questions, s.n_blank, s.n_multi, s.n_doubtful, s.needs_review, s.flags.join(';')];
    for (let q = 1; q <= nq; q++) r.push(byQ[q] ?? '');
    return r;
  }));
  const blob = new Blob(['﻿' + rows.map(r => r.map(csvCell).join(',')).join('\n') + '\n'], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'streamomr_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
$('reset').onclick = () => { if (worker) worker.postMessage({ type: 'reset' }); };

// ---- per-scan detail: the rectified sheet cropped around each question, with the doubtful choices marked
const D_COL = { on: '#2ecc71', bad: '#ff5252', doubt: '#f5a524', off: 'rgba(120,120,120,.7)' };
const cl = n => '①②③④⑤⑥⑦⑧⑨'[n] || String(n + 1);
// per-choice verdict: on = counted as marked, bad = counted wrongly (multi) / doubtful, doubt = grey zone, off = empty
function verdicts(r, lo, hi, kind) {
  const marked = kind === 'q' ? r.marked : (r.state === 'blank' ? [] : r.scores.map((v, i) => i).filter(i => r.scores[i] === Math.max(...r.scores) && r.scores[i] >= lo));
  return r.scores.map((v, i) => {
    const isMarked = marked.includes(i);
    if (r.state === 'multi' && isMarked) return 'bad';
    if (isMarked) return r.doubt || v < hi ? 'doubt' : 'on';
    return v >= lo && v < hi && r.state !== 'blank' ? 'doubt' : (v >= lo && r.doubt ? 'doubt' : 'off');
  });
}
function rowStatus(r) {
  if (r.state === 'multi') return ['bad', '복수 마킹'];
  if (r.state === 'blank' && r.doubt) return ['doubt', '애매 (옅은 마킹?)'];
  if (r.state === 'blank') return ['doubt', '공란'];
  if (r.doubt) return ['doubt', '애매'];
  return ['', '정상'];
}
function chipsFor(r, vs, kind) {
  return '<div class="chips">' + r.scores.map((v, i) => `<span class="chip ${vs[i] === 'off' ? '' : vs[i]}">${kind === 'q' ? esc(r.labels[i] ?? cl(i)) : i} &middot; ${Math.round(v * 100)}%<\/span>`).join('') + '<\/div>';
}
function showDetail(s, d) {
  const img = new Image();
  img.onload = () => renderDetail(s, d, img);
  img.src = 'data:image/jpeg;base64,' + d.img;
}
// whole rectified sheet in one canvas: a ring on every bubble, a box + number around each doubtful row
function drawSheet(img, d, groups) {
  const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const c = cv.getContext('2d'), ppm = d.ppm; c.drawImage(img, 0, 0);
  groups.forEach(({ rows, kind, lo, hi }) => rows.forEach(r => {
    if (!r.centers.length) return;
    const [cls] = rowStatus(r), vs = verdicts(r, lo, hi, kind), rMM = bubbleR(r);
    r.centers.forEach(([x, y], i) => {
      c.lineWidth = (vs[i] === 'off' ? 3 : 10) * ppm / 6; c.strokeStyle = D_COL[vs[i]];
      c.beginPath(); c.arc(x * ppm, y * ppm, rMM * ppm * 1.25, 0, 6.2832); c.stroke();
    });
    if (!cls) return;
    const xs = r.centers.map(p => p[0]), ys = r.centers.map(p => p[1]);
    const x0 = (Math.min(...xs) - rMM - (kind === 'q' ? 6 : 1.5)) * ppm, y0 = (Math.min(...ys) - rMM - 1) * ppm;
    c.lineWidth = 8 * ppm / 6; c.strokeStyle = D_COL[cls]; c.strokeRect(x0, y0, (Math.max(...xs) + rMM + 2) * ppm - x0, (Math.max(...ys) + rMM + 1) * ppm - y0);
  }));
  return cv;
}
function bubbleR(r) {
  return Math.min(...r.centers.slice(1).map((c, i) => Math.hypot(c[0] - r.centers[i][0], c[1] - r.centers[i][1])), 8) * 0.38;
}
function renderDetail(s, d, img) {
  $('dtitle').textContent = `${subjLabel(s.subject)} ${s.student_id ?? '(번호 없음)'} · ${s.page + 1}페이지`;
  const body = $('dbody'); body.innerHTML = '';
  const q = { rows: d.answers, kind: 'q', lo: d.t_lo ?? 0.2, hi: d.t_hi ?? 0.5, name: r => `${r.q}번` };
  const idLo = d.id_t_lo ?? d.t_lo ?? 0.2, idHi = d.id_t_hi ?? d.t_hi ?? 0.5;
  const groups = [q, { rows: d.id, kind: 'id', lo: idLo, hi: idHi, name: (r, i) => `학번 ${i + 1}번째 자리` },
                  { rows: d.subject, kind: 'subject', lo: idLo, hi: idHi, name: (r, i) => `과목 코드 ${i + 1}번째 자리` }];
  if (s.flags.length) body.insertAdjacentHTML('beforeend', `<div class="small" style="margin:6px 0">플래그: <span class="tag warn">${esc(s.flags.join(', '))}<\/span><\/div>`);
  const cv = drawSheet(img, d, groups); cv.className = 'sheet'; body.appendChild(cv);
  body.insertAdjacentHTML('beforeend', '<div class="mut small">초록=인식됨 · 빨강=복수 마킹 · 주황=애매/공란 · 회색=빈 칸. 확대해서 보세요.<\/div>');
  const list = document.createElement('div'); let n = 0;
  groups.forEach(g => g.rows.forEach((r, i) => {
    const [cls, txt] = rowStatus(r);
    if (!cls || !r.centers.length) return;
    n++;
    const box = document.createElement('div'); box.className = 'qrow ' + cls;
    box.innerHTML = `<b>${g.name(r, i)}<\/b> <span class="${cls === 'bad' ? 'err' : 'mut'}">${txt}<\/span>` + chipsFor(r, verdicts(r, g.lo, g.hi, g.kind), g.kind);
    list.appendChild(box);
  }));
  list.insertAdjacentHTML('afterbegin', `<b>${n ? '확인할 항목 ' + n + '개' : '문제 있는 항목 없음'}<\/b>`);
  body.appendChild(list);
  $('detail').hidden = false;
}
$('dclose').onclick = () => { $('detail').hidden = true; };
$('detail').onclick = ev => { if (ev.target === $('detail')) $('detail').hidden = true; };

// ---- overlay (same drawing as the server-based scanner)
function draw() {
  const dpr = window.devicePixelRatio || 1, cw = stage.clientWidth, ch = stage.clientHeight;
  if (ov.width !== Math.round(cw * dpr) || ov.height !== Math.round(ch * dpr)) { ov.width = Math.round(cw * dpr); ov.height = Math.round(ch * dpr); }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, ov.width, ov.height);
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !lastOv) return;
  const s = Math.min(cw / vw, ch / vh), ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
  const lw = 2 / s;
  if (lastOv.sheet) { ctx.strokeStyle = lastState === 'detecting' ? '#f5a524' : '#4dabf7'; ctx.lineWidth = lw; poly(lastOv.sheet); }
  ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = lw * 1.5;
  (lastOv.markers || []).forEach(poly);
  const r = lastOv.bubble_r || 4;
  (lastOv.bubbles || []).forEach(([x, y, c]) => {
    ctx.fillStyle = COLORS[c]; ctx.beginPath(); ctx.arc(x, y, c ? r * 0.8 : r * 0.25, 0, 6.2832); ctx.fill();
  });
}
function poly(p) { ctx.beginPath(); p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.stroke(); }
function renderLoop() { draw(); requestAnimationFrame(renderLoop); }

// ---- camera
async function listCameras() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const cur = track && track.getSettings().deviceId;
  $('cam').innerHTML = devs.map((d, i) => `<option value="${esc(d.deviceId)}" ${d.deviceId === cur ? 'selected' : ''}>${esc(d.label || 'Camera ' + (i + 1))}<\/option>`).join('');
}
async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const dev = $('cam').value;
  const video_c = { width: { ideal: 1920 }, height: { ideal: 1080 } };
  if (dev) video_c.deviceId = { exact: dev }; else video_c.facingMode = { ideal: 'environment' };   // first start: rear camera
  stream = await navigator.mediaDevices.getUserMedia({ video: video_c, audio: false });
  track = stream.getVideoTracks()[0];
  video.srcObject = stream; await video.play();
  // Safari can resolve play() before the first frame: videoWidth/Height stay 0 until metadata and a frame arrive
  for (let i = 0; i < 50 && !video.videoWidth; i++) await new Promise(r => setTimeout(r, 100));
  await listCameras();
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  $('torch').hidden = !caps.torch; torchOn = false;
}
$('torch').onclick = async () => {
  torchOn = !torchOn;
  try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch (e) { torchOn = false; }
};
$('cam').onchange = () => { if (running) openCamera().catch(showErr); };
video.addEventListener('resize', () => stage.classList.toggle('portrait', video.videoHeight > video.videoWidth));

// ---- worker (Pyodide) and the one-frame-in-flight loop
let worker = null;
function startWorker() {
  const src = $('worker-src').textContent;
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  worker.onmessage = ev => {
    const m = ev.data;
    if (m.type === 'progress') { $('loadmsg').textContent = m.text; }
    else if (m.type === 'ready') { ready = true; $('loading').hidden = true; $('start').disabled = false; $('hint').textContent = '시작을 누르세요'; }
    else if (m.type === 'error') { $('loadtitle').textContent = '불러오기 실패'; $('loadmsg').textContent = m.text; $('hint').textContent = '불러오기 실패: ' + m.text; }
    else if (m.type === 'result') onResult(JSON.parse(m.json), m.ms);
  };
  worker.postMessage({ type: 'init', sources: JSON.parse($('omr-src').textContent), pyodideBase: PYODIDE_BASE });
}
function onResult(e, wms) {
  rtt = performance.now() - lastSend; busy = false; frames++;
  lastOv = e.overlay; lastState = e.state;
  $('state').textContent = e.state; $('state').className = 'state ' + e.state;
  $('hint').textContent = e.error || e.hint || '';
  const mm = $('missed'), ms = e.missed || [];
  mm.hidden = !ms.length;
  mm.textContent = ms.length ? '놓친 시트 있음: ' + ms.map(m => (m.serial ? 'No. ' + String(m.serial).padStart(4, '0') : '번호 없음 ' + (m.student_id || '?')) + ` (${m.page + 1}페이지)` + (m.possibly_same_as ? ` - ${m.possibly_same_as}와 같은 시트일 수 있음` : '')).join(', ') + ' - 다시 보여 주세요' : '';
  if (e.commit) {
    const s = e.commit.summary; s.time = new Date().toISOString();
    beep(); flash(); addScan(s, e.commit.detail);
    $('res').textContent = `${subjLabel(s.subject)} · ${s.student_id ?? '(번호 없음)'}`;
    if (navigator.vibrate) navigator.vibrate(60);
  }
  const now = performance.now();
  if (now - fpsT > 1000) { fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; }
  $('stats').textContent = `${fps.toFixed(1)} fps - 프레임당 ${rtt.toFixed(0)} ms (인식 ${e.ms ? e.ms.recognize : '?'} ms) - 카메라 ${video.videoWidth}x${video.videoHeight} - 처리 ${sentDims}`;
  pump();
}
function pump() {
  if (!running || busy) return;
  const wait = Math.max(0, 1000 / TARGET_FPS - (performance.now() - lastSend));
  busy = true;
  setTimeout(sendFrame, wait);
}
function sendFrame() {
  if (!running) { busy = false; return; }
  // Never process a frame before the real size is known (a 0x0 canvas gives Safari a blank/1x1 image).
  // Frames are used exactly as the camera delivers them: never mirrored (any selfie flip is CSS-only).
  const st = track && track.getSettings ? track.getSettings() : {};
  const w = video.videoWidth || st.width || 0, h = video.videoHeight || st.height || 0;
  if (!w || !h) { setTimeout(sendFrame, 100); return; }   // stay busy and retry
  grab.width = w; grab.height = h;
  gctx.drawImage(video, 0, 0, w, h);
  const data = gctx.getImageData(0, 0, w, h).data;      // RGBA
  sentDims = `${w}x${h}`;
  lastSend = performance.now();
  worker.postMessage({ type: 'frame', id: ++frameId, buf: data.buffer, w, h }, [data.buffer]);
}
function showErr(e) { $('hint').textContent = '카메라 오류: ' + (e && e.message || e) + (location.protocol === 'http:' && location.hostname !== 'localhost' ? ' (휴대폰은 https 필요)' : ''); }

$('start').onclick = async () => {
  if (running) { running = false; if (stream) stream.getTracks().forEach(t => t.stop()); $('start').textContent = '시작'; return; }
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') await audio.resume();
    await openCamera(); running = true; busy = false; $('start').textContent = '중지';
    worker.postMessage({ type: 'reset' });
    stage.classList.toggle('portrait', video.videoHeight > video.videoWidth);
    pump();
  } catch (e) { showErr(e); }
};

if (!navigator.mediaDevices) $('hint').textContent = '카메라를 사용할 수 없습니다. https 또는 localhost 로 접속하세요.';
renderLoop();
startWorker();

</script>
</body></html>
