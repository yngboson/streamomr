<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamOMR - 단독 스캐너</title>
<style>
:root { --bg:#111418; --fg:#e8eaed; --mut:#9aa0a6; --card:#1c2128; --ok:#2ecc71; --warn:#f5a524; --bad:#ff5252; --info:#4dabf7; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
a { color:var(--info); }
h1 { font-size:20px; margin:0 0 12px; }
.card { background:var(--card); border-radius:10px; padding:14px; margin:0 0 14px; }
label { display:block; margin:6px 0; color:var(--mut); }
input, select, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid #3a4250; background:#0d1014; color:var(--fg); }
button { background:#2b6cb0; border-color:#2b6cb0; cursor:pointer; }
button.secondary { background:#2a313b; border-color:#3a4250; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.scan { display:grid; grid-template-columns:minmax(0,2fr) minmax(220px,1fr); gap:14px; padding:12px; }
@media (max-width:760px) { .scan { grid-template-columns:1fr; padding:8px; } }
.stage { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:16/9; max-height:80vh; width:100%; }
.stage.portrait { aspect-ratio:9/16; max-width:60vh; margin:0 auto; }
.stage video, .stage canvas { position:absolute; inset:0; width:100%; height:100%; }
.stage video { object-fit:contain; }
.stage.flash { box-shadow:0 0 0 6px var(--ok) inset; }
.stage.fb-ok { box-shadow:0 0 0 6px var(--ok) inset; }
.stage.fb-minor { box-shadow:0 0 0 10px var(--warn) inset; }
.stage.fb-severe { box-shadow:0 0 0 14px var(--bad) inset; }
.banner .fixbtn { margin-left:8px; padding:3px 10px; border-radius:6px; border:0; font-weight:700; cursor:pointer; color:#000; }
.banner .fixbtn.minor { background:var(--warn); } .banner .fixbtn.severe { background:var(--bad); }
.banner { position:absolute; left:0; right:0; top:0; padding:6px 10px; font-weight:600; background:rgba(0,0,0,.55); display:flex; justify-content:space-between; gap:8px; }
.banner .state { text-transform:uppercase; letter-spacing:.05em; }
.state.idle { color:var(--mut); } .state.detecting { color:var(--warn); } .state.committed, .state.cooldown { color:var(--ok); }
.hint { position:absolute; left:0; right:0; bottom:0; padding:8px 10px; background:rgba(0,0,0,.6); }
.stats { color:var(--mut); font-size:13px; margin-top:6px; }
ul.scans { list-style:none; padding:0; margin:0; max-height:70vh; overflow:auto; }
ul.scans li { display:flex; justify-content:space-between; gap:8px; padding:8px 4px; border-bottom:1px solid #2a313b; }
.badge { padding:1px 8px; border-radius:99px; font-size:12px; font-weight:600; color:#000; }
.badge.new { background:var(--ok); } .badge.duplicate { background:var(--info); } .badge.conflict { background:var(--bad); }
.badge.unassigned { background:var(--warn); } .badge.moved { background:#b794f4; } .badge.rejected, .badge.unchanged { background:#888; }
.mut { color:var(--mut); } .small { font-size:13px; }
.err { color:var(--bad); } .okmsg { color:var(--ok); }
button:disabled { opacity:.5; cursor:default; }
button.danger { background:#a33; border-color:#a33; }
button.small, .btn-s { padding:3px 9px; font-size:13px; }
input[type=number], input[type=text] { max-width:100%; }
.stats-row { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
.badge.complete { background:var(--ok); } .badge.incomplete { background:var(--warn); }
.badge.needs_review { background:#f0d54a; } .badge.minor { background:var(--info); }
.badge.ok { background:var(--ok); } .badge.bad { background:var(--bad); } .badge.none { background:#888; }
.tag { font-size:12px; padding:0 6px; border-radius:5px; background:#2a313b; margin-left:4px; }
.tag.warn { background:var(--warn); color:#000; } .tag.ovr { background:var(--info); color:#000; }
.card.conf { border-left:4px solid var(--bad); } .card.sel { outline:2px solid var(--ok); }
.loading { position:fixed; inset:0; background:rgba(17,20,24,.96); display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; z-index:10; }
.loading[hidden] { display:none; }
.tag.warn { background:var(--warn); color:#000; }
.badge.needs_review { background:#f0d54a; }

ul.scans li { cursor:pointer; } ul.scans li:active { background:#232a33; }
</style></head>
<body>
<div class="scan">
  <div>
    <div class="row" style="margin-bottom:8px">
      <select id="cam"></select>
      <button id="start" disabled>시작</button>
      <button id="torch" class="secondary" hidden>플래시</button>
      <button id="reset" class="secondary">초기화</button>
    </div>
    <div class="stage" id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="ov"></canvas>
      <div class="banner"><span class="state idle" id="state">대기</span><span id="res"></span></div>
      <div class="hint" id="hint">불러오는 중...</div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="missed" class="err" style="font-weight:bold;margin-top:6px" hidden></div>
  </div>
  <div class="card">
    <h1>최근 스캔</h1>
    <div class="row" style="margin-bottom:8px"><button id="csv" class="secondary" disabled>CSV 다운로드</button><span class="mut small" id="count">0건</span></div>
    <ul class="scans" id="recent"></ul>
  </div>
</div>
<div id="loading" class="loading"><div><b id="loadtitle">StreamOMR 불러오는 중</b><div id="loadmsg" class="mut"></div><div class="mut small">처음 한 번 약 30MB를 내려받습니다 (이후엔 캐시).</div></div></div>
<script type="text/plain" id="worker-src">// Web Worker: Pyodide + the omr package.  Messages in: {type:'init', sources, pyodideBase} | {type:'frame', id, buf, w, h} | {type:'reset'}
// Messages out: {type:'progress', text} | {type:'ready'} | {type:'error', text} | {type:'result', id, json, ms}
let py = null, pyFrame = null, pyReset = null;
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === 'init') {
    try {
      const say = text => self.postMessage({ type: 'progress', text });
      say('Pyodide 런타임 내려받는 중 (약 10MB)...');
      importScripts(m.pyodideBase + 'pyodide.js');
      py = await loadPyodide({ indexURL: m.pyodideBase });
      say('numpy / OpenCV 내려받는 중 (약 15MB)...');
      await py.loadPackage(['numpy', 'opencv-python'], { messageCallback: say, errorCallback: say });
      say('인식 코드 적재 중...');
      py.FS.mkdirTree('/pkg/omr');
      for (const [name, src] of Object.entries(m.sources)) py.FS.writeFile('/pkg/' + name, src);
      py.runPython("import sys; sys.path.insert(0, '/pkg')");
      py.runPython('import omr_web; omr_web.init()');
      const mod = py.pyimport('omr_web');
      pyFrame = mod.frame; pyReset = mod.reset;
      self.postMessage({ type: 'ready' });
    } catch (err) { self.postMessage({ type: 'error', text: String(err && err.message || err) }); }
  } else if (m.type === 'frame') {
    const t0 = performance.now(), rx = performance.timeOrigin + t0;   // rx - m.tx = transfer + queue wait (epoch clocks)
    const t = () => ({ xfer: rx - m.tx, worker: performance.now() - t0, tx: performance.timeOrigin + performance.now() });
    try {
      const json = pyFrame(new Uint8Array(m.buf), m.w, m.h);
      self.postMessage({ type: 'result', id: m.id, json, ms: performance.now() - t0, t: t() });
    } catch (err) { self.postMessage({ type: 'result', id: m.id, json: JSON.stringify({ state: 'idle', hint: '', overlay: {}, error: String(err && err.message || err) }), ms: performance.now() - t0, t: t() }); }
  } else if (m.type === 'reset' && pyReset) pyReset();
};
</script>
<script type="application/json" id="omr-src">{"omr/__init__.py": "", "omr/markers.py": "\"\"\"ArUco corner markers and the metadata bit strip codec.\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import List, Optional\n\nimport cv2\nimport numpy as np\n\nARUCO_DICT_NAME = \"DICT_4X4_50\"\nMAX_PAGES = 12  # 4 ids per page, 50 ids in the dictionary -> 12 pages\nCORNERS = (\"TL\", \"TR\", \"BR\", \"BL\")  # id offsets 0..3\n\nMETA_FORM_BITS = 16\nMETA_PAGE_BITS = 4\nMETA_TOTAL_BITS = 4\nMETA_CRC_BITS = 8\nSTART_GUARD = (True, False, True, False)\nSTOP_GUARD = (False, True, False, True)\nMETA_CELLS = len(START_GUARD) + META_FORM_BITS + META_PAGE_BITS + META_TOTAL_BITS + META_CRC_BITS + len(STOP_GUARD)\n\n\ndef aruco_dictionary():\n    return cv2.aruco.getPredefinedDictionary(getattr(cv2.aruco, ARUCO_DICT_NAME))\n\n\ndef marker_id(page: int, corner: str) -> int:\n    if not 0 <= page < MAX_PAGES:\n        raise ValueError(f\"page index {page} out of range 0..{MAX_PAGES - 1}\")\n    return 4 * page + CORNERS.index(corner)\n\n\ndef decode_marker_id(mid: int) -> tuple[int, str]:\n    \"\"\"marker id -> (page index, corner name).\"\"\"\n    if not 0 <= mid < 4 * MAX_PAGES:\n        raise ValueError(mid)\n    return mid // 4, CORNERS[mid % 4]\n\n\ndef marker_bits(mid: int) -> np.ndarray:\n    \"\"\"Marker pattern incl. black border as a (k x k) bool array, True = black.\"\"\"\n    img = np.zeros((6, 6), np.uint8)\n    img = cv2.aruco.generateImageMarker(aruco_dictionary(), mid, 6, img, 1)\n    return img < 128\n\n\ndef marker_image(mid: int, px: int = 200, quiet_cells: int = 1) -> np.ndarray:\n    \"\"\"Grayscale uint8 image of the marker with a white quiet zone (in marker cells).\"\"\"\n    bits = marker_bits(mid)\n    k = bits.shape[0]\n    cell = max(1, px // k)\n    big = np.kron(~bits, np.ones((cell, cell), bool)).astype(np.uint8) * 255\n    q = quiet_cells * cell\n    return np.pad(big, q, constant_values=255)\n\n\n# ---------------------------------------------------------------- metadata strip\n@dataclass(frozen=True)\nclass Meta:\n    form_id: int\n    page: int  # 0-based\n    total_pages: int\n\n\ndef crc8(data: bytes, poly: int = 0x07) -> int:\n    crc = 0\n    for b in data:\n        crc ^= b\n        for _ in range(8):\n            crc = ((crc << 1) ^ poly) & 0xFF if crc & 0x80 else (crc << 1) & 0xFF\n    return crc\n\n\ndef _payload_bytes(form_id: int, page: int, total_pages: int) -> bytes:\n    return bytes([form_id >> 8, form_id & 0xFF, (page << 4) | total_pages])\n\n\ndef _int_bits(v: int, n: int) -> List[bool]:\n    return [bool((v >> (n - 1 - i)) & 1) for i in range(n)]\n\n\ndef _bits_int(bits) -> int:\n    v = 0\n    for b in bits:\n        v = (v << 1) | int(bool(b))\n    return v\n\n\ndef encode_meta(form_id: int, page: int, total_pages: int) -> List[bool]:\n    if not 0 <= form_id < 1 << META_FORM_BITS:\n        raise ValueError(\"form_id must be 16 bit\")\n    if not 1 <= total_pages <= MAX_PAGES:\n        raise ValueError(f\"total_pages must be 1..{MAX_PAGES}\")\n    if not 0 <= page < total_pages:\n        raise ValueError(\"page must be in 0..total_pages-1\")\n    crc = crc8(_payload_bytes(form_id, page, total_pages))\n    return (list(START_GUARD) + _int_bits(form_id, META_FORM_BITS) + _int_bits(page, META_PAGE_BITS)\n            + _int_bits(total_pages, META_TOTAL_BITS) + _int_bits(crc, META_CRC_BITS) + list(STOP_GUARD))\n\n\ndef decode_meta(bits) -> Optional[Meta]:\n    \"\"\"Decode META_CELLS bits (True = black). None on guard/checksum/range failure.\"\"\"\n    bits = [bool(b) for b in bits]\n    if len(bits) != META_CELLS:\n        return None\n    g = len(START_GUARD)\n    if tuple(bits[:g]) != START_GUARD or tuple(bits[-len(STOP_GUARD):]) != STOP_GUARD:\n        return None\n    i = g\n    form = _bits_int(bits[i:i + META_FORM_BITS]); i += META_FORM_BITS\n    page = _bits_int(bits[i:i + META_PAGE_BITS]); i += META_PAGE_BITS\n    total = _bits_int(bits[i:i + META_TOTAL_BITS]); i += META_TOTAL_BITS\n    crc = _bits_int(bits[i:i + META_CRC_BITS])\n    if crc != crc8(_payload_bytes(form, page, total)):\n        return None\n    if not (1 <= total <= MAX_PAGES and page < total):\n        return None\n    return Meta(form, page, total)\n\n\n# ---------------------------------------------------------------- serial strip (per printed copy)\nSERIAL_BITS = 12\nSERIAL_MAX = (1 << SERIAL_BITS) - 1   # 4095; 0 = \"no serial\" (plain master PDF: nothing is printed)\nSERIAL_CRC_BITS = 8\nSERIAL_CELLS = len(START_GUARD) + SERIAL_BITS + SERIAL_CRC_BITS + len(STOP_GUARD)\n_SERIAL_TAG = 0x5A   # domain separation from the meta strip's CRC\n\n\ndef _serial_payload(serial: int) -> bytes:\n    return bytes([_SERIAL_TAG, serial >> 8, serial & 0xFF])\n\n\ndef encode_serial(serial: int) -> List[bool]:\n    \"\"\"Cells of the serial strip (True = black) for 1..SERIAL_MAX.\"\"\"\n    if not 1 <= serial <= SERIAL_MAX:\n        raise ValueError(f\"serial must be 1..{SERIAL_MAX}\")\n    return (list(START_GUARD) + _int_bits(serial, SERIAL_BITS)\n            + _int_bits(crc8(_serial_payload(serial)), SERIAL_CRC_BITS) + list(STOP_GUARD))\n\n\ndef decode_serial(bits) -> Optional[int]:\n    \"\"\"SERIAL_CELLS bits -> serial (1..SERIAL_MAX), or None on guard/checksum failure.\"\"\"\n    bits = [bool(b) for b in bits]\n    if len(bits) != SERIAL_CELLS:\n        return None\n    g = len(START_GUARD)\n    if tuple(bits[:g]) != START_GUARD or tuple(bits[-len(STOP_GUARD):]) != STOP_GUARD:\n        return None\n    v = _bits_int(bits[g:g + SERIAL_BITS])\n    crc = _bits_int(bits[g + SERIAL_BITS:g + SERIAL_BITS + SERIAL_CRC_BITS])\n    if v == 0 or crc != crc8(_serial_payload(v)):\n        return None\n    return v\n\n\n# ---------------------------------------------------------------- self-describing header (format v1)\n# The header says how to read the sheet: no database is needed to recognise it.  Two rows of cells, each row\n# START guard + 32 data cells + STOP guard.  The 64 data bits are a 48-bit payload + CRC-16, XOR-whitened with a\n# fixed pattern (no long white / black runs, whatever the payload).  Guards differ from the legacy meta strip's,\n# so neither decoder accepts the other's strip.\nHEADER_VERSIONS = (1, 2)    # 1: plain sheet; 2: also printed with timing tracks (ticks along the four edges, see omr.layout)\nHEADER_VERSION = 2          # what new sheets are printed as\nHEADER_START_GUARD = (True, True, False, True)\nHEADER_STOP_GUARD = (True, False, True, True)\nHEADER_ROWS = 2\nHEADER_ROW_DATA = 32\nHEADER_ROW_CELLS = len(HEADER_START_GUARD) + HEADER_ROW_DATA + len(HEADER_STOP_GUARD)\nLABEL_STYLES = (\"1\", \"A\", \"a\", \"가\")          # choice labels \"1 2 3 ..\", \"A B C ..\", \"a b c ..\", \"가 나 다 ..\"\n_HANGUL_LABELS = \"가나다라마바사아자차\"\nBUBBLE_BASE_MM, BUBBLE_STEP_MM = 4.0, 0.25    # min bubble = base + step * class (class 0..7)\n# (name, bits): field order of the payload\n_HEADER_FIELDS = ((\"version\", 3), (\"questions\", 10), (\"used\", 10), (\"choices\", 4), (\"id_digits\", 4),\n                  (\"subject_digits\", 2), (\"pages\", 4), (\"page\", 4), (\"labels\", 2), (\"bubble\", 3), (\"reserved\", 2))\n_HEADER_PAYLOAD_BITS = sum(b for _, b in _HEADER_FIELDS)\nassert _HEADER_PAYLOAD_BITS + 16 == HEADER_ROWS * HEADER_ROW_DATA\n_WHITEN = [bool(b) for b in np.random.default_rng(0x0A11CE).integers(0, 2, HEADER_ROWS * HEADER_ROW_DATA)]\n_HEADER_TAG = b\"OMR1\"                          # domain separation for the CRC\n\n\n@dataclass(frozen=True)\nclass Header:\n    questions: int          # questions printed on the form (all pages)\n    used: int               # questions actually used (1..questions); the rest are not printed / not read\n    choices: int\n    id_digits: int\n    subject_digits: int     # 0..3 (marked subject code next to the student ID)\n    pages: int\n    page: int               # 0-based\n    labels: int = 0         # index into LABEL_STYLES\n    bubble: int = 0         # min bubble class: BUBBLE_BASE_MM + BUBBLE_STEP_MM * bubble\n    version: int = HEADER_VERSION\n\n    @property\n    def form_key(self) -> str:\n        \"\"\"Identity of the printed form (everything but the page index): equal on every page of one form.\"\"\"\n        return (f\"Q{self.questions}U{self.used}C{self.choices}D{self.id_digits}S{self.subject_digits}\"\n                f\"P{self.pages}L{self.labels}B{self.bubble}V{self.version}\")\n\n    def choice_labels(self) -> List[str]:\n        return choice_labels(self.labels, self.choices)\n\n\ndef choice_labels(style: int, n: int) -> List[str]:\n    s = LABEL_STYLES[style]\n    if s == \"1\":\n        return [str(i + 1) for i in range(n)]\n    if s == \"가\":\n        return list(_HANGUL_LABELS[:n])\n    return [chr(ord(s) + i) for i in range(n)]\n\n\ndef label_style(labels: List[str]) -> Optional[int]:\n    \"\"\"Style index of a label list, or None if it is not one of LABEL_STYLES.\"\"\"\n    for i in range(len(LABEL_STYLES)):\n        if len(labels) <= (len(_HANGUL_LABELS) if LABEL_STYLES[i] == \"가\" else 26) and choice_labels(i, len(labels)) == list(labels):\n            return i\n    return None\n\n\ndef crc16(data: bytes, poly: int = 0x1021, init: int = 0xFFFF) -> int:\n    \"\"\"CRC-16/CCITT-FALSE.\"\"\"\n    crc = init\n    for b in data:\n        crc ^= b << 8\n        for _ in range(8):\n            crc = ((crc << 1) ^ poly) & 0xFFFF if crc & 0x8000 else (crc << 1) & 0xFFFF\n    return crc\n\n\ndef _header_payload(h: Header) -> List[bool]:\n    vals = {\"version\": h.version, \"questions\": h.questions, \"used\": h.used, \"choices\": h.choices,\n            \"id_digits\": h.id_digits, \"subject_digits\": h.subject_digits, \"pages\": h.pages, \"page\": h.page,\n            \"labels\": h.labels, \"bubble\": h.bubble, \"reserved\": 0}\n    out: List[bool] = []\n    for name, n in _HEADER_FIELDS:\n        v = vals[name]\n        if not 0 <= v < 1 << n:\n            raise ValueError(f\"header field {name}={v} does not fit in {n} bits\")\n        out += _int_bits(v, n)\n    return out\n\n\ndef _bits_bytes(bits) -> bytes:\n    bits = list(bits) + [False] * (-len(bits) % 8)\n    return bytes(_bits_int(bits[i:i + 8]) for i in range(0, len(bits), 8))\n\n\ndef validate_header(h: Header) -> None:\n    if h.version not in HEADER_VERSIONS:\n        raise ValueError(f\"unsupported header version {h.version}\")\n    if not 1 <= h.used <= h.questions:\n        raise ValueError(\"used must be 1..questions\")\n    if not 2 <= h.choices <= 10 or not 1 <= h.id_digits <= 12 or not 0 <= h.subject_digits <= 3:\n        raise ValueError(\"choices / id_digits / subject_digits out of range\")\n    if not 1 <= h.pages <= MAX_PAGES or not 0 <= h.page < h.pages:\n        raise ValueError(\"pages / page out of range\")\n    if h.labels >= len(LABEL_STYLES) or not 0 <= h.bubble < 8:\n        raise ValueError(\"labels / bubble out of range\")\n\n\ndef encode_header(h: Header) -> List[List[bool]]:\n    \"\"\"Cells (True = black) of the header rows, guards included.\"\"\"\n    validate_header(h)\n    pay = _header_payload(h)\n    data = pay + _int_bits(crc16(_HEADER_TAG + _bits_bytes(pay)), 16)\n    data = [b ^ w for b, w in zip(data, _WHITEN)]\n    rows = []\n    for r in range(HEADER_ROWS):\n        rows.append(list(HEADER_START_GUARD) + data[r * HEADER_ROW_DATA:(r + 1) * HEADER_ROW_DATA] + list(HEADER_STOP_GUARD))\n    return rows\n\n\ndef decode_header_data(data) -> Optional[Header]:\n    \"\"\"64 data bits (guards stripped, still whitened) -> Header, or None on CRC / range failure.\"\"\"\n    data = [bool(b) ^ w for b, w in zip(data, _WHITEN)]\n    if len(data) != HEADER_ROWS * HEADER_ROW_DATA:\n        return None\n    pay, crc = data[:_HEADER_PAYLOAD_BITS], _bits_int(data[_HEADER_PAYLOAD_BITS:])\n    if crc != crc16(_HEADER_TAG + _bits_bytes(pay)):\n        return None\n    vals, i = {}, 0\n    for name, n in _HEADER_FIELDS:\n        vals[name] = _bits_int(pay[i:i + n])\n        i += n\n    if vals.pop(\"reserved\") != 0:\n        return None\n    h = Header(**vals)\n    try:\n        validate_header(h)\n    except ValueError:\n        return None\n    return h\n\n\ndef decode_header(rows) -> Optional[Header]:\n    \"\"\"Rows of cells (guards included) -> Header, or None.\"\"\"\n    g0, g1 = len(HEADER_START_GUARD), len(HEADER_STOP_GUARD)\n    data = []\n    for row in rows:\n        row = [bool(b) for b in row]\n        if len(row) != HEADER_ROW_CELLS or tuple(row[:g0]) != HEADER_START_GUARD or tuple(row[-g1:]) != HEADER_STOP_GUARD:\n            return None\n        data += row[g0:-g1]\n    return decode_header_data(data)\n", "omr/layout.py": "\"\"\"Template params -> Layout. All coordinates in mm, page-relative, origin top-left.\n\nThe Layout is the single source of truth for both the PDF renderer and the\nrecognizer. Rect = [x, y, w, h]. Text y is the baseline.\n\"\"\"\nfrom __future__ import annotations\n\nimport dataclasses\nimport json\nimport math\nimport re\nimport typing\nfrom dataclasses import dataclass, field\nfrom typing import List, Optional\n\nfrom . import markers as mk\n\n# ------------------------------------------------------------------ design constants\nPAGE_W, PAGE_H = 210.0, 297.0\nMARGIN = 8.0\nMARKER_MM = 16.0\nQUIET_MM = 3.0\nMETA_CELL_W, META_CELL_H, META_Y = 3.6, 4.5, 9.0        # legacy single-row meta strip (form id only)\nHEADER_CELL_W, HEADER_ROW_H = 3.6, 4.0                 # self-describing header: 2 rows\nHEADER_ROW_Y = (8.0, 13.5)                             # 1.5 mm white gap between rows (and above / below): local paper level\nTITLE_Y = 23.5\nSUBJ_GAP = 7.0                                         # ID grid -> subject grid (room for its row labels)\nSERIAL_CELL_W, SERIAL_CELL_H, SERIAL_Y = 3.6, 4.5, 275.0   # footer strip, right end kept clear of the BR marker\nSERIAL_CLEARANCE = 6.0   # mm between the strip / \"No.\" label and the marker squares (ink spread, blur)\nINFO_TOP = 30.0\nPAD = 3.0\nFRAME_INSET = 0.25  # keeps frame strokes inside the margin\n# ---- timing tracks (header version 2): rows of small black squares along the four edges, outside the frames.  A\n# folded / curled sheet is not flat: the recognizer measures where each tick really is and bends the page back.\nTRACK_PITCH = 6.0                  # mm between tick centres\nTRACK_LEN, TRACK_LR_W, TRACK_TB_H = 3.0, 2.4, 2.4   # tick size along the track, across it (left / right), across it (top / bottom)\nTRACK_EDGE_LR, TRACK_EDGE_TB = 6.0, 4.4             # distance of the ticks from the paper edge (printers clip ~3 mm)\nTRACK_N_LR, TRACK_N_TB = 40, 26                     # ticks per left / right edge, per top / bottom edge\nFRAME_INSET_TRACKS = 1.4           # frames start this far inside the margin when tracks are printed (clear of the left / right ticks)\nID_WRITEIN_H = 7.0\nID_ROW_LABEL_W = 5.0\nNAME_BOX_H = 25.0\nANS_HEADER_H = 6.0\nANS_GAP = 3.0\nQNUM_W = 8.0\nMIN_PITCH = 5.5\nMAX_PITCH = 7.5\nMAX_BUBBLE = 6.0\nBAND_ROWS = 5\nMAX_CHOICES, MAX_ID_DIGITS = 10, 12\n\n\n@dataclass\nclass Template:\n    \"\"\"What a form looks like.  Everything that decides geometry is encoded in the sheet's header\n    (omr.markers.Header), so a sheet can be read without knowing the template in advance; the texts\n    (title, labels, instruction) are only printed.\"\"\"\n    questions: int = 45                 # questions printed on the form\n    choices: int = 5\n    id_digits: int = 8\n    pages: Optional[int] = None         # None = as few as fit\n    title: str = \"\"\n    choice_labels: Optional[List[str]] = None    # one of the header label styles: 1.., A.., a.., 가..\n    min_bubble_mm: float = 4.0          # 4.0, 4.25, ... 5.75\n    tracks: bool = True                 # timing tracks along the edges (header version 2); False = the plain version-1 sheet\n    used: Optional[int] = None          # questions actually used (1..questions); None = all.  Unused ones are not printed\n    subject_digits: int = 2             # marked subject code next to the student ID (0 = none)\n    label_id: str = \"수험번호\"\n    label_name: str = \"성명\"\n    label_subject: str = \"과목코드\"\n    instruction: str = \"보기 원 안을 진하게 완전히 칠하세요. 고칠 때는 깨끗이 지우세요.\"\n\n\n@dataclass\nclass Text:\n    text: str\n    x: float\n    y: float\n    size_pt: float\n    align: str = \"l\"  # l / c / r\n    gray: float = 0.0\n    kind: str = \"\"\n\n\n@dataclass\nclass MarkerSpec:\n    id: int\n    corner: str\n    rect: List[float]\n    quiet: List[float]\n\n\n@dataclass\nclass MetaCell:\n    rect: List[float]\n    bit: bool\n\n\n@dataclass\nclass Bubble:\n    choice: int\n    label: str\n    cx: float\n    cy: float\n\n\n@dataclass\nclass Question:\n    number: int  # 1-based, continuous across pages\n    num_text: Text\n    bubbles: List[Bubble]\n\n\n@dataclass\nclass Band:\n    rect: List[float]\n    gray: float\n\n\n@dataclass\nclass Column:\n    rect: List[float]\n    headers: List[Text]\n    bands: List[Band]\n    questions: List[Question]\n\n\n@dataclass\nclass IdBubble:\n    value: int\n    cx: float\n    cy: float\n\n\n@dataclass\nclass IdColumn:\n    digit_index: int  # 0 = leftmost / most significant\n    writein: List[float]\n    bubbles: List[IdBubble]\n\n\n@dataclass\nclass IdGrid:\n    bubble_diameter: float\n    columns: List[IdColumn]\n    row_labels: List[Text]\n\n\n@dataclass\nclass Tick:\n    side: str            # \"L\" | \"R\" | \"T\" | \"B\"\n    index: int           # 0-based, top -> bottom (L, R) or left -> right (T, B)\n    rect: List[float]\n\n\n@dataclass\nclass Page:\n    index: int\n    markers: List[MarkerSpec]\n    meta_rect: List[float]\n    meta_cells: List[MetaCell]   # header cells (all rows), or the legacy meta strip\n    info_box: List[float]\n    id_grid: IdGrid\n    id_label: Text\n    name_box: List[float]\n    name_label: Text\n    answer_box: List[float]\n    bubble_diameter: float\n    first_question: int\n    n_questions: int             # questions read on this page (used ones)\n    columns: List[Column]\n    texts: List[Text]  # title, footer, ...\n    subject_grid: Optional[IdGrid] = None\n    subject_label: Optional[Text] = None\n    ticks: List[Tick] = field(default_factory=list)   # timing tracks (header version >= 2); empty on older sheets\n\n\n@dataclass\nclass Layout:\n    page_w: float\n    page_h: float\n    margin: float\n    form_id: Optional[int]        # legacy sheets only (16-bit id in the old meta strip); None for self-describing ones\n    total_pages: int\n    questions_per_page: List[int]  # used questions per page\n    stroke_mm: float\n    template: Template\n    pages: List[Page]\n    form_key: str = \"\"            # identity of the printed form (Header.form_key; \"F%04X\" for legacy sheets)\n    version: int = 0              # header format version; 0 = legacy meta strip\n\n    def header(self, page: int) -> mk.Header:\n        t = self.template\n        return mk.Header(t.questions, t.used or t.questions, t.choices, t.id_digits, t.subject_digits, self.total_pages,\n                         page, mk.label_style(t.choice_labels), _bubble_class(t.min_bubble_mm),\n                         self.version or mk.HEADER_VERSION)\n\n    def to_dict(self) -> dict:\n        return dataclasses.asdict(self)\n\n    def to_json(self, **kw) -> str:\n        return json.dumps(self.to_dict(), ensure_ascii=False, **kw)\n\n    @classmethod\n    def from_dict(cls, d: dict) -> \"Layout\":\n        L = _build(cls, d)\n        if L.version == 0:          # legacy layout: no subject code, form identified by its 16-bit id\n            L.template.subject_digits = 0\n            L.form_key = L.form_key or f\"F{L.form_id:04X}\"\n        if L.version < 2:           # saved before timing tracks existed (no `tracks` field): such sheets have none\n            L.template.tracks = False\n        return L\n\n    @classmethod\n    def from_json(cls, s: str) -> \"Layout\":\n        return cls.from_dict(json.loads(s))\n\n\ndef _build(tp, v):\n    origin = typing.get_origin(tp)\n    if origin is list:\n        (a,) = typing.get_args(tp)\n        return [_build(a, x) for x in v]\n    if origin is typing.Union:\n        arg = [a for a in typing.get_args(tp) if a is not type(None)][0]\n        return None if v is None else _build(arg, v)\n    if dataclasses.is_dataclass(tp):\n        hints = typing.get_type_hints(tp)\n        # missing fields take their defaults and unknown ones are ignored, so layouts saved by older versions load\n        return tp(**{f.name: _build(hints[f.name], v[f.name]) for f in dataclasses.fields(tp) if f.name in v})\n    if tp is float:\n        return float(v)\n    return v\n\n\ndef _r(v: float) -> float:\n    return round(float(v), 3)\n\n\ndef marker_rects(p: int) -> dict:\n    \"\"\"Corner name -> [x, y, w, h] (mm) of the marker's black square for page index p.\n\n    Marker positions are fixed design constants (independent of the template), so a\n    recognizer can use them before it knows which form it is looking at.\n    \"\"\"\n    far = PAGE_W - MARGIN - MARKER_MM\n    low = PAGE_H - MARGIN - MARKER_MM\n    pos = {\"TL\": (MARGIN, MARGIN), \"TR\": (far, MARGIN), \"BR\": (far, low), \"BL\": (MARGIN, low)}\n    return {c: [_r(x), _r(y), MARKER_MM, MARKER_MM] for c, (x, y) in pos.items()}\n\n\ndef meta_cell_rects() -> List[List[float]]:\n    \"\"\"[x, y, w, h] (mm) of every cell of the meta bit strip (template independent).\"\"\"\n    n = mk.META_CELLS\n    mx = (PAGE_W - META_CELL_W * n) / 2\n    return [_rect(mx + i * META_CELL_W, META_Y, META_CELL_W, META_CELL_H) for i in range(n)]\n\n\ndef header_cell_rects() -> List[List[List[float]]]:\n    \"\"\"[row][cell] -> [x, y, w, h] (mm) of the self-describing header (template independent).\"\"\"\n    n = mk.HEADER_ROW_CELLS\n    x0 = (PAGE_W - HEADER_CELL_W * n) / 2\n    return [[_rect(x0 + i * HEADER_CELL_W, y, HEADER_CELL_W, HEADER_ROW_H) for i in range(n)] for y in HEADER_ROW_Y]\n\n\ndef track_tick_rects() -> dict:\n    \"\"\"Side -> [[x, y, w, h], ...] (mm) of the timing ticks (template independent; used when the header says version >= 2).\"\"\"\n    out = {}\n    ys = [(PAGE_H - (TRACK_N_LR - 1) * TRACK_PITCH) / 2 + k * TRACK_PITCH for k in range(TRACK_N_LR)]\n    xs = [(PAGE_W - (TRACK_N_TB - 1) * TRACK_PITCH) / 2 + k * TRACK_PITCH for k in range(TRACK_N_TB)]\n    for side, x0 in ((\"L\", TRACK_EDGE_LR), (\"R\", PAGE_W - TRACK_EDGE_LR - TRACK_LR_W)):\n        out[side] = [_rect(x0, y - TRACK_LEN / 2, TRACK_LR_W, TRACK_LEN) for y in ys]\n    for side, y0 in ((\"T\", TRACK_EDGE_TB), (\"B\", PAGE_H - TRACK_EDGE_TB - TRACK_TB_H)):\n        out[side] = [_rect(x - TRACK_LEN / 2, y0, TRACK_LEN, TRACK_TB_H) for x in xs]\n    return out\n\n\ndef track_tick_centers() -> dict:\n    \"\"\"Side -> (n, 2) array of tick centres (mm).\"\"\"\n    import numpy as np\n    return {s: np.array([[r[0] + r[2] / 2, r[1] + r[3] / 2] for r in rs]) for s, rs in track_tick_rects().items()}\n\n\ndef serial_cell_rects() -> List[List[float]]:\n    \"\"\"[x, y, w, h] (mm) of every cell of the serial strip (footer, template independent).\"\"\"\n    n = mk.SERIAL_CELLS\n    x1 = PAGE_W - MARGIN - MARKER_MM - SERIAL_CLEARANCE\n    x0 = x1 - n * SERIAL_CELL_W\n    return [_rect(x0 + i * SERIAL_CELL_W, SERIAL_Y, SERIAL_CELL_W, SERIAL_CELL_H) for i in range(n)]\n\n\ndef serial_label(serial: int) -> Text:\n    \"\"\"Human-readable serial printed below the strip (right-aligned to it).\"\"\"\n    x1 = PAGE_W - MARGIN - MARKER_MM - SERIAL_CLEARANCE\n    return Text(f\"No. {serial:04d}\", x1, 285.0, 9, \"r\", 0.0, \"serial\")\n\n\ndef _rect(*a) -> List[float]:\n    return [_r(x) for x in a]\n\n\n# ------------------------------------------------------------------ geometry\ndef _id_geometry(t: Template):\n    dia = max(t.min_bubble_mm, 4.2)\n    return dia, max(6.2, dia * 1.45), max(MIN_PITCH, dia * 1.3)  # dia, pitch_x, pitch_y\n\n\ndef _info_bottom(t: Template) -> float:\n    _, _, py = _id_geometry(t)\n    return INFO_TOP + PAD + 5 + ID_WRITEIN_H + 2 + 10 * py + PAD\n\n\ndef _frame_left(t: Template) -> float:\n    return MARGIN + (FRAME_INSET_TRACKS if t.tracks else FRAME_INSET)\n\n\ndef _answer_area(t: Template) -> List[float]:\n    top = _info_bottom(t) + 3.0\n    bottom = PAGE_H - MARGIN - MARKER_MM - QUIET_MM\n    left = _frame_left(t)\n    return [left, top, PAGE_W - 2 * left, bottom - top]\n\n\ndef _choose_grid(t: Template, q: int):\n    \"\"\"Best (ncols, rows, pitch_x, pitch_y, col_w) for q questions on one page, or None.\"\"\"\n    _, _, aw, ah = _answer_area(t)\n    avail_h = ah - ANS_HEADER_H - 2.0\n    best = None\n    for ncols in range(1, q + 1 if q > 0 else 2):\n        col_w = (aw - (ncols - 1) * ANS_GAP) / ncols\n        px = min(MAX_PITCH, (col_w - QNUM_W) / t.choices)\n        rows = math.ceil(q / ncols)\n        py = min(MAX_PITCH, avail_h / rows)\n        if px < MIN_PITCH or py < MIN_PITCH:\n            continue\n        score = min(px, py)\n        if best is None or score > best[0] + 1e-9:\n            best = (score, ncols, rows, px, py, col_w)\n    return best[1:] if best else None\n\n\ndef page_capacity(t: Template) -> int:\n    \"\"\"Max questions on one page at minimum pitch.\"\"\"\n    _, _, aw, ah = _answer_area(t)\n    avail_h = ah - ANS_HEADER_H - 2.0\n    rows = int(avail_h // MIN_PITCH)\n    min_col = QNUM_W + t.choices * MIN_PITCH\n    ncols = int((aw + ANS_GAP) // (min_col + ANS_GAP))\n    return max(0, rows * ncols)\n\n\ndef _resolve_split(t: Template) -> List[int]:\n    \"\"\"Printed questions per page: an even split over the pages (so it follows from questions + pages alone).\"\"\"\n    Q = t.questions\n    cap = page_capacity(t)\n    if cap < 1:\n        raise ValueError(\"no room for any question at minimum bubble size\")\n    if t.pages is not None:\n        n = t.pages\n        if n < 1 or n > Q:\n            raise ValueError(\"invalid page count\")\n        if math.ceil(Q / n) > cap:\n            raise ValueError(f\"{Q} questions in {n} pages exceeds capacity {cap}/page\")\n    else:\n        n = math.ceil(Q / cap)  # automatic split\n    base, extra = divmod(Q, n)\n    return [base + (1 if i < extra else 0) for i in range(n)]\n\n\ndef _bubble_class(min_bubble_mm: float) -> int:\n    k = (min_bubble_mm - mk.BUBBLE_BASE_MM) / mk.BUBBLE_STEP_MM\n    if abs(k - round(k)) > 1e-6 or not 0 <= round(k) < 8:\n        raise ValueError(f\"min_bubble_mm must be {mk.BUBBLE_BASE_MM} + k*{mk.BUBBLE_STEP_MM} (k = 0..7)\")\n    return int(round(k))\n\n\ndef _text_width_mm(s: str, size_pt: float) -> float:\n    em = size_pt * 0.3528\n    return sum(em * (1.0 if ord(c) > 0x2E80 else 0.55) for c in s)\n\n\ndef validate(t: Template) -> None:\n    if t.questions < 1:\n        raise ValueError(\"questions must be >= 1\")\n    if not 2 <= t.choices <= MAX_CHOICES:\n        raise ValueError(f\"choices must be 2..{MAX_CHOICES}\")\n    if not 1 <= t.id_digits <= MAX_ID_DIGITS:\n        raise ValueError(f\"id_digits must be 1..{MAX_ID_DIGITS}\")\n    if t.choice_labels is not None and len(t.choice_labels) != t.choices:\n        raise ValueError(\"choice_labels length must equal choices\")\n    _bubble_class(t.min_bubble_mm)\n    if t.questions >= 1 << 10:\n        raise ValueError(\"questions must be < 1024\")\n    if t.used is not None and not 1 <= t.used <= t.questions:\n        raise ValueError(\"used must be 1..questions\")\n    if not 0 <= t.subject_digits <= 3:\n        raise ValueError(\"subject_digits must be 0..3\")\n    if t.choice_labels is not None and mk.label_style(list(t.choice_labels)) is None:\n        raise ValueError(\"choice_labels must be 1 2 3.., A B C.., a b c.. or 가 나 다.. (the header stores only the style)\")\n\n\ndef build_layout(template: Template) -> Layout:\n    t = dataclasses.replace(template)\n    if isinstance(t.choice_labels, str):\n        t.choice_labels = list(t.choice_labels)\n    validate(t)\n    if t.choice_labels is None:\n        t.choice_labels = [str(i + 1) for i in range(t.choices)]\n    split = _resolve_split(t)\n    total = len(split)\n    if total > mk.MAX_PAGES:\n        raise ValueError(f\"{total} pages needed; max is {mk.MAX_PAGES}\")\n    used = t.used or t.questions\n    if used <= sum(split[:-1]):\n        raise ValueError(f\"only {used} of {t.questions} questions used: page {total} would be empty (use fewer pages)\")\n    t.pages = total\n    pages, first, used_pp = [], 1, []\n    for p, nq in enumerate(split):\n        n_used = max(0, min(nq, used - (first - 1)))\n        pages.append(_build_page(t, p, total, first, nq, n_used))\n        used_pp.append(n_used)\n        first += nq\n    L = Layout(PAGE_W, PAGE_H, MARGIN, None, total, used_pp, 0.25, t, pages, version=2 if t.tracks else 1)\n    L.form_key = L.header(0).form_key\n    for pg in L.pages:   # the header cells are only known once the layout exists\n        rows = mk.encode_header(L.header(pg.index))\n        pg.meta_cells = [MetaCell(r, b) for rr, bb in zip(header_cell_rects(), rows) for r, b in zip(rr, bb)]\n    return L\n\n\ndef layout_from_header(h: mk.Header) -> Layout:\n    \"\"\"The layout a self-describing sheet describes (texts are not part of the header: no title).\"\"\"\n    return build_layout(Template(questions=h.questions, choices=h.choices, id_digits=h.id_digits, pages=h.pages,\n                                 choice_labels=h.choice_labels(), used=h.used, subject_digits=h.subject_digits,\n                                 min_bubble_mm=mk.BUBBLE_BASE_MM + mk.BUBBLE_STEP_MM * h.bubble, title=\"\",\n                                 tracks=h.version >= 2))\n\n\ndef header_from_form_key(form_key: str, page: int = 0) -> mk.Header:\n    \"\"\"Inverse of ``Header.form_key`` (\"Q100U80C5D8S2P2L0B0V1\") for self-describing sheets; ValueError otherwise.\"\"\"\n    m = re.fullmatch(r\"Q(\\d+)U(\\d+)C(\\d+)D(\\d+)S(\\d+)P(\\d+)L(\\d+)B(\\d+)V(\\d+)\", form_key or \"\")\n    if m is None:\n        raise ValueError(f\"not a self-describing form key: {form_key!r}\")\n    q, u, c, d, s, p, l, b, v = map(int, m.groups())\n    h = mk.Header(q, u, c, d, s, p, page, l, b, v)\n    mk.validate_header(h)\n    return h\n\n\ndef describe(L: Layout) -> str:\n    \"\"\"One-line human description of a form (Korean).\"\"\"\n    t = L.template\n    used = t.used or t.questions\n    q = f\"{used}문항\" if used == t.questions else f\"{t.questions}문항 양식 중 {used}문항\"\n    return f\"{q} · {t.choices}지선다 · {L.total_pages}쪽 · 수험번호 {t.id_digits}자리\" + \\\n        (f\" · 과목코드 {t.subject_digits}자리\" if t.subject_digits else \"\")\n\n\ndef _id_columns(n: int, gx0: float, writein_top: float, bub_top: float, ipx: float, ipy: float) -> List[IdColumn]:\n    cols = []\n    for i in range(n):\n        cx = gx0 + (i + 0.5) * ipx\n        cols.append(IdColumn(i, _rect(cx - ipx / 2 + 0.4, writein_top, ipx - 0.8, ID_WRITEIN_H),\n                             [IdBubble(v, _r(cx), _r(bub_top + (v + 0.5) * ipy)) for v in range(10)]))\n    return cols\n\n\ndef _row_labels(gx0: float, bub_top: float, ipy: float, kind: str) -> List[Text]:\n    return [Text(str(v), _r(gx0 - 1.5), _r(bub_top + (v + 0.5) * ipy + 1.1), 7, \"r\", 0.5, kind) for v in range(10)]\n\n\ndef _build_page(t: Template, p: int, total: int, first_q: int, nq: int, n_used: int) -> Page:\n    \"\"\"nq: printed question slots on this page (geometry); n_used: how many of them are used (printed and read).\"\"\"\n    # ---- corner markers\n    mspecs = []\n    for c in mk.CORNERS:\n        x, y = marker_rects(p)[c][:2]\n        mspecs.append(MarkerSpec(mk.marker_id(p, c), c, _rect(x, y, MARKER_MM, MARKER_MM),\n                                 _rect(x - QUIET_MM, y - QUIET_MM, MARKER_MM + 2 * QUIET_MM, MARKER_MM + 2 * QUIET_MM)))\n    # ---- header (cells are filled in by build_layout once the layout exists)\n    hr = header_cell_rects()\n    meta_rect = _rect(hr[0][0][0], hr[0][0][1], HEADER_CELL_W * mk.HEADER_ROW_CELLS, hr[-1][0][1] + HEADER_ROW_H - hr[0][0][1])\n\n    texts: List[Text] = []\n    # ---- title (shrunk to fit between markers)\n    free_w = PAGE_W - 2 * (MARGIN + MARKER_MM + QUIET_MM)\n    if t.title:\n        size = 13.0\n        while size > 7 and _text_width_mm(t.title, size) > free_w:\n            size -= 0.5\n        texts.append(Text(t.title, PAGE_W / 2, TITLE_Y, size, \"c\", 0.0, \"title\"))\n    # ---- footer\n    fx = MARGIN + MARKER_MM + QUIET_MM\n    used = t.used or t.questions\n    qtxt = f\"Q1-{used}\" + (f\" of {t.questions}\" if used != t.questions else \"\")\n    texts.append(Text(f\"page {p + 1} / {total}  |  {qtxt}\", fx, 280.0, 8, \"l\", 0.3, \"footer\"))\n    if t.instruction:\n        texts.append(Text(t.instruction, fx, 285.0, 7, \"l\", 0.4, \"instruction\"))\n\n    # ---- student info area: ID grid, subject-code grid, name box\n    idia, ipx, ipy = _id_geometry(t)\n    info_bottom = _info_bottom(t)\n    left = _frame_left(t)\n    info_box = _rect(left, INFO_TOP, PAGE_W - 2 * left, info_bottom - INFO_TOP)\n    label_y = INFO_TOP + PAD + 3.5\n    id_label = Text(t.label_id, left + PAD, label_y, 9, \"l\", 0.0, \"id_label\")\n    writein_top = INFO_TOP + PAD + 5\n    bub_top = writein_top + ID_WRITEIN_H + 2\n    gx0 = left + PAD + ID_ROW_LABEL_W\n    grid = IdGrid(_r(idia), _id_columns(t.id_digits, gx0, writein_top, bub_top, ipx, ipy),\n                  _row_labels(gx0, bub_top, ipy, \"id_row\"))\n    nx = gx0 + t.id_digits * ipx + 8\n    subject_grid = subject_label = None\n    if t.subject_digits:\n        sx0 = gx0 + t.id_digits * ipx + SUBJ_GAP\n        subject_grid = IdGrid(_r(idia), _id_columns(t.subject_digits, sx0, writein_top, bub_top, ipx, ipy),\n                              _row_labels(sx0, bub_top, ipy, \"subject_row\"))\n        subject_label = Text(t.label_subject, _r(sx0 - ID_ROW_LABEL_W + 1.0), label_y, 9, \"l\", 0.0, \"subject_label\")\n        nx = max(sx0 + t.subject_digits * ipx, sx0 - ID_ROW_LABEL_W + 1.0 + _text_width_mm(t.label_subject, 9)) + 8\n    nw = PAGE_W - left - PAD - nx\n    if nw < 25:\n        raise ValueError(\"no room for the name box (too many ID / subject digits)\")\n    name_box = _rect(nx, writein_top, nw, NAME_BOX_H)\n    name_label = Text(t.label_name, _r(nx), _r(label_y), 9, \"l\", 0.0, \"name_label\")\n\n    # ---- answer area (geometry from all nq slots; only the first n_used are printed and read)\n    abox = _answer_area(t)\n    ncols, rows, px, py, col_w = _choose_grid(t, nq)\n    dia = max(t.min_bubble_mm, min(MAX_BUBBLE, 0.7 * min(px, py)))\n    columns, q = [], 0\n    y_rows = abox[1] + ANS_HEADER_H + 2.0\n    for c in range(ncols):\n        cx0 = abox[0] + c * (col_w + ANS_GAP)\n        in_col = min(rows, nq - q, n_used - q)\n        if in_col <= 0:\n            break\n        headers = [Text(t.choice_labels[k], _r(cx0 + QNUM_W + (k + 0.5) * px), _r(abox[1] + 4.2), 8, \"c\", 0.35, \"choice_label\")\n                   for k in range(t.choices)]\n        bands, qs = [], []\n        for r in range(in_col):\n            if (r // BAND_ROWS) % 2 == 1:\n                bands.append(Band(_rect(cx0, y_rows + r * py, col_w, py), 0.95))\n            cy = y_rows + (r + 0.5) * py\n            number = first_q + q\n            qs.append(Question(number,\n                               Text(str(number), _r(cx0 + QNUM_W - 2.0), _r(cy + 1.2), 9, \"r\", 0.0, \"qnum\"),\n                               [Bubble(k, t.choice_labels[k], _r(cx0 + QNUM_W + (k + 0.5) * px), _r(cy))\n                                for k in range(t.choices)]))\n            q += 1\n        columns.append(Column(_rect(cx0, abox[1], col_w, ANS_HEADER_H + 2.0 + rows * py), headers, bands, qs))\n    ticks = [Tick(side, i, r) for side, rs in track_tick_rects().items() for i, r in enumerate(rs)] if t.tracks else []\n    return Page(p, mspecs, meta_rect, [], info_box, grid, id_label, _rect(*name_box), name_label,\n                _rect(*abox), _r(dia), first_q, n_used, columns, texts, subject_grid, subject_label, ticks)\n", "omr/detect.py": "\"\"\"Corner-marker detection that survives print defects.\n\nA cheap printer renders \"black\" as mid grey with horizontal white streaks / bands.  A streak that crosses\na marker's black border breaks the contour the ArUco detector needs.  Structural remedy: a morphological\n*opening* (erode then dilate) removes bright features thinner than its kernel, i.e. the streaks, while the\nmarker's own white modules (>= one module wide) survive.  The kernel must be thicker than the streaks and no\nthicker than a module, so it has to scale with the marker's size in the image:\n\n    module_px  = MARKER_MM / 6 * px_per_mm\n    kernel_px  ~ KERNEL_OF_MODULE * module_px\n\nThe pixel scale is unknown before a marker is found, so passes are tried over a small geometric ladder of\nmodule-size hypotheses covering what a sheet in view can plausibly be (derived from the frame size; no\nmagic pixel number), cheapest-first, stopping as soon as a consistent set of markers exists.  If the plain\npass already sees a marker, its size selects the kernel directly.  The opening is square, so it works for\nany streak direction (sheet rotated, phone held landscape).\n\nSecond-chance decoding (AprilTag-style): ArUco decides each bit with Otsu over the warped candidate, which fails when\na printed \"black\" cell comes out as a lighter grey than the border (toner dropout over a whole module) or the marker\nis low-contrast.  Every candidate ArUco rejected in a pass that was run anyway is re-decoded like AprilTag does\n(Olson 2011, Wang & Olson 2016): a black model is fit to the border cells and a white model to a ring in the quiet\nzone (each a plane over the marker, so lighting gradients cancel) and each bit is thresholded halfway between them.\nOnly an exact dictionary match is accepted (no error correction: allowing even the dictionary's 1 correctable bit\nproduced dozens of wrong ids on the real video), the border must be all black and the ring all white.  It costs\n~0.1 ms per candidate and only runs when the plain pass did not already find a full set.\n\nDetections of different passes are merged by id.  An id seen at two different places (in one pass or between\npasses) is dropped as inconsistent.  Relaxed bit-error tolerance is NOT used beyond a slightly larger border\ntolerance: every sheet still has to pass the geometry check, the meta-strip CRC and the page match.\n\"\"\"\nfrom __future__ import annotations\n\nimport threading\nfrom typing import Dict, List, Optional, Tuple\n\nimport cv2\nimport numpy as np\n\nfrom . import layout as lay\nfrom . import markers as mk\n\nMODULE_MM = lay.MARKER_MM / 6.0          # one marker cell\nMAX_SHEET_PPM_OF_FRAME = 1.1 / 210.0     # sheet width fills (at most) the frame's short side, + margin\nMIN_PPM = 2.0                            # below this nothing on the sheet is readable anyway\nKERNEL_OF_MODULE = 0.85                  # opening kernel / module size: thicker than streaks, thinner than a cell (works for ~0.7..1.0)\nLADDER_RATIO = 1.3                       # module-size ratio between ladder steps (a kernel works over a ~1.4x range of sizes)\nDECODE_MIN_CONTRAST = 0.25               # white-black model difference / white: below it the \"marker\" is texture, not print\nRING_MODULES = 0.6                       # white model ring: this far outside the border (quiet zone is 3 mm = 1.1 modules)\nMIN_FOR_STOP = 3                         # markers of one page group that end the search early\nSAME_PLACE = 0.35                        # same id counts as the same detection if centres are within this * marker side\n\nCOMPLETE_ROI = 1.3                       # missing-corner search window half-size / predicted marker side\nCOMPLETE_MAX_OFF = 0.9                   # a found marker must lie within this * side of where the other three predict it\nCOMPLETE_WIDE = (2.6, 2.2)               # second, wider (window, max offset) when the first finds nothing: on a curled sheet the\n                                         # three markers' homography predicts the fourth up to ~1.6 sides off (measured, synth curl)\nCOMPLETE_KERNELS = (0.85, 0.55, 0.35)    # opening kernels (of a module) tried there: a marker turned ~45 deg has only ~0.7 module of straight white\nCOMPLETE_SIDE = (0.6, 1.6)               # blob quad side / predicted side\n\nFLAT_BG_FRAC = 1 / 10                    # lighting-flattened last-resort pass: background = max filter of this fraction of the short side ...\nFLAT_MIN_CANDIDATES = 4                  # ... and the plain pass rejected at least this many marker-like quads\nFLAT_SCALE = 8                           # ... measured on a copy this much smaller\nFLAT_DENOISE_SIGMA = 1.2                 # ... blurred, then a light denoise (dim frames carry sensor noise)\n\n_tls = threading.local()\n\n\ndef _detector() -> \"cv2.aruco.ArucoDetector\":\n    d = getattr(_tls, \"det\", None)\n    if d is None:\n        p = cv2.aruco.DetectorParameters()\n        p.cornerRefinementMethod = cv2.aruco.CORNER_REFINE_SUBPIX\n        p.cornerRefinementWinSize = 4\n        p.perspectiveRemovePixelPerCell = 8  # more samples per bit: markedly better on blurred / small markers\n        p.maxErroneousBitsInBorderRate = 0.5  # a streak through the border breaks a few border bits (default 0.35)\n        d = _tls.det = cv2.aruco.ArucoDetector(mk.aruco_dictionary(), p)\n    return d\n\n\ndef ladder(shape) -> List[float]:\n    \"\"\"Module-size hypotheses (px), largest first, for a frame of this shape.\"\"\"\n    short = min(shape[:2])\n    hi = MODULE_MM * MAX_SHEET_PPM_OF_FRAME * short\n    lo = MODULE_MM * MIN_PPM\n    out = [hi]\n    while out[-1] / LADDER_RATIO >= lo * 1.1:\n        out.append(out[-1] / LADDER_RATIO)\n    return out\n\n\ndef _kernel(module_px: float, frac: float) -> int:\n    return max(3, int(round(frac * module_px)) | 1)   # odd, at least 3\n\n\ndef _side(c: np.ndarray) -> float:\n    d = np.roll(c, -1, axis=0) - c\n    return float(np.sqrt((d * d).sum(axis=1)).mean())\n\n\nclass _Merge:\n    \"\"\"Detections by id; an id seen in two places is dropped (`conflict`).\"\"\"\n\n    def __init__(self):\n        self.found: Dict[int, np.ndarray] = {}\n        self.conflict: set = set()\n        self.dup = False\n\n    def add(self, corners, ids) -> None:\n        if ids is None:\n            return\n        seen_here = set()\n        for i, c in zip(ids.ravel(), corners):\n            i = int(i)\n            if i >= 4 * mk.MAX_PAGES:\n                continue\n            c = c.reshape(4, 2).astype(np.float64)\n            if i in self.conflict:\n                continue\n            if i in self.found:\n                old = self.found[i]\n                if np.linalg.norm(old.mean(0) - c.mean(0)) > SAME_PLACE * max(_side(old), _side(c)):\n                    self.dup |= i in seen_here\n                    self.conflict.add(i)\n                    del self.found[i]\n                seen_here.add(i)\n                continue\n            self.found[i] = c\n            seen_here.add(i)\n\n    def solid(self) -> bool:\n        groups: Dict[int, int] = {}\n        for i in self.found:\n            groups[i // 4] = groups.get(i // 4, 0) + 1\n        return max(groups.values(), default=0) >= MIN_FOR_STOP\n\n    def module_px(self) -> Optional[float]:\n        if not self.found:\n            return None\n        return float(np.median([_side(c) for c in self.found.values()])) / 6.0\n\n\n# ---------------------------------------------------------------- AprilTag-style re-decoding of rejected candidates\n_G = (np.arange(3) - 1) * 0.25                         # 3x3 samples per cell, within +-0.25 module of its centre\n_CU, _CV = np.meshgrid(np.arange(6) + 0.5, np.arange(6) + 0.5)\n_CELL_UV = np.stack([(_CU[..., None, None] + _G[None, None, None, :]).repeat(3, 2),\n                     (_CV[..., None, None] + _G[None, None, :, None]).repeat(3, 3)], -1).reshape(-1, 2)\n_T = np.arange(6) + 0.5\n_R0, _R1 = -RING_MODULES, 6 + RING_MODULES\n_WHITE_UV = np.concatenate([np.stack([_T, np.full(6, _R0)], 1), np.stack([_T, np.full(6, _R1)], 1),\n                            np.stack([np.full(6, _R0), _T], 1), np.stack([np.full(6, _R1), _T], 1)])\n_BORDER = np.ones((6, 6), bool)\n_BORDER[1:5, 1:5] = False\n_A_BORDER = np.c_[np.ones(20), _CU[_BORDER], _CV[_BORDER]]\n_A_WHITE = np.c_[np.ones(len(_WHITE_UV)), _WHITE_UV]\n_A_GRID = np.c_[np.ones(36), _CU.ravel(), _CV.ravel()]\n_UNIT = np.float32([[0, 0], [6, 0], [6, 6], [0, 6]])\n_SUBPIX = (cv2.TERM_CRITERIA_EPS + cv2.TERM_CRITERIA_MAX_ITER, 30, 0.1)\n\n\ndef _sample(img: np.ndarray, H: np.ndarray, uv: np.ndarray) -> np.ndarray:\n    p = cv2.perspectiveTransform(uv.reshape(-1, 1, 2), H).reshape(-1, 2).astype(np.float32)\n    return cv2.remap(img, p[:, :1], p[:, 1:], cv2.INTER_LINEAR, borderMode=cv2.BORDER_REPLICATE).reshape(-1).astype(np.float64)\n\n\ndef _model_fit(img: np.ndarray, quad):\n    \"\"\"Black/white plane models of a candidate quad -> (quad clockwise, rel cells, rel ring) or None when it has no contrast.\"\"\"\n    q = np.asarray(quad, np.float64).reshape(4, 2)\n    a, b = q[1] - q[0], q[2] - q[1]\n    if a[0] * b[1] - a[1] * b[0] < 0:                 # make it clockwise (image y points down)\n        q = q[::-1].copy()\n    H = cv2.getPerspectiveTransform(_UNIT, q.astype(np.float32))\n    cells = _sample(img, H, _CELL_UV).reshape(6, 6, 9).mean(2)\n    ring = _sample(img, H, _WHITE_UV)\n    bc = np.linalg.lstsq(_A_BORDER, cells[_BORDER], rcond=None)[0]\n    wc = np.linalg.lstsq(_A_WHITE, ring, rcond=None)[0]\n    blk, wht = (_A_GRID @ bc).reshape(6, 6), (_A_GRID @ wc).reshape(6, 6)\n    con = wht - blk\n    if con.min() <= 0 or con.mean() < DECODE_MIN_CONTRAST * wht.mean():\n        return None\n    rel = (cells - blk) / con                            # 0 = black model, 1 = white model\n    ring_rel = (ring - _A_WHITE @ bc) / (_A_WHITE @ (wc - bc))\n    if (rel[_BORDER] > 0.5).any() or (ring_rel < 0.5).any():\n        return None\n    return q, rel, ring_rel\n\n\ndef model_decode(img: np.ndarray, quad) -> Optional[Tuple[int, np.ndarray]]:\n    \"\"\"Decode a candidate quad (any cyclic order) -> (id, corners TL,TR,BR,BL) or None (see module docstring).\"\"\"\n    fit = _model_fit(img, quad)\n    if fit is None:\n        return None\n    q, rel, _ = fit\n    ok, mid, rot = mk.aruco_dictionary().identify((rel[1:5, 1:5] > 0.5).astype(np.uint8), 0.0)\n    if not ok:\n        return None\n    return int(mid), np.roll(q, int(rot), axis=0)\n\n\ndef markerlike(gray: np.ndarray, rejected, min_side: float) -> int:\n    \"\"\"How many of ArUco's rejected candidates look like a marker (black border, white quiet zone, enough contrast) although\n    their bits are not in the dictionary.  Texture, text and bubbles do not: none of them -> nothing here to search harder for.\"\"\"\n    return sum(1 for r in rejected if _side(r.reshape(4, 2)) >= min_side and _model_fit(gray, r) is not None)\n\n\ndef _redecode(m: \"_Merge\", gray: np.ndarray, imgs, rejected, min_side: float) -> None:\n    \"\"\"Second-chance decode of a pass's rejected candidates (on each of `imgs`); corners refined on `gray`.\"\"\"\n    for r in rejected:\n        r = r.reshape(4, 2)\n        if _side(r) < min_side:\n            continue\n        for img in imgs:\n            out = model_decode(img, r)\n            if out is None:\n                continue\n            mid, q = out\n            if mid in m.found or mid >= 4 * mk.MAX_PAGES:\n                break\n            win = max(2, int(round(0.3 * _side(q) / 6)))          # 0.3 module, like ArUco's relative window\n            q = cv2.cornerSubPix(gray, q.astype(np.float32).reshape(-1, 1, 2), (win, win), (-1, -1), _SUBPIX)\n            m.add([q.reshape(1, 4, 2)], np.array([[mid]]))\n            break\n\n\ndef flatten_lighting(gray: np.ndarray) -> np.ndarray:\n    \"\"\"gray / local paper level, stretched to 0..255: a dim, shadowed or gradient-lit frame gets the contrast of a lit one.\n\n    The background is a max filter wider than any marker followed by a blur (a marker's black border never reaches it),\n    computed on a 1/FLAT_SCALE copy (the full-size max filter costs ~250 ms at 1080p).  Only a last resort: a max filter\n    spreads a hard shadow edge, which the normal passes handle better.\"\"\"\n    h, w = gray.shape[:2]\n    small = cv2.resize(gray, (max(w // FLAT_SCALE, 1), max(h // FLAT_SCALE, 1)), interpolation=cv2.INTER_AREA)\n    k = max(5, int(min(small.shape[:2]) * FLAT_BG_FRAC) | 1)\n    bg = cv2.GaussianBlur(cv2.dilate(small, np.ones((k, k), np.uint8)), (0, 0), k / 3.0)\n    bg = np.maximum(cv2.resize(bg, (w, h), interpolation=cv2.INTER_LINEAR), 8)       # background stays uint8 (the float32 resize/astype cost ~3x);\n    flat = cv2.divide(gray, bg, scale=235.0, dtype=cv2.CV_32F)                       # the quotient stays float: uint8 rounding lost a marker in a frame\n    flat = cv2.GaussianBlur(flat, (0, 0), FLAT_DENOISE_SIGMA)                        # that the float version read (h_all seed 1005)\n    return np.clip(flat, 0, 255, out=flat).astype(np.uint8)\n\n\ndef _blob_quads(img: np.ndarray, pred_side: float, pred_c: np.ndarray, max_off: float = COMPLETE_MAX_OFF):\n    \"\"\"Dark blobs of a local window that are convex quadrilaterals of about the predicted size and place.\n\n    ArUco's candidate search needs a clean closed contour; a blurred, streaked marker may not give one although a plain Otsu\n    blob of the same marker is a perfectly good quad (model_decode then reads it).  Only used where a marker is expected.\"\"\"\n    _, b = cv2.threshold(img, 0, 255, cv2.THRESH_BINARY_INV + cv2.THRESH_OTSU)\n    cs, _ = cv2.findContours(b, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\n    for c in cs:\n        if cv2.contourArea(c) < (COMPLETE_SIDE[0] * pred_side) ** 2 * 0.5:\n            continue\n        ap = cv2.approxPolyDP(c, 0.04 * cv2.arcLength(c, True), True).reshape(-1, 2)\n        if len(ap) != 4 or not cv2.isContourConvex(ap.reshape(-1, 1, 2)):\n            continue\n        q = ap.astype(np.float64)\n        if COMPLETE_SIDE[0] * pred_side <= _side(q) <= COMPLETE_SIDE[1] * pred_side and np.linalg.norm(q.mean(0) - pred_c) < max_off * pred_side:\n            yield q\n\n\ndef _complete(m: \"_Merge\", gray: np.ndarray) -> int:\n    \"\"\"A page with three (or two) markers found: look for the missing ones where the found ones predict them (their layout\n    is known; two markers predict through an affine map and are only searched in the wide window).\n\n    The early stop at three markers (plain/opened passes over the whole frame) leaves a visible fourth marker undetected when\n    its own contour was broken (streaks, blur, rotation) -> `corner_hidden`.  The search is a small window, so it is cheap\n    and uses passes the whole-frame search cannot afford (several kernels, blob quads).  Returns detector runs used.\"\"\"\n    runs = 0\n    for _ in range(2):                                 # 2 markers -> 3 -> 4\n        groups: Dict[int, List[int]] = {}\n        for i in m.found:\n            groups.setdefault(i // 4, []).append(i)\n        if any(len(v) >= 4 for v in groups.values()):\n            break\n        cand = [g for g, v in groups.items() if len(v) == 3] or [g for g, v in groups.items() if len(v) == 2]\n        if not cand or (len(cand) > 1 and len(groups[cand[0]]) == 2):\n            break                                      # two pages with two markers each: nothing to go by\n        page = cand[0]\n        ids = sorted(groups[page])\n        mm = {mk.marker_id(page, c): np.array([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], np.float64)\n              for c, (x, y, w, h) in lay.marker_rects(page).items()}\n        src, dst = np.concatenate([mm[i] for i in ids]), np.concatenate([m.found[i] for i in ids])\n        if len(ids) == 3:\n            H, _ = cv2.findHomography(src, dst, 0)\n        else:                                          # two squares cannot pin a perspective: an affine map (well posed)\n            A = np.linalg.lstsq(np.c_[src, np.ones(len(src))], dst, rcond=None)[0].T\n            H = np.vstack([A, [0, 0, 1]])\n        if H is None or not np.isfinite(H).all():\n            break\n        got = False\n        for miss in (i for i in range(4 * page, 4 * page + 4) if i not in m.found):\n            pq = cv2.perspectiveTransform(mm[miss].reshape(-1, 1, 2), H).reshape(4, 2)\n            side, ctr = _side(pq), pq.mean(0)\n            if not (np.isfinite(pq).all() and side > 0):\n                continue\n            stages = ((COMPLETE_ROI, COMPLETE_MAX_OFF), COMPLETE_WIDE) if len(ids) == 3 else (COMPLETE_WIDE,)\n            for roi_f, max_off in stages:\n                q, r = _search_window(gray, miss, side, ctr, roi_f, max_off)\n                runs += r\n                if q is not None:\n                    m.add([q.reshape(1, 4, 2)], np.array([[miss]]))\n                    got = True\n                    break\n            if got:\n                break                                  # re-predict the rest from one more marker\n        if not got:\n            break\n    return runs\n\n\ndef _off_frame(m: \"_Merge\", shape) -> bool:\n    \"\"\"True when the markers found so far (one page, 1-2 of them) predict every missing marker of that page well outside the\n    frame: the sheet is only partly in view, so no further pass (opened ladder, lighting-flattened, windows) can complete it.\n    The prediction is an affine map of the found markers, so a generous margin (the wide window + 15% of the distance) is kept.\"\"\"\n    groups: Dict[int, List[int]] = {}\n    for i in m.found:\n        groups.setdefault(i // 4, []).append(i)\n    if len(groups) != 1:\n        return False\n    page, ids = next(iter(groups.items()))\n    if not 1 <= len(ids) <= 2:\n        return False\n    mm = {mk.marker_id(page, c): np.array([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], np.float64)\n          for c, (x, y, w, h) in lay.marker_rects(page).items()}\n    src, dst = np.concatenate([mm[i] for i in ids]), np.concatenate([m.found[i] for i in ids])\n    A = np.linalg.lstsq(np.c_[src, np.ones(len(src))], dst, rcond=None)[0].T\n    if not np.isfinite(A).all():\n        return False\n    fh, fw = shape[:2]\n    here = dst.mean(0)\n    for miss in (i for i in range(4 * page, 4 * page + 4) if i not in m.found):\n        pq = mm[miss] @ A[:, :2].T + A[:, 2]\n        ctr, side = pq.mean(0), _side(pq)\n        margin = COMPLETE_WIDE[0] * side + 0.15 * float(np.linalg.norm(ctr - here))\n        if -margin <= ctr[0] <= fw + margin and -margin <= ctr[1] <= fh + margin:\n            return False\n    return True\n\n\ndef _search_window(gray, miss, side, ctr, roi_f, max_off):\n    \"\"\"Look for marker ``miss`` in a window of half-size roi_f * side around ctr -> (corners or None, detector runs).\"\"\"\n    h, w = gray.shape[:2]\n    x0, y0 = np.maximum((ctr - roi_f * side).astype(int), 0)\n    x1, y1 = np.minimum((ctr + roi_f * side).astype(int), [w, h])\n    if x1 - x0 < side * 0.5 or y1 - y0 < side * 0.5:\n        return None, 0                                 # the predicted marker lies outside the frame\n    roi, off = gray[y0:y1, x0:x1], np.array([x0, y0], np.float64)\n    local = _Merge()\n    det, runs = _detector(), 0\n    for frac in (0.0,) + COMPLETE_KERNELS:\n        img = roi if frac == 0.0 else cv2.morphologyEx(roi, cv2.MORPH_OPEN, np.ones((_kernel(side / 6.0, frac),) * 2, np.uint8))\n        c2, i2, rej = det.detectMarkers(img)\n        runs += 1\n        local.add(c2, i2)\n        if miss not in local.found:\n            _redecode(local, roi, (roi, img), rej, side * COMPLETE_SIDE[0])\n        if miss not in local.found:\n            for q in _blob_quads(img, side, ctr - off, max_off):\n                out = model_decode(img, q)\n                if out is not None and out[0] == miss:\n                    local.add([out[1].reshape(1, 4, 2)], np.array([[miss]]))\n                    break\n        if miss in local.found:\n            q = local.found[miss] + off\n            if np.linalg.norm(q.mean(0) - ctr) < max_off * side:\n                return q, runs\n            local.found.pop(miss)\n    return None, runs\n\n\ndef find_markers(gray: np.ndarray, stack_seen: bool = False) -> Tuple[Dict[int, np.ndarray], bool, Dict[str, float]]:\n    \"\"\"-> (id -> 4x2 corners (TL, TR, BR, BL), duplicate/inconsistent id seen, info).\n\n    info: passes (number of detector runs), kernel (px of the pass that completed the set, 0 = plain).\n\n    Cost control (a stream spends most frames without a readable sheet, and those used to cost MORE than a read): the speculative\n    full-frame passes (opened ladder, lighting-flattened) only run on evidence.  Evidence = a marker was decoded, or ArUco rejected a\n    candidate that looks like a marker (`markerlike`).  When the decoded markers predict the rest of their page outside the frame, nothing more is searched;\n    with a marker decoded only its own scale is tried (one opened pass, not the whole ladder).\n\n    `stack_seen`: a prior window (detect_prior) already found markers of the sheet in view, so what is missing is hidden (a hand, the sheet being\n    lifted away), not damaged: the speculative passes are skipped, only the plain pass and the cheap `_complete` run.\"\"\"\n    det = _detector()\n    m = _Merge()\n    corners, ids, rej = det.detectMarkers(gray)\n    m.add(corners, ids)\n    passes, used = 1, 0\n    min_side = lay.MARKER_MM * MIN_PPM                   # smaller quads cannot be a readable marker of the sheet\n    flat, probed = None, False\n    info = lambda: {\"detect_passes\": float(passes), \"detect_kernel\": float(used)}\n    if not m.solid():\n        _redecode(m, gray, (gray,), rej, min_side)\n    if not m.solid() and stack_seen:\n        passes += _complete(m, gray)\n        return m.found, m.dup, info()\n    if not m.solid():\n        if _off_frame(m, gray.shape):\n            return m.found, m.dup, info()\n        if not (m.found or markerlike(gray, rej, min_side)):\n            # nothing marker-like on the raw frame: one probe on the lighting-flattened copy (a dim / gradient-lit marker has too little\n            # contrast to look like one before flattening); an empty scene stops here after two cheap passes\n            flat = flatten_lighting(gray)\n            c3, i3, rej = det.detectMarkers(flat)\n            m.add(c3, i3)\n            passes += 1\n            if not m.solid():\n                _redecode(m, gray, (gray, flat), rej, min_side)\n            if not m.solid() and not (m.found or markerlike(flat, rej, min_side)):\n                return m.found, m.dup, info()\n            probed = True\n        steps = ladder(gray.shape)\n        hint = None if probed else m.module_px()      # (after the flat probe the scale is not trusted yet)\n        if hint is not None:\n            steps = sorted(steps, key=lambda s: abs(np.log(s / hint)))\n            steps = [hint] + steps[:2]                   # the marker seen so far gives the scale; neighbours as a fallback\n        else:\n            steps = steps[1:] + steps[:1] if len(steps) > 2 else steps     # most likely scales first\n        done_k = set()\n        for s in steps:\n            k = _kernel(s, KERNEL_OF_MODULE)\n            if k in done_k:\n                continue\n            done_k.add(k)\n            opened = cv2.morphologyEx(gray, cv2.MORPH_OPEN, np.ones((k, k), np.uint8))\n            c2, i2, rej = det.detectMarkers(opened)\n            m.add(c2, i2)\n            passes += 1\n            if not m.solid():\n                _redecode(m, gray, (gray, opened), rej, min_side)\n            if m.solid():\n                used = k\n                break\n        if not m.solid() and m.found:                   # last resort on a lighting-flattened copy (dim / shadowed / gradient-lit frame)\n            if not probed:\n                flat = flatten_lighting(gray)\n                c3, i3, rej = det.detectMarkers(flat)\n                m.add(c3, i3)\n                passes += 1\n                if not m.solid():\n                    _redecode(m, gray, (gray, flat), rej, min_side)\n            if m.found and not m.solid():\n                k = _kernel(m.module_px(), KERNEL_OF_MODULE)\n                c4, i4, rej = det.detectMarkers(cv2.morphologyEx(flat, cv2.MORPH_OPEN, np.ones((k, k), np.uint8)))\n                m.add(c4, i4)\n                passes += 1\n            if m.solid():\n                used = -1\n    passes += _complete(m, gray)\n    return m.found, m.dup, info()\n\n\n# ---------------------------------------------------------------- temporal prior (video)\nPRIOR_PAD = 1.2          # a prior marker is searched in a window this many marker sides wider than the marker, on every side\nPRIOR_MAX_SHIFT = 0.9    # ... and accepted when its centre moved less than this many marker sides since the previous frame\n\n\ndef prior_from(res_corners) -> Optional[Dict[int, np.ndarray]]:\n    \"\"\"The marker corners of a frame result (RecognitionResult.marker_corners: id -> 4x2 list) as a prior for the next frame, or None\n    when fewer than MIN_FOR_STOP markers of one page group are known (a half-hidden sheet is not a position to rely on).\"\"\"\n    if not res_corners:\n        return None\n    groups: Dict[int, int] = {}\n    for i in res_corners:\n        groups[i // 4] = groups.get(i // 4, 0) + 1\n    g, n = max(groups.items(), key=lambda kv: kv[1])\n    if n < MIN_FOR_STOP:\n        return None\n    return {i: np.asarray(c, np.float64).reshape(4, 2) for i, c in res_corners.items() if i // 4 == g}\n\n\ndef detect_prior(gray: np.ndarray, prior: Dict[int, np.ndarray]) -> Dict[int, np.ndarray]:\n    \"\"\"The prior's markers searched only in a small window around where each was in the previous frame (a camera held over a stack of\n    sheets sees the next sheet's markers where the last one's were).  A window is ~3-4 marker sides wide, so a detector run costs\n    ~1 ms instead of ~15 ms for the frame.  Only the SAME id found near its old place counts.\"\"\"\n    h, w = gray.shape[:2]\n    det, out = _detector(), {}\n    for mid, q in prior.items():\n        side = _side(q)\n        ctr = q.mean(0)\n        r = (0.5 + PRIOR_PAD) * side\n        x0, y0 = np.maximum((ctr - r).astype(int), 0)\n        x1, y1 = np.minimum((ctr + r).astype(int) + 1, [w, h])\n        if x1 - x0 < side or y1 - y0 < side:\n            continue\n        corners, ids, _ = det.detectMarkers(gray[y0:y1, x0:x1])\n        if ids is None:\n            continue\n        for c, i in zip(corners, ids.ravel()):\n            if int(i) != mid:\n                continue\n            c = c.reshape(4, 2).astype(np.float64) + (x0, y0)\n            if np.linalg.norm(c.mean(0) - ctr) < PRIOR_MAX_SHIFT * side:\n                out[mid] = c\n                break\n    return out\n\n\n# ---------------------------------------------------------------- resolution-aware detection\nDETECT_LONG_SIDE = 1920                  # frames larger than this are searched on an INTER_AREA copy, corners refined at full size\n\n\ndef find_markers_scaled(gray: np.ndarray, prior: Optional[Dict[int, np.ndarray]] = None) -> Tuple[Dict[int, np.ndarray], bool, Dict[str, float]]:\n    \"\"\"find_markers, but on a copy whose long side is DETECT_LONG_SIDE when the frame is larger (24 MP photos);\n    the corners are mapped back and sub-pixel refined on the full-size image. Frames up to that size run unchanged.\n\n    `prior` (omr.detect.prior_from of the previous frame): the markers are first looked for in small windows where they were; when they are\n    all (>= 3) there, that is the answer; when some are, the plain pass decides whether another sheet is in view and the speculative passes\n    (opened ladder, flattening) are skipped - the rest of the sheet is hidden, not damaged.\"\"\"\n    h, w = gray.shape[:2]\n    s = DETECT_LONG_SIDE / max(h, w)\n    small = gray if s >= 1.0 else cv2.resize(gray, (max(int(round(w * s)), 1), max(int(round(h * s)), 1)), interpolation=cv2.INTER_AREA)\n    k = 1.0 if s >= 1.0 else s\n    near, stack_seen = {}, False\n    if prior:\n        near = detect_prior(small, {i: c * k for i, c in prior.items()})\n        stack_seen = bool(near)\n        if len(near) >= MIN_FOR_STOP:\n            m = _Merge()\n            m.add([c.reshape(1, 4, 2) for c in near.values()], np.array(list(near)).reshape(-1, 1))\n            passes = _complete(m, small)          # a 4th marker the windows did not give (same search as after a full pass)\n            found, dup, info = m.found, m.dup, {\"detect_passes\": float(passes), \"detect_kernel\": 0.0, \"detect_prior\": 1.0}\n        else:\n            found, dup, info = find_markers(small, stack_seen)\n    else:\n        found, dup, info = find_markers(small)\n    if s >= 1.0:\n        return found, dup, info\n    sx, sy = w / small.shape[1], h / small.shape[0]\n    out = {}\n    for i, c in found.items():\n        p = ((c + 0.5) * (sx, sy) - 0.5).astype(np.float32)      # pixel-centre convention\n        win = max(2, int(round(0.3 * _side(p) / 6)))             # 0.3 module, as the detector's own refinement\n        p = cv2.cornerSubPix(gray, p.reshape(-1, 1, 2), (win, win), (-1, -1), _SUBPIX).reshape(4, 2)\n        out[i] = p.astype(np.float64)\n    info[\"detect_scale\"] = float(s)\n    return out, dup, info\n", "omr/fastops.py": "\"\"\"Small numpy replacements for hot calls whose Python-level overhead dominates on small arrays (Pyodide / wasm pays it most).\nEvery function returns exactly what the numpy call it replaces returns (same dtype, same bits).\"\"\"\nfrom __future__ import annotations\n\nimport numpy as np\n\n\ndef pct_rows(a: np.ndarray, q: float) -> np.ndarray:\n    \"\"\"`np.percentile(a, q, axis=1)` of a 2-D array without NaNs (method 'linear', as numpy computes it for a scalar q).\"\"\"\n    n = a.shape[1]\n    vi = (n - 1) * np.true_divide(q, 100)\n    lo = int(vi)\n    hi = lo + 1 if lo + 1 < n else lo\n    t = float(vi - lo)\n    p = np.partition(a, [lo, hi] if hi != lo else [lo], axis=1)\n    x, y = p[:, lo], p[:, hi]\n    d = y - x\n    out = x + d * t\n    if t >= 0.5:\n        out = y - d * (1 - t)\n    return out\n\n\ndef nanmedian0(a: np.ndarray) -> np.ndarray:\n    \"\"\"`np.nanmedian(a, axis=0)` (all-NaN columns give NaN, no warning).  numpy routes small arrays holding NaNs through\n    np.ma.median, which costs ~40 us per call; a sort along the frame axis and the middle one / two values is the same number.\"\"\"\n    a = np.asarray(a)\n    if not np.isnan(a).any():\n        return np.median(a, axis=0)\n    s = np.sort(a, axis=0)                                  # NaN last\n    c = (~np.isnan(a)).sum(axis=0)\n    lo, hi = np.maximum(c - 1, 0) // 2, c // 2\n    x = np.take_along_axis(s, lo[None], axis=0)[0]\n    y = np.take_along_axis(s, np.minimum(hi, a.shape[0] - 1)[None], axis=0)[0]\n    out = np.where(lo == hi, x, (x + y) / 2).astype(a.dtype)       # even count: mean of the two middle values\n    return np.where(c == 0, np.nan, out).astype(a.dtype)\n\n\ndef pct1(a: np.ndarray, q: float) -> np.floating:\n    \"\"\"`np.percentile(a, q)` of an array without NaNs (any shape, flattened; method 'linear'): one partition instead of numpy's ~100 us of\n    Python-level quantile machinery per call.\"\"\"\n    a = np.asarray(a).ravel()\n    n = a.size\n    vi = (n - 1) * np.true_divide(q, 100)\n    lo = int(vi)\n    hi = lo + 1 if lo + 1 < n else lo\n    t = float(vi - lo)\n    p = np.partition(a, [lo, hi] if hi != lo else [lo])\n    x, y = p[lo], p[hi]\n    d = y - x\n    out = x + d * t\n    if t >= 0.5:\n        out = y - d * (1 - t)\n    return out\n\n\ndef pct_axis0(a: np.ndarray, q: float) -> np.ndarray:\n    \"\"\"`np.percentile(a, q, axis=0)` of a 2-D array without NaNs.\"\"\"\n    n = a.shape[0]\n    vi = (n - 1) * np.true_divide(q, 100)\n    lo = int(vi)\n    hi = lo + 1 if lo + 1 < n else lo\n    t = float(vi - lo)\n    p = np.partition(a, [lo, hi] if hi != lo else [lo], axis=0)\n    x, y = p[lo], p[hi]\n    d = y - x\n    out = x + d * t\n    if t >= 0.5:\n        out = y - d * (1 - t)\n    return out\n", "omr/illum.py": "\"\"\"Lighting-robust bubble darkness.\n\nWhy this module exists\n----------------------\n``omr.recognize._paper_level`` estimates the local paper brightness with a 10 mm max filter plus a 3 mm blur.  A\nmax filter reaches across a hard shadow edge, so an *empty* bubble inside a shadow is divided by the brightness of\nthe lit paper 5-10 mm away and reads as 30-50 % dark: a false mark (\"multi\" with two ~1.0 fills, silently wrong).\nSoft gradients are fine, step edges (a hand, a phone, a window frame) are not.  The same window also averages the\nsheet's printed grey bands into the paper level and cannot undo glare (additive light).\n\nWhat it does instead\n--------------------\n1. **Layout-guided paper sampling.**  The layout says exactly where bubbles are, so the nearest *known blank paper*\n   to a bubble is the thin annulus just outside its own printed ring (0.25-0.75 mm beyond the ring line, inside the\n   gap to the neighbouring bubble).  Eight sectors of that annulus give eight paper samples 2.5-3.5 mm from the\n   bubble centre, all around it.  A sample is a robust high percentile of the sector's pixels, so a ring touching it\n   or a bit of a neighbour's mark does not matter, and it can never be a mark of the bubble itself (a mark is inside\n   the ring).  This is local enough to respect a shadow edge and works under bands (it measures the band, not\n   the white outside it).\n2. **Edge-aware per-pixel paper level.**  The eight samples are clustered (values within ``CLUSTER_TOL`` of each\n   other).  Each disc pixel takes the paper level of the cluster with the largest spatial support *at that pixel*\n   (Gaussian weights from the pixel to each sample), so a bubble beside a shadow edge is normalised by the\n   paper on its own side only; a gradient or smooth shading is interpolated.  An isolated odd sector (a glyph, a\n   streak) is repaired from its two neighbours first.\n3. **Doubt is flagged, never guessed.**  If the per-pixel paper level still differs across the disc by more than\n   ``EDGE_TOL`` the shadow edge runs through the bubble: its darkness cannot be known, ``reliable`` is False and its\n   darkness pixels are returned as 0 (so it neither fakes a mark nor pollutes the per-sheet ink level).  The caller\n   must flag the question / digit.  Same for a paper level that is nearly black (no signal).\n4. **Local contrast (glare / additive light).**  A multiplicative normalisation cannot undo additive glare: it lifts\n   paper and ink alike so ``1 - pix/paper`` shrinks for *every* mark.  The printed rings are a black of known\n   strength all over the sheet.  Their darkness, relative to the page's median, is a local contrast factor ``c``\n   (smooth field, median over ~25 mm).  Darkness is divided by ``c`` (affine normalisation\n   ``(paper - pix) / (paper - local_black)``); where ``c`` falls below ``C_FLAG`` a mark could vanish into the\n   glare, so the bubble is flagged instead of trusted.\n\nContract\n--------\n``bubble_darkness(smooth, centers_mm, diameter_mm, ppm, method=\"final\")`` returns ``(D, reliable)``:\n``D`` is the (n_bubbles, n_disc_pixels) array that ``omr.recognize._bubble_darkness`` returns (0 = paper,\n1 = black, same disc pixels), ``reliable`` is a bool vector.  ``omr.ink`` and ``recognize._fill`` consume ``D``\nunchanged.  Alternatives B, D, F are kept for the benchmark (``scripts/illum_bench.py``).\n\nThe module is pure numpy / OpenCV, no I/O and no state; cost is a few ms per page.\n\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Dict, Optional, Tuple\n\nimport cv2\nimport numpy as np\n\nfrom .fastops import pct_rows\n\nINNER_DISC_FRAC = 0.72        # scored disc: same as omr.recognize.INNER_DISC_FRAC\nANN_IN_MM = 0.25              # annulus starts this far beyond the printed ring's centre line radius\nANN_OUT_MM = 0.75             # ... and ends here (the neighbour's ring is >= 1.3 mm - ring width away)\nN_SECT
