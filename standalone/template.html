<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamOMR - 단독 스캐너</title>
<style>
/*__CSS__*/
ul.scans li { cursor:pointer; } ul.scans li:active { background:#232a33; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:20; overflow:auto; padding:10px; }
.modal[hidden] { display:none; }
.modal .box { background:var(--card); border-radius:10px; padding:12px; max-width:720px; margin:0 auto; }
.modal h2 { margin:0 0 6px; font-size:17px; }
.qrow { border:1px solid #2a313b; border-radius:8px; padding:8px; margin:8px 0; }
.qrow.bad { border-color:var(--bad); } .qrow.doubt { border-color:var(--warn); }
.qrow canvas { width:100%; max-width:560px; display:block; border-radius:4px; background:#fff; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.chip { padding:2px 8px; border-radius:6px; background:#2a313b; font-size:13px; }
.chip.on { background:var(--ok); color:#000; } .chip.bad { background:var(--bad); color:#000; font-weight:700; } .chip.doubt { background:var(--warn); color:#000; font-weight:700; }
</style></head>
<body>
<div class="scan">
  <div>
    <div class="row" style="margin-bottom:8px">
      <select id="cam"></select>
      <button id="start" disabled>시작</button>
      <button id="torch" class="secondary" hidden>플래시</button>
      <button id="reset" class="secondary">초기화</button>
    </div>
    <div class="stage" id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="ov"></canvas>
      <div class="banner"><span class="state idle" id="state">대기</span><span id="res"></span></div>
      <div class="hint" id="hint">불러오는 중...</div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="missed" class="err" style="font-weight:bold;margin-top:6px" hidden></div>
  </div>
  <div class="card">
    <h1>최근 스캔</h1>
    <div class="row" style="margin-bottom:8px"><button id="csv" class="secondary" disabled>CSV 다운로드</button><span class="mut small" id="count">0건</span></div>
    <ul class="scans" id="recent"></ul>
  </div>
</div>
<div id="detail" class="modal" hidden><div class="box">
  <div class="row" style="justify-content:space-between"><h2 id="dtitle"></h2><button id="dclose" class="secondary">닫기</button></div>
  <label class="small"><input type="checkbox" id="donly" checked style="width:auto"> 문제 있는 문항만 보기</label>
  <div id="dbody"></div>
</div></div>
<div id="loading" class="loading"><div><b id="loadtitle">StreamOMR 불러오는 중</b><div id="loadmsg" class="mut"></div><div class="mut small">처음 한 번 약 30MB를 내려받습니다 (이후엔 캐시).</div></div></div>
<script type="text/plain" id="worker-src">/*__WORKER__*/</script>
<script type="application/json" id="omr-src">/*__SOURCES__*/</script>
<script>
'use strict';
const PYODIDE_BASE = '/*__PYODIDE_BASE__*/';
/*__APP__*/
</script>
</body></html>
